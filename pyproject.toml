[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ft-engine"
dynamic = ["version"]
description = "Deterministic process engine for solo dev + AI workflows"
readme = "docs/ft_engine_usage.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Symlabs" },
]
keywords = ["ai", "automation", "process-engine", "workflows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ft = "ft.cli.main:main"

[project.urls]
Homepage = "https://github.com/symlabs-ai/fast-track_process"
Repository = "https://github.com/symlabs-ai/fast-track_process"
Issues = "https://github.com/symlabs-ai/fast-track_process/issues"

[tool.hatch.version]
path = "ft/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["ft"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
"AGENTS.md" = "AGENTS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
