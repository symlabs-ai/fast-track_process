[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ft-engine"
dynamic = ["version"]
description = "Deterministic process engine for solo dev + AI workflows"
readme = "docs/ft_engine_usage.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Symlabs" },
]
keywords = ["ai", "automation", "process-engine", "workflows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.20",
    "pre-commit>=3.5.0",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "types-PyYAML>=6.0",
]

[project.scripts]
ft = "ft.cli.main:main"

[project.urls]
Homepage = "https://github.com/symlabs-ai/fast-track_process"
Repository = "https://github.com/symlabs-ai/fast-track_process"
Issues = "https://github.com/symlabs-ai/fast-track_process/issues"

[tool.hatch.version]
path = "ft/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["ft"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
"AGENTS.md" = "AGENTS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=ft --cov-branch --cov-report=term:skip-covered --cov-fail-under=70"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Erros de sintaxe/runtime e imports determinísticos. Outras famílias Ruff
# entram em migrações próprias, com a dívida histórica quitada antes do gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
# Gate incremental: estes módulos já têm fronteiras tipadas e críticas para
# estado, evidência e seleção de executor. Expanda a lista após cada módulo
# satisfazer o checker, sem mascarar a dívida do restante do engine.
files = [
    "ft/engine/agent_policy.py",
    "ft/engine/api_context.py",
    "ft/engine/focal_evidence.py",
    "ft/engine/git_ops.py",
    "ft/engine/graph.py",
    "ft/engine/llm_defaults.py",
    "ft/engine/llm_usage.py",
    "ft/engine/paths.py",
    "ft/engine/state.py",
    "ft/templates/input_policy.py",
]
python_version = "3.11"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
