# Processo Base — Fast Track
# Template mínimo. Customize conforme o domínio do projeto.
# Docs: docs/PRD.md, docs/TECH_STACK.md

id: base_process
version: 1.1.0

execution_policy:
  entrypoint: run
  template: base
  materialization: copy_once
  runtime_source: local_only
  requires_initialized_project: true
  requires_worktree: true
  local_process_path: .ft/process/base/process.yml
  merge_command: ft close --merge full

input_policy:
  required: false
  destination: docs/demanda.md
  prompt: "Descreva a demanda do projeto"

correction_policy:
  follow_graph_after_retry: true
  mandatory_after_implementation:
    - validate

artifact_policy:
  canonical:
    - docs/PRD.md
    - docs/TECH_STACK.md
    - docs/hipotese.md
  cycle:
    - .build_ok
    - docs/validation-report.md

sprints:
  - id: sprint-01-discovery
    title: "Discovery"
  - id: sprint-02-build
    title: "Build"
  - id: sprint-03-validate
    title: "Validação"

nodes:
  - id: start
    type: discovery
    title: "Ler e Validar PRD"
    executor: llm_coach
    expert: marketing_analyst
    sprint: sprint-01-discovery
    max_turns: 10
    outputs:
      - docs/hipotese.md
    prompt: |
      Leia docs/PRD.md e docs/TECH_STACK.md.
      Registre em docs/hipotese.md apenas o que essas fontes sustentam. Não
      faça pesquisa externa neste node. Use exatamente as seções exigidas pelos
      validadores e classifique as afirmações como FATO, INFERÊNCIA ou HIPÓTESE.
      Ao final diga DONE.
    validators:
      - file_exists: docs/hipotese.md
      - has_sections:
          path: docs/hipotese.md
          sections:
            - Decisão e segmento
            - Hipótese
            - Evidências e confiança
            - Lacunas
            - Experimentos priorizados
      - document_quality:
          path: docs/hipotese.md
          min_lines_count: 18
          required_terms: [FATO, INFERÊNCIA, HIPÓTESE]
          min_required_terms: 3
    next: build

  - id: build
    type: build
    title: "Implementar MVP"
    executor: llm_coder
    sprint: sprint-02-build
    max_turns: 60
    outputs:
      - .build_ok
    prompt: |
      Implemente o MVP conforme docs/PRD.md e docs/TECH_STACK.md.
      Ao final diga DONE.
    validators:
      - file_exists: .build_ok
    next: validate

  - id: validate
    type: review
    title: "Validação Final"
    executor: llm_coder
    expert: code_reviewer
    no_pre_seed: true
    sprint: sprint-03-validate
    max_turns: 30
    outputs:
      - docs/validation-report.md
    write_scope:
      - docs/validation-report.md
    prompt: |
      Verifique que o MVP atende aos critérios de docs/PRD.md e respeita
      docs/TECH_STACK.md. Use a baseline exata fornecida no contexto auditável
      deste node e inspecione o delta corrente contra ela.

      Gere docs/validation-report.md com exatamente estes headings Markdown:
      ## Veredito
      ## Baseline e escopo
      ## Findings bloqueantes
      ## Evidências executadas
      ## Limitações e riscos residuais
      ## Notas não bloqueantes

      Em Veredito, escreva exatamente uma linha `VERDICT: APPROVED`,
      `VERDICT: REJECTED` ou `VERDICT: BLOCKED`. Cada evidência deve registrar
      fonte (path:linha ou comando), resultado observado e relação com o PRD.
      APPROVED exige a frase `Nenhum finding bloqueante.` na seção correspondente.
      REJECTED exige findings identificados como F-001, F-002, ... . BLOCKED
      deve explicar qual evidência necessária está ausente. Não altere o produto.
      Ao final diga DONE.
    validators:
      - file_exists: docs/validation-report.md
      - has_sections:
          path: docs/validation-report.md
          sections:
            - Veredito
            - Baseline e escopo
            - Findings bloqueantes
            - Evidências executadas
            - Limitações e riscos residuais
            - Notas não bloqueantes
      - document_quality:
          path: docs/validation-report.md
          min_lines_count: 18
          required_terms: [VERDICT, Baseline, Evidências, Limitações]
          min_required_terms: 4
      - expert_review_report_valid:
          path: docs/validation-report.md
    next: end

  - id: end
    type: end
    title: "Concluído"
