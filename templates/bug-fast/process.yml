# Bug Fast — correção focal com sessão persistente e auditoria independente
#
# Este arquivo global nunca é executado diretamente. Na primeira invocação de
# `ft run . --template bug-fast`, o engine materializa todo o diretório em
# `.ft/process/bug-fast/` e executa somente a cópia local versionada.

id: bug_fast
version: "1.1.1"
title: "Bug Fast — RED→GREEN, Review e Reconciliação Determinística"

execution_policy:
  entrypoint: run
  template: bug-fast
  materialization: copy_once
  runtime_source: local_only
  requires_initialized_project: true
  requires_worktree: true
  local_process_path: .ft/process/bug-fast/process.yml
  merge_command: ft close --merge full

session_policy:
  mode: sprint
  providers:
    - claude
    - codex
  initial_plan: disabled
  parallel_strategy: fork
  recovery: rehydrate

input_policy:
  required: true
  destination: docs/feature-request.md
  prompt: "Descreva o bug reproduzível a corrigir"

parallel_policy:
  planner_timeout_seconds: 120
  rate_limit_respawns: 0

# A validação completa pós-GREEN substitui hooks amplos e evita executar a
# mesma suíte novamente no auto-commit.
commit_policy:
  verify_hooks: false

correction_policy:
  follow_graph_after_retry: true
  acceptance_rejection_restarts_at: bug.diagnose_fix
  mandatory_after_implementation:
    - bug.review
    - bug.fix_review
    - bug.acceptance

# Bugs pertencem a uma FEAT existente e a exatamente um PB. Em batch, o
# orquestrador reserva os PBs antes de criar as worktrees da wave.
close_policy:
  backlog:
    mode: referenced
    references_path: docs/bug-report.md
    reference_field: backlog_item
    required_count: 1
    accepted_statuses:
      - done
      - accepted
  features_catalog: required
  merge: full

artifact_policy:
  canonical:
    - CHANGELOG.md
    - docs/PROJECT_BACKLOG.md
    - docs/FEATURES.md
  cycle:
    - docs/feature-request.md
    - docs/bug-baseline.yml
    - docs/bug-report.md
    - docs/bug-validation.json
    - docs/bug-review.md
    - docs/bug-review.yml
    - docs/bug-fix-baseline.yml
    - docs/bug-fix-review.md
    - docs/bug-fix-review.yml
    - docs/stakeholder-feedback.md
    - docs/bug-result.md

nodes:
  - id: bug.preflight
    type: gate
    title: "Confirmar Baseline e Governança do Bug"
    description: >-
      Valida demanda, produto, backlog e catálogo e grava a baseline sem rodar
      build ou testes. Escopos sensíveis ou que representam nova capacidade
      devem usar feature-fast.
    sprint: bug-01-fix
    executor: python
    outputs:
      - docs/bug-baseline.yml
    validators:
      - file_exists: docs/feature-request.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - file_exists: docs/FEATURES.md
      - file_exists: CHANGELOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py baseline"
          timeout: 10
      - file_exists: docs/bug-baseline.yml
    next: bug.diagnose_fix

  - id: bug.diagnose_fix
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    type: build
    context_profile: bug_fast.fix
    title: "Reproduzir e Corrigir o Bug"
    description: >-
      Uma delegação identifica a causa, prova o defeito com um teste RED,
      implementa a correção mínima e prova GREEN com o mesmo comando e teste.
      Depois o gate executa build e suíte completa uma única vez.
    sprint: bug-01-fix
    executor: claude
    max_turns: 36
    llm_timeout_seconds: 900
    llm_episode: bug_fix
    llm_episode_budget_seconds: 1200
    llm_episode_max_calls: 2
    env_setup:
      - python .ft/process/bug-fast/scripts/validate_bug.py begin
    outputs:
      - project/
      - src/
      - test/
      - tests/
      - docs/bug-report.md
    write_scope:
      - project
      - src
      - test
      - tests
      - docs/bug-report.md
    prompt: |
      Corrija exatamente UM defeito descrito em docs/feature-request.md.
      Não amplie comportamento, contrato ou arquitetura. O contexto focal já
      contém a demanda, baseline, catálogo, stack, feedback mais recente, diff
      e estado da tentativa.

      Contrato obrigatório:
      1. Identifique comportamento observado, esperado e causa raiz objetiva.
      2. Crie ou altere pelo menos um teste de regressão focal.
      3. Antes de alterar código de produto, execute exatamente:
         `.ft/process/bug-fast/scripts/product.sh red -- <comando> [args...]`.
         O comando deve mencionar o teste alterado e falhar pela asserção que
         demonstra o bug. Se já houver RED válido, reutilize-o.
      4. Implemente somente a correção mínima. Não altere o teste congelado.
      5. Execute o MESMO argv com:
         `.ft/process/bug-fast/scripts/product.sh green -- <comando> [args...]`.
      6. Não rode build, suíte completa ou E2E: o validator fará build+test uma
         vez e produzirá o receipt.
      7. Não altere CHANGELOG, backlog, FEATURES, reviews ou baselines.

      Se não houver reprodução determinística, a demanda for ambígua, exigir
      nova capacidade, mudança de contrato, auth/security, migration, reparo
      de dados, dependência/lockfile, infraestrutura ou correção transversal,
      não faça correção parcial. Escreva `Resultado: ESCALATE` no relatório e
      recomende `ft run . --template feature-fast`.

      Crie docs/bug-report.md com frontmatter:
        backlog_item: PB-NNN
        target_feature: FEAT-NNN
        severity: low | medium | high | critical

      Em batch, preserve exatamente o `reserved_backlog_item` da demanda como
      backlog_item. Fora de batch, reutilize o PB explícito ou reserve o próximo
      ID livre. target_feature deve existir; bug nunca cria FEAT nova.

      O relatório deve conter uma única linha `Resultado: FIXED`, as seções
      Sintoma, Comportamento esperado, Causa raiz, Regressão, Correção e Risco,
      além de `Comando de regressão: <argv interno>` e
      `Assinatura RED: <trecho objetivo presente na falha registrada>`.
    validators:
      - file_exists: docs/bug-report.md
      - command_succeeds:
          command: >-
            python .ft/process/bug-fast/scripts/validate_bug.py full
          resume_command: >-
            python .ft/process/bug-fast/scripts/validate_bug.py implementation
            && python .ft/process/bug-fast/scripts/validate_bug.py verify
          timeout: 420
    next: bug.review

  - id: bug.review
    type: review
    review_route_path: docs/bug-review.yml
    context_profile: bug_fast.review
    title: "Revisar Independentemente o Bug"
    description: >-
      Uma sessão separada audita somente o diff do bug, a prova RED→GREEN, o
      receipt completo, a regressão e a contenção de escopo.
    sprint: bug-01-fix
    executor: claude
    max_turns: 28
    llm_timeout_seconds: 600
    outputs:
      - docs/bug-review.md
      - docs/bug-review.yml
    write_scope:
      - docs/bug-review.md
      - docs/bug-review.yml
    prompt: |
      Faça uma revisão independente e focal do bug. Audite o diff desde a
      baseline, o teste congelado, a prova RED→GREEN e o receipt já executado.
      Não altere produto, teste, relatório, receipt ou documentos canônicos.
      Não repita build nem suíte completa. Se indispensável, rode somente uma
      sonda focal sem efeitos com `product.sh focal -- <comando> [args...]`.
      Faça uma passagem adversarial completa e reporte todos os achados
      acionáveis de uma vez: reprodução real, causa raiz, comando existente,
      teste falsificável, paths tocados, coerência do receipt e ausência de
      expansão de contrato. Não fragmente achados conhecidos em várias
      reentradas.

      Gere docs/bug-review.md mencionando cada path de produto alterado e
      avaliando regressão, correção mínima, receipt e escopo. Gere também
      docs/bug-review.yml:
        schema_version: 1
        verdict: APPROVED | REJECTED
        review_route: approved | fix | scope
        summary: texto não vazio
        base_commit: commit de docs/bug-baseline.yml
        receipt_fingerprint: fingerprint de docs/bug-validation.json
        checks:
          - id: regression | minimal_delta | receipt | scope
            status: PASS | FAIL
            evidence: texto não vazio
        findings:
          - id: B-01
            status: open
            route: fix | scope
            evidence: texto acionável

      Em APPROVED, todos os quatro checks são PASS, findings é vazio e a rota é
      approved. Em REJECTED, ao menos um check falha e cada achado é atômico:
      use fix para defeito corrigível sem mudar contrato e scope quando a
      demanda precisa migrar para feature-fast.
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py verify"
          stop_on_failure: true
      - file_exists: docs/bug-review.md
      - file_exists: docs/bug-review.yml
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py review"
    next: bug.review_route

  - id: bug.review_route
    type: gate
    title: "Registrar Rota da Review"
    sprint: bug-01-fix
    executor: python
    validators:
      - read_artifact:
          path: docs/bug-review.yml
          key: review_route
          pattern: "review_route:\\s*(approved|fix|scope)"
    next: bug.review_decision

  - id: bug.review_decision
    type: decision
    title: "Encaminhar Veredicto da Review"
    sprint: bug-01-fix
    executor: python
    condition: review_route
    branches:
      approved: bug.acceptance
      fix: bug.fix_prepare
      scope: bug.scope_block
      _default: bug.review
    episode_restart:
      fix: bug_fix
      scope: bug_fix

  - id: bug.fix_prepare
    type: gate
    title: "Ancorar Correção Focal"
    description: >-
      Preserva deterministicamente o receipt e os achados B-* da review
      rejeitada, delimitando o delta que poderá ser corrigido e auditado.
    sprint: bug-01-fix
    executor: python
    outputs:
      - docs/bug-fix-baseline.yml
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py prepare-fix"
          stop_on_failure: true
      - file_exists: docs/bug-fix-baseline.yml
    next: bug.fix

  - id: bug.fix
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    type: build
    context_profile: bug_fast.fix
    title: "Corrigir Somente os Achados B-*"
    description: >-
      Reutiliza a sessão do builder para corrigir apenas os achados atômicos da
      review, preservando o teste RED e todo o restante do produto.
    sprint: bug-01-fix
    executor: claude
    max_turns: 24
    llm_timeout_seconds: 600
    llm_episode: bug_fix
    llm_episode_budget_seconds: 900
    llm_episode_max_calls: 2
    env_setup:
      - python .ft/process/bug-fast/scripts/validate_bug.py begin-fix
    outputs:
      - project/
      - src/
      - test/
      - tests/
      - docs/bug-report.md
    write_scope:
      - project
      - src
      - test
      - tests
      - docs/bug-report.md
    prompt: |
      Faça somente o fix focal dos B-* abertos na review ancorada em
      docs/bug-fix-baseline.yml. Preserve o teste de regressão congelado, o
      contrato e todos os comportamentos não citados pelos achados.

      Execute o mesmo comando com `product.sh green`; não rode build ou suíte
      completa. Não reescreva reviews, baseline, receipt, backlog, FEATURES ou
      changelog. Atualize a seção Correção/Risco do bug-report apenas quando
      necessário. Se o fix exigir contrato, capacidade, path sensível ou
      expansão transversal, pare e deixe a review encaminhar para feature-fast.
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py fix-implementation"
          timeout: 30
    next: bug.fix_review

  - id: bug.fix_review
    type: review
    review_route_path: docs/bug-fix-review.yml
    context_profile: bug_fast.fix_review
    title: "Auditar Somente o Fix"
    description: >-
      A sessão independente de review audita somente o delta desde a âncora e
      cada B-* original, sem reabrir partes não tocadas.
    sprint: bug-01-fix
    executor: claude
    max_turns: 24
    llm_timeout_seconds: 600
    outputs:
      - docs/bug-fix-review.md
      - docs/bug-fix-review.yml
    write_scope:
      - docs/bug-fix-review.md
      - docs/bug-fix-review.yml
    prompt: |
      Audite somente o delta do fix desde docs/bug-fix-baseline.yml e os B-*
      originais. Não reabra julgamentos não afetados, não altere produto e não
      repita build/test. O validator confirma o receipt completo ancorado antes
      do fix; uma nova suíte completa só será executada depois da aprovação
      desta auditoria.

      Gere docs/bug-fix-review.md mencionando cada path do delta e cada B-*.
      Gere docs/bug-fix-review.yml:
        schema_version: 1
        verdict: APPROVED | REJECTED
        review_route: approved | fix | full_review | scope
        summary: texto não vazio
        source_review: docs/bug-review.yml
        base_commit: commit da âncora
        receipt_fingerprint: fingerprint do receipt ancorado
        findings:
          - id: B-01
            status: PASS | FAIL
            evidence: texto verificável

      Liste exatamente todos os B-* originais. approved exige todos PASS e
      nenhum delta fora do conjunto de paths original. Use fix para B-* ainda
      falho, full_review para delta que escapou dos paths ancorados e scope para
      mudança de contrato/capacidade que deve migrar para feature-fast.
    validation_mode: fail_fast
    validators:
      - file_exists: docs/bug-fix-review.md
      - file_exists: docs/bug-fix-review.yml
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py fix-review"
    next: bug.fix_review_route

  - id: bug.fix_review_route
    type: gate
    title: "Registrar Rota da Auditoria do Fix"
    sprint: bug-01-fix
    executor: python
    validators:
      - read_artifact:
          path: docs/bug-fix-review.yml
          key: review_route
          pattern: "review_route:\\s*(approved|fix|full_review|scope)"
    next: bug.fix_review_decision

  - id: bug.fix_review_decision
    type: decision
    title: "Encaminhar Auditoria do Fix"
    sprint: bug-01-fix
    executor: python
    condition: review_route
    branches:
      approved: bug.fix_full_validate
      fix: bug.fix
      full_review: bug.review
      scope: bug.scope_block
      _default: bug.fix_review
    episode_restart:
      fix: bug_fix
      scope: bug_fix

  - id: bug.fix_full_validate
    type: gate
    title: "Validar Fix Aprovado por Completo"
    description: >-
      Depois da auditoria focal aprovar o delta, executa build+test uma única
      vez e renova o receipt antes do aceite. Tentativas intermediárias de fix
      não pagam novamente a suíte completa.
    sprint: bug-01-fix
    executor: python
    validation_mode: fail_fast
    outputs:
      - docs/bug-validation.json
    validators:
      - command_succeeds:
          command: >-
            python .ft/process/bug-fast/scripts/validate_bug.py fix-implementation
            && python .ft/process/bug-fast/scripts/validate_bug.py full
          resume_command: >-
            python .ft/process/bug-fast/scripts/validate_bug.py fix-implementation
            && python .ft/process/bug-fast/scripts/validate_bug.py implementation
            && python .ft/process/bug-fast/scripts/validate_bug.py verify
          timeout: 420
    on_fail:
      human_gate: >-
        A suíte completa do fix aprovado falhou; corrija somente a regressão
        observada e preserve os achados ancorados.
      goto: bug.fix
    next: bug.acceptance

  - id: bug.scope_block
    type: gate
    title: "Escopo Excede Bug Fast"
    description: >-
      Interrompe o ciclo sem merge: aborte este bug e abra a demanda com
      `ft run . --template feature-fast`.
    sprint: bug-01-fix
    executor: python
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py scope-block"
          timeout: 10
    next: bug.end

  - id: bug.acceptance
    type: human_gate
    title: "Aceite da Correção"
    description: >-
      Confirme que o sintoma desapareceu sem regressão observável. A review
      independente já aprovou o estado atual. Uma rejeição reproduzível volta
      ao RED→GREEN e exige nova review antes de retornar.
    sprint: bug-02-acceptance
    executor: python
    env_setup:
      - bash .ft/process/bug-fast/scripts/serve.sh
    env_teardown:
      - bash .ft/process/bug-fast/scripts/serve.sh stop
    outputs:
      - docs/stakeholder-feedback.md
    reject_next: bug.diagnose_fix
    next: bug.reconcile

  - id: bug.reconcile
    type: gate
    title: "Reconciliar Registros Deterministicamente"
    description: >-
      Python atualiza apenas PB, FEAT e changelog autorizados e gera o resultado
      final a partir dos artefatos já validados, sem nova chamada LLM.
    sprint: bug-02-acceptance
    executor: python
    outputs:
      - CHANGELOG.md
      - docs/PROJECT_BACKLOG.md
      - docs/FEATURES.md
      - docs/bug-result.md
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py reconcile-apply"
          stop_on_failure: true
      - file_exists: CHANGELOG.md
      - file_exists: docs/bug-result.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
    next: bug.final_gate

  - id: bug.final_gate
    type: gate
    title: "Gate Final do Bug Fast"
    description: >-
      Reutiliza o receipt completo sem repetir testes e confirma review
      aprovada e reconciliação estritamente focal.
    sprint: bug-02-acceptance
    executor: python
    outputs:
      - docs/bug-result.md
    validators:
      - command_succeeds:
          command: "python .ft/process/bug-fast/scripts/validate_bug.py final"
          timeout: 15
    next: bug.end

  - id: bug.end
    type: end
    title: "Bug Fast Pronto para Merge"
    description: >-
      Correção aceita, RED→GREEN comprovado, review independente aprovada e
      documentação reconciliada sem uma terceira chamada LLM.
