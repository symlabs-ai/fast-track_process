# Feature Fast — Evolução Incremental com Sessões Persistentes
#
# Este arquivo global nunca é executado diretamente. Na primeira invocação de
# `ft run . --template feature-fast`, o engine materializa todo o diretório em
# `.ft/process/feature-fast/` e executa somente a cópia local versionada.

id: feature_fast
version: "2.0.3"
title: "Feature Fast — Feature com Sessões Persistentes"

execution_policy:
  entrypoint: run
  template: feature-fast
  materialization: copy_once
  runtime_source: local_only
  requires_initialized_project: true
  requires_worktree: true
  local_process_path: .ft/process/feature-fast/process.yml
  merge_command: ft close --merge full
  max_acceptance_criteria_per_cycle: 6
  project_role: maintenance
  allowed_project_phases:
    - maintenance

session_policy:
  mode: sprint
  providers:
    - claude
    - codex
  initial_plan: internal
  parallel_strategy: fork
  recovery: rehydrate

input_policy:
  required: true
  destination: docs/feature-request.md
  prompt: "Descreva a feature a implementar"

correction_policy:
  follow_graph_after_retry: true
  scope_rejection_restarts_at: feature.discovery
  acceptance_rejection_restarts_at: feature.implement
  mandatory_after_implementation:
    - feature.checks
    - feature.verify
    - feature.acceptance

# O mvp-builder decide todos os P0/P1 no encerramento do MVP. Um ciclo de
# feature decide apenas o PB selecionado; itens alheios permanecem no backlog.
close_policy:
  backlog:
    mode: referenced
    references_path: docs/feature.md
    reference_field: backlog_item
    required_count: 1
    accepted_statuses:
      - done
      - accepted
  features_catalog: required
  merge: full

artifact_policy:
  canonical:
    - checks/
    - CHANGELOG.md
    - docs/PRD.md
    - docs/TECH_STACK.md
    - docs/ui_criteria.md
    - docs/api_contract.md
    - docs/test_data.md
    - docs/PROJECT_BACKLOG.md
    - docs/FEATURES.md
  cycle:
    - docs/feature-request.md
    - docs/feature-baseline.yml
    - docs/feature-baseline-attestation.json
    - docs/feature-discovery.md
    - docs/feature-questions.md
    - docs/feature.md
    - docs/feature-plan.md
    - docs/feature-workset.yml
    - docs/feature-receipt-baseline.yml
    - docs/feature-id-reservation.yml
    - docs/feature-impact.yml
    - docs/feature-pre-review.md
    - docs/feature-pre-review.yml
    - docs/implementation-report.md
    - docs/feature-evidence.yml
    - docs/feature-validation.json
    - docs/feature-review-context.yml
    - docs/feature-review.md
    - docs/feature-review.yml
    - docs/feature-fix-baseline.yml
    - docs/feature-reconciliation.yml
    - docs/stakeholder-feedback.md
    - docs/feature-result.md
    - docs/screenshots/feature/

nodes:
  - id: feature.preflight
    type: gate
    title: "Preflight do Produto Existente"
    description: >-
      Confirma que a demanda está presente, o catálogo e o backlog são
      consistentes e a baseline do produto passa antes de qualquer alteração.
      Este gate é somente diagnóstico: uma baseline quebrada deve bloquear, não
      ser corrigida automaticamente como parte da feature.
    sprint: feature-01-scope
    executor: python
    validation_mode: fail_fast
    outputs:
      - docs/feature-baseline.yml
    validators:
      - file_exists: docs/feature-request.md
      - file_exists: docs/PRD.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - file_exists: docs/FEATURES.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py baseline"
          stop_on_failure: true
      - command_succeeds:
          command: >-
            bash .ft/process/feature-fast/scripts/product.sh ensure-baseline --record
            docs/feature-baseline-attestation.json
          resume_command: >-
            bash .ft/process/feature-fast/scripts/product.sh verify-baseline
            docs/feature-baseline-attestation.json
          timeout: 300
    next: feature.discovery

  - id: feature.discovery
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    context_profile: feature_delta.discovery
    type: discovery
    title: "Elucidar Demanda e Planejar Feature"
    description: >-
      Analisa a demanda contra produto, catálogo, backlog, código e testes.
      Formula somente perguntas que alterem comportamento, escopo, contrato ou
      aceite. Quando não houver ambiguidade, fecha a especificação e o plano.
    sprint: feature-01-scope
    executor: claude
    max_turns: 40
    llm_timeout_seconds: 600
    outputs:
      - docs/feature-discovery.md
      - docs/feature-questions.md
      - docs/feature.md
      - docs/feature-plan.md
      - docs/feature-workset.yml
    write_scope:
      - docs/feature-discovery.md
      - docs/feature-questions.md
      - docs/feature.md
      - docs/feature-plan.md
      - docs/feature-workset.yml
    prompt: |
      Trabalhe exclusivamente na elucidação de UMA feature para um produto já
      existente. Não implemente código neste node.

      Use o contexto delta fornecido pelo perfil `feature_delta.discovery`: ele
      já reúne a demanda imutável, o estado atual dos drafts, as fontes
      canônicas relevantes, a baseline e recortes do produto/testes. Abra
      arquivos adicionais somente quando uma decisão concreta exigir evidência.

      Determine se a demanda é:
      - new: uma única capacidade nova;
      - evolution: ampliação de uma FEAT-* existente;
      - improvement: melhoria/correção de uma FEAT-* existente.

      Se qualquer decisão alterar comportamento observável, contrato, dados,
      compatibilidade, critério de aceite ou fora de escopo, marque
      `clarification_status: required` em docs/feature-discovery.md e escreva
      perguntas numeradas e objetivas em docs/feature-questions.md. Não invente
      respostas. Gere feature.md e feature-plan.md como drafts coerentes com o
      que já é conhecido.

      Quando todas as decisões relevantes estiverem claras, marque exatamente
      `clarification_status: clear`, escreva em feature-questions.md que não há
      perguntas pendentes e finalize:

      docs/feature.md com frontmatter:
        type: new | evolution | improvement
        target_feature: new | FEAT-NNN
        backlog_item: PB-NNN
        priority: P0 | P1 | P2
        interface: ui | api | internal | mixed

      A demanda deve referenciar exatamente um PB-* já existente. Preserve esse
      ID e mantenha PROJECT_BACKLOG inalterado até a reconciliação pós-aceite.
      Ciclos paralelos devem usar PBs distintos; não aloque nem renumere PBs
      dentro da worktree.
      Para evolution/improvement, target_feature deve existir em FEATURES.

      feature.md deve conter Objetivo, Comportamento Esperado, Critérios de
      Aceite com IDs AC-01, AC-02..., Fora do Escopo e Restrições.
      Um ciclo feature-fast claro pode conter no máximo 6 ACs. Quando a demanda
      for maior, proponha fatias verticais independentes de 4–6 ACs, marque
      `clarification_status: required` e pergunte qual primeira fatia deve ser
      executada; não comprima nem descarte requisitos silenciosamente.

      feature-plan.md deve referenciar o mesmo PB-* e FEAT-*, listar impacto
      técnico, contratos afetados, tarefas ordenadas, estratégia de testes,
      compatibilidade/migração, evidências esperadas, riscos e a documentação
      canônica que precisará ser atualizada após o aceite. Todo ciclo deve
      prever a atualização de CHANGELOG.md, PROJECT_BACKLOG.md e FEATURES.md.

      feature-discovery.md deve preservar um resumo das perguntas e respostas
      que levaram ao escopo atual. Gere também docs/feature-workset.yml com uma
      lista curta de paths e testes provavelmente relevantes. Esse workset é uma
      dica focal e pode estar incompleto: nunca o trate como bloqueio rígido.
      Use `schema_version: 1` e `paths`. Quando houver um receipt adicional
      caro (por exemplo ensaio físico), declare também
      `receipt_dependencies`, lista opcional com `id`, `mode:
      automated|physical`, `receipt` e `depends_on` (globs relativos). Não
      declare a lane `product`, pois o processo a inclui automaticamente. Essa
      dependência permite reutilizar um ensaio físico apenas quando nenhum path
      que ele observa mudou.
      Não altere código, PROJECT_BACKLOG nem FEATURES neste node.
    validators:
      - file_exists: docs/feature-discovery.md
      - file_exists: docs/feature-questions.md
      - file_exists: docs/feature.md
      - file_exists: docs/feature-plan.md
      - file_exists: docs/feature-workset.yml
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - task_list_references_backlog:
          task_path: docs/feature-plan.md
          backlog_path: docs/PROJECT_BACKLOG.md
          min_refs: 1
      - command_succeeds: "python .ft/process/feature-fast/scripts/validate_feature.py discovery"
    next: feature.discovery_gate

  - id: feature.discovery_gate
    type: gate
    title: "Registrar Resultado do Discovery"
    description: >-
      Extrai deterministicamente o estado de clarificação para que a decisão
      seguinte encaminhe perguntas pendentes ou congele o escopo.
    sprint: feature-01-scope
    executor: python
    validators:
      - read_artifact:
          path: docs/feature-discovery.md
          key: clarification_status
          pattern: "clarification_status:\\s*(required|clear)"
    next: feature.clarity

  - id: feature.clarity
    type: decision
    title: "Demanda Está Clara?"
    description: "Encaminha perguntas pendentes ao stakeholder ou congela o escopo."
    sprint: feature-01-scope
    executor: python
    condition: clarification_status
    branches:
      required: feature.questions
      clear: feature.reserve_ids
      _default: feature.questions

  - id: feature.questions
    type: human_gate
    title: "Perguntas sobre a Feature"
    description: >-
      Leia docs/feature-questions.md e responda somente às perguntas pendentes
      com `ft approve "1. ... 2. ..."`. As respostas voltam ao discovery. Para
      cancelar sem levar mudanças ao checkout principal, use ft abort.
    sprint: feature-01-scope
    executor: python
    outputs:
      - docs/feature-questions.md
      - docs/feature-discovery.md
    next: feature.discovery

  - id: feature.reserve_ids
    type: gate
    title: "Reservar Identidade da Entrega"
    description: >-
      Confirma o PB preexistente e, para type=new, reserva um FEAT-* definitivo
      sob lock curto no git comum. Reservas nunca são reutilizadas; ciclos de
      evolution/improvement preservam a FEAT alvo.
    sprint: feature-01-scope
    executor: python
    outputs:
      - docs/feature-id-reservation.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds: "python .ft/process/feature-fast/scripts/validate_feature.py reserve"
      - file_exists: docs/feature-id-reservation.yml
    next: feature.scope_gate

  - id: feature.scope_gate
    type: human_gate
    title: "Aprovação do Escopo da Feature"
    description: >-
      Revise docs/feature.md e docs/feature-plan.md. Confirme objetivo, AC-*,
      fora de escopo, PB/FEAT selecionados, impacto e estratégia de testes. Uma
      rejeição deve explicar objetivamente o que precisa mudar.
    sprint: feature-01-scope
    executor: python
    outputs:
      - docs/feature.md
      - docs/feature-plan.md
    reject_next: feature.discovery
    next: feature.receipt_baseline

  - id: feature.receipt_baseline
    type: gate
    title: "Congelar Dependências dos Receipts"
    description: >-
      Registra deterministicamente a lane de validação completa e eventuais
      receipts adicionais declarados no workset antes de qualquer mudança no
      produto. Isso permite decidir rerun/reuse por impacto real.
    sprint: feature-01-scope
    executor: python
    outputs:
      - docs/feature-receipt-baseline.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py prepare-receipt-baseline"
          stop_on_failure: true
      - file_exists: docs/feature-receipt-baseline.yml
    next: feature.implement

  - id: feature.implement
    type: build
    context_profile: feature_delta.implement
    title: "Implementar Feature e Testes"
    description: >-
      Implementa código, testes e o check determinístico de cada AC-*. O check
      é escrito antes da implementação; relatórios e evidência são derivados
      mecanicamente do receipt pelos gates seguintes.
    sprint: feature-02-build
    executor: claude
    max_turns: 80
    llm_timeout_seconds: 1200
    llm_episode: feature_implementation
    llm_episode_budget_seconds: 1800
    llm_episode_max_calls: 2
    outputs:
      - project/
      - src/
      - checks/
    write_scope:
      - project
      - src
      - checks
      - docs/api_contract.md
      - docs/ui_criteria.md
      - docs/screenshots/feature
    prompt: |
      Implemente somente a feature aprovada. O perfil
      `feature_delta.implement` já fornece escopo, plano, feedback atual, diff e
      recortes relevantes do produto. Inspecione arquivos adicionais apenas
      para confirmar a mudança focal e preserve comportamentos fora do escopo.

      Regras:
      1. Para CADA AC-* do contrato, escreva `checks/AC-NNN.py` ANTES de
         implementar — um arquivo por AC, sem dependência além da stdlib, que
         sai com 0 quando o critério está cumprido e 1 quando não está,
         imprimindo o motivo. Escrever o check antes é o que o torna honesto:
         nesse momento ninguém tem interesse no resultado. Um check precisa
         poder reprovar; se ele passaria mesmo com o critério não entregue, ele
         não verifica nada.

         O check ancora no artefato que carrega a garantia — o código em `src/`
         ou `project/` para critérios de comportamento, o documento para
         critérios documentais (lendo o conteúdo exigido, nunca só a existência
         do arquivo). Um check que apenas procura um nome de função dentro de
         `tests/` continua verde com a garantia arrancada de `src/` e por isso
         não vale. O gate `feature.verify` executa todos eles e o veredicto do
         ciclo é o resultado dessa execução.
      2. Crie ou atualize testes para cada AC-* antes de concluir.
      3. Atualize api_contract/ui_criteria apenas quando o plano exigir.
      4. Não recrie scaffold, stack, Makefile ou infraestrutura do produto.
      5. Não atualize FEATURES nem conclua o PB antes do aceite humano.
      6. Durante a implementação, rode somente os testes focais necessários com
         `.ft/process/feature-fast/scripts/product.sh focal -- <comando> [args...]`.
         Não repita a suíte completa: após sua entrega, o gate determinístico
         executará `full --record docs/feature-validation.json`, cobrindo build
         e test nessa ordem e vinculando o resultado ao snapshot executável do
         produto.
      7. Não produza relatórios nem evidências narrativas: eles são derivados
         mecanicamente do receipt e dos checks pelos gates. Concentre a chamada
         em código, testes e checks.
      8. Em uma correção solicitada, considere o feedback mais recente e mantenha
         todo o restante aprovado funcionando.
    next: feature.impact_prepare

  - id: feature.impact_prepare
    type: gate
    title: "Calcular Impacto da Implementação"
    description: >-
      Expande o workset com o delta real e testes/pares semanticamente
      relacionados, calcula quais receipts foram impactados e emite o ID
      imutável da pré-revisão.
    sprint: feature-02-build
    executor: python
    outputs:
      - docs/feature-impact.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py prepare-impact"
          stop_on_failure: true
      - file_exists: docs/feature-impact.yml
    on_fail:
      human_gate: "O delta não forma uma implementação testável; corrija o produto antes de validar."
      goto: feature.implement
    next: feature.checks

  - id: feature.checks
    type: gate
    title: "Cobertura de Checks por AC"
    description: >-
      Confirma que cada AC-* tem o seu checks/AC-NNN.py e que nenhum check
      sobra, antes de gastar a suíte completa. Substitui a pré-revisão
      semântica: a falha aqui é estrutural e volta ao código barato.
    sprint: feature-02-build
    executor: python
    outputs:
      - docs/feature-pre-review.md
      - docs/feature-pre-review.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: python .ft/process/feature-fast/scripts/attest_checks.py pre
          stop_on_failure: true
      - command_succeeds: python .ft/process/feature-fast/scripts/validate_feature.py pre-review
    on_fail:
      human_gate: >-
        Há AC-* sem checks/AC-NNN.py ou check órfão sem AC. Escreva o check que
        falta na implementação — o fix focal não tem permissão de escrever checks.
      goto: feature.implement
    next: feature.pre_review_route
  - id: feature.pre_review_route
    type: gate
    title: "Registrar Rota da Pré-revisão"
    sprint: feature-02-build
    executor: python
    validators:
      - read_artifact:
          path: docs/feature-pre-review.yml
          key: review_route
          pattern: "review_route:\\s*(approved|implementation|scope)"
    next: feature.pre_review_decision

  - id: feature.pre_review_decision
    type: decision
    title: "Encaminhar Pré-revisão"
    sprint: feature-02-build
    executor: python
    condition: review_route
    branches:
      approved: feature.product_validate
      implementation: feature.implement
      scope: feature.discovery
      _default: feature.checks
    episode_restart:
      implementation: feature_implementation
      scope: feature_implementation

  - id: feature.product_validate
    type: gate
    title: "Validar Produto Implementado"
    description: >-
      Verifica primeiro a presença de mudanças e testes; somente então executa
      build+test uma vez. Em retomadas, ensure verifica o receipt local antes de
      considerar a suíte completa.
    sprint: feature-02-build
    executor: python
    outputs:
      - docs/feature-validation.json
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py implementation"
          stop_on_failure: true
      - command_succeeds:
          command: >-
            bash .ft/process/feature-fast/scripts/product.sh ensure --record
            docs/feature-validation.json
          resume_command: >-
            bash .ft/process/feature-fast/scripts/product.sh verify
            docs/feature-validation.json
          timeout: 300
    on_fail:
      human_gate: "A validação do produto falhou; corrija a implementação preservada."
      goto: feature.implement
    next: feature.evidence_gate

  - id: feature.evidence_gate
    type: gate
    title: "Validar Integridade das Evidências"
    description: >-
      Deriva o relatório e a evidência por AC do receipt já executado e então
      confirma referências, ACs, paths e receipt. A prova semântica não é
      opinião: é o check determinístico executado no gate seguinte.
    sprint: feature-02-build
    executor: python
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "bash .ft/process/feature-fast/scripts/product.sh verify docs/feature-validation.json"
          stop_on_failure: true
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/attest_checks.py evidence"
          stop_on_failure: true
      - file_exists: docs/implementation-report.md
      - file_exists: docs/feature-evidence.yml
      - command_succeeds: "python .ft/process/feature-fast/scripts/validate_feature.py evidence"
    on_fail:
      human_gate: "A evidência derivada do receipt está incompleta; corrija a implementação e seus testes."
      goto: feature.implement
    next: feature.review_prepare

  - id: feature.review_prepare
    type: gate
    title: "Congelar Contexto da Revisão Completa"
    description: >-
      Confirma a pré-revisão, evidências e receipts atuais; decide rerun/reuse
      por lane e gera um review_id ligado ao snapshot exato.
    sprint: feature-02-build
    executor: python
    outputs:
      - docs/feature-review-context.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py prepare-review"
          stop_on_failure: true
      - file_exists: docs/feature-review-context.yml
    on_fail:
      human_gate: "Um receipt impactado está ausente ou obsoleto; execute somente a lane indicada."
      goto: feature.product_validate
    next: feature.verify

  - id: feature.verify
    type: gate
    title: "Verificar AC pelos Checks Determinísticos"
    description: >-
      Executa um check por AC-* e deriva a atestação do resultado. Substitui a
      revisão semântica por LLM: o veredicto é a execução dos checks, e a
      qualidade deles é medida por mutação no aceite do stakeholder.
    sprint: feature-02-build
    executor: python
    outputs:
      - docs/feature-review.md
      - docs/feature-review.yml
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: bash .ft/process/feature-fast/scripts/product.sh verify docs/feature-validation.json
          stop_on_failure: true
      - command_succeeds:
          command: python .ft/process/feature-fast/scripts/attest_checks.py attest
          stop_on_failure: true
          timeout: 900
      - command_succeeds: python .ft/process/feature-fast/scripts/validate_feature.py review
    next: feature.review_route
  - id: feature.review_route
    type: gate
    title: "Registrar Rota da Revisão"
    sprint: feature-02-build
    executor: python
    validators:
      - read_artifact:
          path: docs/feature-review.yml
          key: review_route
          pattern: "review_route:\\s*(approved|implementation|evidence|scope)"
    next: feature.review_decision

  - id: feature.review_decision
    type: decision
    title: "Encaminhar Veredicto da Revisão"
    sprint: feature-02-build
    executor: python
    condition: review_route
    branches:
      approved: feature.acceptance
      implementation: feature.fix_prepare
      evidence: feature.evidence_gate
      scope: feature.discovery
      _default: feature.verify
    episode_restart:
      implementation: feature_implementation
      scope: feature_implementation

  - id: feature.fix_prepare
    type: gate
    title: "Ancorar Correção Focal"
    description: >-
      Preserva deterministicamente a revisão rejeitada, seus achados, o commit
      revisado, o workset e os contratos. Essa âncora delimita a correção e
      permite auditar somente seu delta.
    sprint: feature-02-build
    executor: python
    validation_mode: fail_fast
    outputs:
      - docs/feature-fix-baseline.yml
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py prepare-fix"
          stop_on_failure: true
      - file_exists: docs/feature-fix-baseline.yml
    next: feature.fix

  - id: feature.fix
    type: build
    context_profile: feature_delta.fix
    title: "Corrigir Somente os Achados"
    description: >-
      Corrige apenas os achados numerados da revisão rejeitada. O restante do
      produto, o contrato aprovado e o workset ficam congelados.
    sprint: feature-02-build
    executor: claude
    max_turns: 28
    llm_timeout_seconds: 600
    llm_episode: feature_implementation
    llm_episode_budget_seconds: 1200
    llm_episode_max_calls: 2
    outputs:
      - project/
      - src/
    write_scope:
      - project
      - src
    prompt: |
      Faça uma correção focal, não uma nova implementação. Use a âncora em
      docs/feature-fix-baseline.yml e os F-* de docs/feature-review.md — a
      atestação determinística — como autoridade. Cada F-* nomeia o
      `checks/AC-NNN.py` que reprovou e a saída dele.

      Regras:
      1. Altere somente o necessário para resolver os F-* ainda reprovados.
      2. Preserve os AC-* já aprovados, os contratos, o plano e o workset.
      3. Não faça refactor amplo, mudança oportunista ou expansão de escopo.
      4. Rode apenas testes/sondas focais durante a chamada com
         `.ft/process/feature-fast/scripts/product.sh focal -- <comando> [args...]`.
      5. Não reescreva as revisões, a âncora, o receipt ou documentação
         narrativa, e não altere `checks/` — corrigir o código é o único
         caminho para virar um check. O gate seguinte executará a validação
         completa uma vez e a atestação será refeita do zero.
      6. Se um achado só puder ser resolvido ampliando contrato, AC ou workset,
         preserve o diagnóstico e pare: a auditoria encaminhará para revisão
         completa.
    next: feature.fix_validate

  - id: feature.fix_validate
    type: gate
    title: "Validar Estado Corrigido"
    description: >-
      Confirma apenas que houve um delta focal de produto desde a âncora. A
      suíte completa fica adiada até a auditoria aprovar o fix, evitando
      repeti-la em tentativas intermediárias.
    sprint: feature-02-build
    executor: python
    validation_mode: fail_fast
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py fix-implementation"
          stop_on_failure: true
    on_fail:
      human_gate: >-
        A correção focal não satisfaz sua âncora; ajuste somente o achado.
      goto: feature.fix
    next: feature.fix_full_validate

  - id: feature.fix_full_validate
    type: gate
    title: "Validar Fix Aprovado por Completo"
    description: >-
      Após a auditoria focal aprovar o delta, renova uma única vez o receipt de
      build+test e as lanes impactadas antes do aceite.
    sprint: feature-02-build
    executor: python
    validation_mode: fail_fast
    outputs:
      - docs/feature-validation.json
    validators:
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py fix-implementation"
          stop_on_failure: true
      - command_succeeds:
          command: >-
            bash .ft/process/feature-fast/scripts/product.sh ensure --record
            docs/feature-validation.json
          resume_command: >-
            bash .ft/process/feature-fast/scripts/product.sh verify
            docs/feature-validation.json
          timeout: 300
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py fix-receipts"
          stop_on_failure: true
    on_fail:
      human_gate: >-
        A suíte completa ou um receipt impactado do fix aprovado falhou;
        corrija somente a regressão observada.
      goto: feature.fix
    next: feature.review_prepare

  - id: feature.acceptance
    type: human_gate
    title: "Aceite da Feature"
    description: >-
      Valide a capacidade implementada e seus AC-*. UI/API sobe pelo serve.sh;
      mudanças internas são avaliadas pelos relatórios e testes. Rejeite com um
      desvio reproduzível. Defeitos encontrados pela atestação usam correção
      focal, receipt completo e reexecução dos checks; uma rejeição do stakeholder
      reinicia a implementação por poder introduzir um requisito semântico novo.
    sprint: feature-03-acceptance
    executor: python
    env_setup:
      - bash .ft/process/feature-fast/scripts/serve.sh
    env_teardown:
      - bash .ft/process/feature-fast/scripts/serve.sh stop
    outputs:
      - docs/stakeholder-feedback.md
    reject_next: feature.implement
    next: feature.reconcile

  - id: feature.reconcile
    no_pre_seed: true
    type: document
    context_profile: feature_delta.reconcile
    title: "Reconciliar Backlog e Catálogo"
    description: >-
      Propõe somente a capacidade aceita neste ciclo. O validator confere IDs e
      aplica a proposta deterministicamente antes de validar a reconciliação.
    sprint: feature-03-acceptance
    executor: claude
    max_turns: 40
    llm_timeout_seconds: 480
    outputs:
      - docs/feature-reconciliation.yml
      - docs/feature-result.md
    write_scope:
      - docs/feature-reconciliation.yml
      - docs/feature-result.md
    prompt: |
      O stakeholder aprovou a feature. Proponha a reconciliação em
      docs/feature-reconciliation.yml; não edite diretamente os documentos
      canônicos. O validator aplicará o conteúdo proposto somente após conferir
      paths e IDs autorizados.

      - Marque o PB selecionado como accepted e registre evidências reais.
      - type=new: use exatamente o FEAT-* de feature-id-reservation.yml.
      - evolution/improvement: preserve a FEAT-* alvo, acrescente o PB, atualize
        evidência, descrição quando necessário e Última evolução.
      - Nunca renumere, reutilize ou apague IDs.
      - Bugs/dívidas/manutenção não criam uma FEAT-* nova.
      - Não decida, adie ou conclua itens de backlog alheios ao ciclo.
      - Atualize somente a documentação canônica realmente afetada pelo
        comportamento, contrato, configuração ou uso da feature; não faça churn
        em documentos alheios.
      - Crie ou atualize sempre CHANGELOG.md na raiz, preservando o formato já
        adotado pelo projeto. Preserve seções e o estilo de bullet existente,
        mas faça a entrada deste ciclo começar com `#FEAT` como primeiro token
        textual (`#FEAT ...` ou `- #FEAT ...`). Registre de forma humana o
        PB/FEAT, a mudança entregue e qualquer compatibilidade ou migração
        relevante.

      O YAML deve ter schema_version: 1, backlog_item, target_feature,
      final_feature_id, `backlog_row`, `feature_row`, `changelog_entry` e
      `documentation`. Forneça somente a linha Markdown completa do PB, a linha
      Markdown completa da FEAT e uma única entrada de changelog; o engine
      preservará o restante das tabelas e inserirá essas operações
      deterministicamente. `documentation` é um mapping opcional de outros
      paths canônicos afetados para seu conteúdo completo; não inclua nele
      CHANGELOG, PROJECT_BACKLOG ou FEATURES.

      Gere docs/feature-result.md com escopo entregue, AC-*, testes/build,
      evidências, PB/FEAT final, arquivos alterados, nenhuma pendência escondida
      e uma seção `Documentação atualizada` que liste os caminhos realmente
      reconciliados, incluindo sempre CHANGELOG.md, docs/PROJECT_BACKLOG.md e
      docs/FEATURES.md.
    validation_mode: fail_fast
    validators:
      - file_exists: docs/feature-reconciliation.yml
      - file_exists: docs/feature-result.md
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py proposal"
          stop_on_failure: true
      - command_succeeds:
          command: "python .ft/process/feature-fast/scripts/validate_feature.py apply-reconcile"
          stop_on_failure: true
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - command_succeeds: "python .ft/process/feature-fast/scripts/validate_feature.py reconcile"
    next: feature.final_gate

  - id: feature.final_gate
    type: gate
    title: "Gate Final da Feature"
    description: >-
      Confirma que o código ainda corresponde ao snapshot do receipt completo
      pós-implementação e valida os documentos reconciliados antes de declarar
      a worktree pronta para merge. Se qualquer arquivo, lockfile, script,
      ferramenta ou comando mudou, o receipt falha e a suíte deve ser refeita.
    sprint: feature-03-acceptance
    executor: python
    validation_mode: fail_fast
    outputs:
      - docs/feature-result.md
    validators:
      - command_succeeds: "bash .ft/process/feature-fast/scripts/product.sh verify docs/feature-validation.json"
      - command_succeeds: "python .ft/process/feature-fast/scripts/validate_feature.py reconcile"
    next: feature.end

  - id: feature.end
    type: end
    title: "Feature Pronta para Merge"
    description: >-
      Feature aceita e validada na worktree. Execute `ft close --merge full` para
      arquivar o ciclo, fazer merge no checkout principal e remover worktree e
      branch temporária. Use `ft abort` para descartar sem merge.
