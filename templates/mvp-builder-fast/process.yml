# MVP Builder Fast — Processo Completo com Sessões Persistentes
# Uso: ft run . --template mvp-builder-fast [--claude|--codex]
#
# Estrutura de diretórios:
#   docs/        — fontes de verdade humanas (PRD, tech stack, UI, backlog e features)
#   .ft/process/ — orquestração versionada (process.yml, scripts/, environment.yml)
#   .ft/cycles/  — histórico durável criado por ft close
#   src/      — todo código-fonte (frontend/, backend/, tests/, Makefile, etc.)
#
# REGRA: produtos com interface/serviço seguem o layout src/. Bibliotecas
#        headless preservam o layout canônico declarado em docs/TECH_STACK.md
#        (por exemplo src/, tests/ e examples/ na raiz), sem inventar frontend.

id: mvp_builder_fast
version: "1.19.0"
title: "MVP Builder Fast — MVP com Sessões Persistentes"

execution_policy:
  entrypoint: run
  template: mvp-builder-fast
  materialization: copy_once
  runtime_source: local_only
  requires_initialized_project: true
  requires_worktree: true
  local_process_path: .ft/process/mvp-builder-fast/process.yml
  merge_command: ft close --merge full
  project_role: builder
  allowed_project_phases:
    - building

product_engineering_policy:
  focus: product_and_software_engineering
  includes:
    - product_behavior_and_ux
    - architecture_code_data_and_apis
    - technical_security_quality_and_reliability
    - packaging_installation_and_technical_maintenance
  excludes:
    - legal_and_contractual_approval
    - marketing_sales_and_promotional_sites
    - market_research_recruiting_and_commercial_metrics
    - revenue_renewal_and_business_validation
  external_items:
    disposition: pending_downstream_team
    block_builder_delivery: false

session_policy:
  mode: sprint
  providers:
    - claude
    - codex
  initial_plan: internal
  parallel_strategy: fork
  recovery: rehydrate

# Opt-in com `ft run --parallel`. O usuário continua descrevendo a demanda em
# linguagem natural; um único planner produz este plano interno e o engine
# calcula waves, isola worktrees e valida o diff real de cada lane.
batch_policy:
  schema_version: 1
  plan_path: docs/mvp-batch-plan.yml
  request_path: docs/demanda.md
  report_path: docs/mvp-batch-report.md
  foundation_report_path: docs/mvp-batch-foundation.md
  evidence_root: docs/batches/mvp-builder-fast
  min_lanes: 2
  max_lanes: 8
  default_max_parallel: 2
  max_acceptance_criteria_per_lane: 6
  protected_paths:
    - .ft/
    - docs/PRD.md
    - docs/TECH_STACK.md
    - docs/PROJECT_BACKLOG.md
    - docs/FEATURES.md
    - docs/task_list.md
    - docs/api_contract.md
    - docs/ui_criteria.md
    - docs/ui-brief.md
    - docs/mockups/
    - docs/test_data.md
    - docs/mvp-batch-navigation-contract.yml

# A engine resolve este catálogo pela seção `validation` de .ft/project.yml.
# O grafo possui um único ponto de composição; Android, iOS, web e desktop não
# duplicam o lifecycle do builder nem exigem processos separados.
validation_policy:
  registry: builtin_v1
  project_contract_path: .ft/project.yml
  matrix_path: docs/validation-matrix.yml
  report_path: docs/platform-validation-report.yml
  evidence_root: docs/evidence/platform-validation

input_policy:
  required: false
  destination: docs/demanda.md
  prompt: "Descreva a ideia, hipótese ou demanda do MVP"

artifact_policy:
  canonical:
    - .ft/project.yml
    - docs/PRD.md
    - docs/TECH_STACK.md
    - docs/ui_criteria.md
    - docs/ui-brief.md
    - docs/mockups/
    - docs/PROJECT_BACKLOG.md
    - docs/FEATURES.md
    - docs/hipotese.md
    - docs/demanda.md
    - docs/api_contract.md
    - docs/test_data.md
    - docs/headless-validation-plan.md
    - docs/acceptance-result.json
    - docs/navigation-contract.yml
    - docs/test-identity.json
    - docs/validation-matrix.yml
    - docs/platform-validation-report.yml
    - docs/evidence/platform-validation/
    - docs/operational-readiness.md
    - docs/operational-readiness.yml
  cycle:
    - docs/direct-plan.md
    - docs/direct-review.md
    - docs/direct-review.yml
    - docs/direct-fix-report.md
    - docs/stakeholder-fix-report.md
    - .build_ok
    - docs/task_list.md
    - docs/screenshots/
    - docs/surface-visual-review.md
    - docs/surface-visual-review.yml
    - docs/screenshot-review.md
    - docs/surface-integrated-review.yml
    - docs/smoke-report.md
    - docs/acceptance-report.md
    - docs/e2e-report.md
    - docs/e2e-result.json
    - docs/navigation-reachability.yml
    - docs/evidence/navigation/
    - docs/platform-fix-report.md
    - docs/headless-build-report.md
    - docs/headless-review.md
    - docs/headless-review.yml
    - docs/headless-fix-report.md
    - docs/visual-check-report.md
    - docs/stakeholder-feedback.md
    - docs/retro.md
    - docs/backlog-progress.md
    - docs/PRD.next.md
    - docs/critical-analysis.md
    - docs/plano_de_voo.md
    - docs/handoff.md
    - docs/process-improvements.md
    - docs/process-improvements.yml
    - docs/exploration-report.md
    - docs/mvp-batch-plan.yml
    - docs/mvp-batch-plan.md
    - docs/mvp-batch-navigation-contract.yml
    - docs/mvp-batch-foundation.md
    - docs/mvp-batch-report.md
    - docs/mvp-batch-review.md
    - docs/mvp-batch-review.yml
    - docs/mvp-batch-navigation-reachability.yml
    - docs/mvp-batch-fix-report.md
    - docs/mvp-batch-fix-review.md
    - docs/mvp-batch-fix-review.yml
    - docs/mvp-batch-fix-evidence/
    - docs/mvp-validation-summary.md

nodes:

  # ================================================================
  # Validação terminal focal — opt-in por --route validation
  #
  # Esta rota também é a continuação curta do builder: feedback de validação
  # nunca retorna a MDD, planning ou delivery integral.
  # ================================================================

  - id: ft.start.route_mode
    type: decision
    title: "Selecionar Rota do Builder"
    description: "A rota validation continua um produto em construção na etapa terminal; direct entrega uma demanda focal com gates determinísticos e uma única review; --parallel controla somente o fan-out das lanes."
    sprint: sprint-00-batch
    executor: python
    condition: run_route
    branches:
      "validation": ft.batch.01.plan
      "direct": ft.direct.01.build
      "_default": ft.start.route

  - id: ft.batch.01.plan
    type: document
    title: "Reutilizar ou Planejar o Delta em uma Chamada"
    description: "Validar um plano já compatível com a demanda ou gerar uma única vez foundation e lanes com ownership disjunto."
    sprint: sprint-00-batch
    executor: codex
    preserve_outputs_on_reentry: true
    max_turns: 80
    outputs:
      - docs/mvp-batch-plan.yml
      - docs/mvp-batch-plan.md
      - docs/mvp-batch-navigation-contract.yml
      - docs/PRD.md
      - docs/TECH_STACK.md
      - docs/PROJECT_BACKLOG.md
      - docs/FEATURES.md
      - docs/task_list.md
      - docs/api_contract.md
      - docs/ui_criteria.md
      - docs/test_data.md
      - .ft/project.yml
    write_scope:
      - docs
      - .ft/project.yml
    prompt: |
      Esta é a ÚNICA chamada de planejamento do batch. Leia docs/demanda.md e
      todo conhecimento já existente no repositório. Preserve decisões válidas e
      reconcilie, sem apagar histórico, PRD, TECH_STACK, PROJECT_BACKLOG,
      FEATURES, task_list, api_contract, ui_criteria, test_data e .ft/project.yml.
      Se um documento ainda não existir, crie-o com conteúdo suficiente para a
      construção. O lifecycle do projeto permanece building.

      ESCOPO OBRIGATÓRIO: planeje e execute somente produto e engenharia de
      software. Requisitos funcionais, UX, código, arquitetura, dados, APIs,
      integrações, segurança técnica, testes, desempenho, confiabilidade,
      empacotamento, instalação e manutenção técnica podem virar R-*, PB-*,
      foundation ou lane. Jurídico, contratos como aprovação legal, marketing,
      site promocional, recrutamento, pesquisa de mercado, vendas, conversão,
      receita, renovação e validação comercial pertencem à equipe posterior:
      preserve-os como contexto pendente, sem criar lane, task ou bloqueio do
      builder e sem declará-los resolvidos.

      Reconcile também `.ft/project.yml.validation` com `schema_version: 1`.
      Use `mode: explicit` quando a stack já for conhecida e selecione somente
      `android`, `ios`, `web` e/ou `desktop`. Cada perfil contém `targets` como
      mapping e cada target declara `required: true|false`: Android aceita
      emulator/physical; iOS aceita simulator/physical (iPhone/iPad físico não
      é perfil separado); web aceita desktop_browser/mobile_browser; desktop
      aceita windows/macos/linux. Use `mode: automatic` apenas enquanto a stack
      ainda não puder ser determinada e `mode: disabled` somente para produto
      sem superfície nessas plataformas, com `reason` explícito. Mantenha os
      paths canônicos da matriz, relatório, evidências e identidade. Fluxos
      autenticados/personalizados exigem `test_identity.policy: required`.

      Escreva docs/mvp-batch-plan.yml estritamente neste schema:
        schema_version: 1
        request_sha256: <sha256 hexadecimal exato dos bytes de docs/demanda.md>
        requirements:
          - id: R-001
            text: <unidade verificável da demanda>
        foundation:
          goal: <trabalho compartilhado e necessariamente sequencial>
          acceptance_criteria: [<critério verificável>]
          areas: [<paths relativos que somente a foundation/fan-in pode tocar>]
        lanes:
          - id: L-01
            title: <nome curto>
            goal: <resultado focal>
            backlog_items: [PB-001]
            requirements: [R-001]
            acceptance_criteria: [<máximo 6>]
            areas: [<paths relativos e específicos, disjuntos das outras lanes>]
            depends_on: []

      Regras mandatórias:
      - não escreva `waves`; o engine calcula a topologia;
      - cubra cada requirement em ao menos uma lane e não invente requirements;
      - use entre 2 e 8 lanes; dependências só quando reais;
      - reserve/valide PBs no backlog e associe cada lane a ao menos um PB;
      - paths devem ser relativos, seguros e não podem incluir .ft nem os
        documentos canônicos protegidos pelo batch_policy;
      - a foundation contém somente extrações, contratos, scaffold e baselines
        realmente compartilhados; funcionalidades ficam nas lanes;
      - se a demanda criar ou alterar interface pública, atualize
        docs/api_contract.md nesta chamada, antes do fan-out. Toda operação
        consumida ou exposta deve existir no contrato canônico; é proibido às
        lanes inventar endpoint, transporte ou schema paralelo/oculto;
      - não inclua comandos shell no YAML.

      Gere também docs/mvp-batch-plan.md como projeção legível: requisitos,
      foundation, lanes, dependências, ownership e critérios. Ao final, confira
      o SHA-256 e o YAML com parser antes de responder DONE.

      Gere docs/mvp-batch-navigation-contract.yml sem assumir stack, domínio ou
      plataforma. Use exatamente:
        schema_version: 1
        scope_sha256: <sha256 dos bytes de docs/mvp-batch-plan.yml>
        scope_refs:
          - ref: R-001
            disposition: ui | non_ui
            targets: [NAV-001]
            reason: <obrigatório apenas para non_ui>
        targets:
          - id: NAV-001
            label: <capacidade ou superfície reconhecível pelo usuário>
            entry_policy: public | entitled | contextual | first_launch

      Classifique exatamente todos os R-* do plano. Todo requisito que produz
      ou altera uma capacidade visível usa disposition ui e aponta ao menos um
      target; non_ui exige justificativa. O mesmo target pode servir a vários
      requisitos. Não registre rota interna como ponto de entrada.
    validators:
      - builder_batch_plan_valid:
          path: docs/mvp-batch-plan.yml
          request_path: docs/demanda.md
          policy:
            min_lanes: 2
            max_lanes: 8
            max_acceptance_criteria_per_lane: 6
            protected_paths:
              - .ft/
              - docs/PRD.md
              - docs/TECH_STACK.md
              - docs/PROJECT_BACKLOG.md
              - docs/FEATURES.md
              - docs/task_list.md
              - docs/api_contract.md
              - docs/ui_criteria.md
              - docs/test_data.md
              - docs/mvp-batch-navigation-contract.yml
            evidence_root: docs/batches/mvp-builder-fast
      - file_exists: docs/mvp-batch-plan.md
      - file_exists: docs/mvp-batch-navigation-contract.yml
      - navigation_contract_valid:
          path: docs/mvp-batch-navigation-contract.yml
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          min_targets: 0
      - file_exists: docs/PRD.md
      - file_exists: docs/TECH_STACK.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - file_exists: docs/task_list.md
      - file_exists: docs/api_contract.md
      - api_contract_complete:
          path: docs/api_contract.md
          min_endpoints: 3
      - project_contract_valid:
          path: .ft/project.yml
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.batch.03.foundation

  - id: ft.batch.03.foundation
    type: build
    title: "Consolidar Foundation Sequencial"
    description: "Implementar em um único checkpoint apenas a base compartilhada declarada no plano, antes de abrir qualquer lane."
    sprint: sprint-00-batch
    executor: codex
    allow_pre_seed: true
    preserve_outputs_on_reentry: true
    max_turns: 100
    outputs:
      - src/
      - docs/mvp-batch-foundation.md
    write_scope:
      - src
      - docs/mvp-batch-foundation.md
    prompt: |
      Leia docs/mvp-batch-plan.yml e implemente SOMENTE `foundation`: scaffold,
      extrações, contratos, interfaces, modelos compartilhados e baseline que as
      lanes precisam consumir. Não implemente funcionalidades pertencentes a uma
      lane e não altere documentos canônicos. Implemente consumidores e
      provedores contra docs/api_contract.md, sem interface suplementar; o
      contrato público já está congelado e permanece somente leitura durante o
      fan-out. Faça verificações focais da base, registre comandos/resultados e o contrato congelado em
      docs/mvp-batch-foundation.md. Deixe o checkout compilável e encerre DONE.
    validators:
      - file_exists: docs/mvp-batch-foundation.md
      - command_succeeds: >-
          python3 -c "import yaml;
          p=yaml.safe_load(open('docs/mvp-batch-plan.yml', encoding='utf-8'));
          text=open('docs/mvp-batch-foundation.md', encoding='utf-8').read();
          assert p['request_sha256'] in text"
      - command_succeeds: "git diff --check"
    next: ft.batch.04.execute

  - id: ft.batch.04.execute
    type: batch
    title: "Executar Lanes Isoladas e Integrar"
    description: "O engine calcula waves, limita concorrência, reutiliza sessões por lane, valida ownership pelo diff real e integra atomicamente."
    sprint: sprint-00-batch
    executor: python
    outputs:
      - docs/mvp-batch-report.md
    validators:
      - file_exists: docs/mvp-batch-report.md
      - command_succeeds: "git diff --check"
    next: ft.batch.05.review

  - id: ft.batch.05.review
    type: review
    title: "Revisar Incremento Combinado do Batch"
    description: "Auditoria independente sobre o fan-in completo, cobrindo todos os requirements e critérios sem repetir a regressão total."
    sprint: sprint-00-batch
    executor: codex
    no_pre_seed: true
    max_turns: 80
    outputs:
      - docs/mvp-batch-review.md
      - docs/mvp-batch-review.yml
      - docs/test-identity.json
      - docs/mvp-batch-navigation-reachability.yml
      - docs/batches/mvp-builder-fast/navigation/
    write_scope:
      - docs/mvp-batch-review.md
      - docs/mvp-batch-review.yml
      - docs/test-identity.json
      - docs/mvp-batch-navigation-reachability.yml
      - docs/batches/mvp-builder-fast/navigation
    prompt: |
      Revise de forma independente o incremento integrado contra
      docs/mvp-batch-plan.yml, docs/demanda.md e o diff do checkpoint anterior.
      Execute apenas auditorias e testes focais necessários para comprovar cada
      requirement e critério. Não altere código. Escreva
      docs/mvp-batch-review.md com matriz requirement→evidência e exatamente uma
      linha `VERDICT: APPROVED` ou `VERDICT: REJECTED`. REJECTED deve listar
      somente defeitos acionáveis, com path/teste/evidência.

      Escreva também docs/mvp-batch-review.yml com o recibo determinístico:
        schema_version: 1
        scope_sha256: <sha256 dos bytes correntes de docs/mvp-batch-plan.yml>
        verdict: APPROVED | REJECTED
        results:
          - ref: R-001
            result: PASS | FAIL
            evidence: [<path, teste ou resultado sanitizado>]
        findings:
          - id: F-001
            refs: [R-001]
            summary: <defeito reproduzível e acionável>
            evidence: [<path, teste ou resultado sanitizado>]

      Cubra exatamente todos os R-* do plano uma única vez. APPROVED exige todos
      os resultados PASS e findings vazio. REJECTED exige ao menos um FAIL e
      findings que cubram exatamente as referências reprovadas. O veredito do
      Markdown e do YAML deve ser idêntico.

      Regra de fidelidade: um requirement sobre dado real exibido no produto
      deve ser provado pela jornada fonte pública→persistência→leitura→UI e por
      comparação campo a campo. Mock, fixture ou teste isolado de componente
      pode apoiar diagnóstico, mas nunca fechar esse requirement. Preserve
      evidência física/visual quando houver UI executável. Se a jornada for
      autenticada, provisione antes um usuário exclusivo do agente por seed
      idempotente e resetável, com credenciais protegidas, e preserve somente o
      recibo sanitizado em docs/test-identity.json.

      Para cada target de docs/mvp-batch-navigation-contract.yml, execute o
      produto real a partir da primeira abertura ou de uma superfície principal
      e navegue somente por controles visíveis da UI de produção. Registro de
      rota, URL interna direta, deep link/debug, montagem isolada de componente,
      catálogo técnico ou hook test-only não comprovam descoberta pelo usuário.
      Targets condicionados exigem prova positiva com identidade técnica
      elegível e prova negativa com identidade comum.

      Escreva docs/mvp-batch-navigation-reachability.yml com:
        schema_version: 1
        contract_sha256: <sha256 do contrato corrente>
        verdict: APPROVED | REJECTED
        candidate_ref: <commit, build ou release observado>
        observed_candidate_ref: <mesmo candidato realmente executado>
        environment: {kind: <ambiente>, execution_surface: <browser, device ou UI>}
        findings: []
        journeys:
          - id: <id único>
            entry_type: primary_navigation | menu | first_launch | visible_control | external_event
            start_surface: <origem reconhecível>
            entry_point: <rótulo visível>
            navigation_mode: production_ui
            steps: [<ações visíveis>]
            targets: [NAV-001]
            result: PASS | FAIL
            evidence: docs/batches/mvp-builder-fast/navigation/<arquivo novo>
            shortcuts: []
            access_context: public | entitled | contextual

      Em contexto entitled acrescente entitlement_setup,
      eligible_entry_result e ineligible_entry_result. Em contextual acrescente
      context_setup e entry_result. Não registre segredo ou PII. APPROVED exige
      todos os targets cobertos por jornadas PASS e findings vazio. O Markdown
      mantém o veredito geral usado pelo review; o YAML julga somente
      alcançabilidade e pode ser APPROVED mesmo quando outro finding rejeitar o
      incremento.
    validators:
      - file_exists: docs/mvp-batch-review.md
      - file_exists: docs/mvp-batch-review.yml
      - review_outcome_valid:
          path: docs/mvp-batch-review.yml
          markdown_path: docs/mvp-batch-review.md
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          require_approved: false
      - file_exists: docs/mvp-batch-navigation-reachability.yml
      - navigation_reachability:
          contract_path: docs/mvp-batch-navigation-contract.yml
          report_path: docs/mvp-batch-navigation-reachability.yml
          evidence_root: docs/batches/mvp-builder-fast/navigation
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          min_targets: 0
          require_approved: false
    on_fail:
      human_gate: "O review combinado encontrou defeitos focais no batch."
      goto: ft.batch.06.fix
      automatic: true
    next: ft.batch.07.verify

  - id: ft.batch.06.fix
    type: build
    title: "Corrigir Apenas Achados do Batch"
    description: "Loop focal: corrigir somente os achados acionáveis do review e seus testes diretamente relacionados, emitindo o recibo que o gate determinístico verifica."
    fix_review: ft.batch.06b.fix_review
    sprint: sprint-00-batch
    executor: codex
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    max_turns: 80
    outputs:
      - src/
      - docs/api_contract.md
      - docs/mvp-batch-fix-report.md
      - docs/mvp-batch-fix-review.md
      - docs/mvp-batch-fix-review.yml
      - docs/mvp-batch-fix-evidence/
    write_scope:
      - src
      - docs/api_contract.md
      - docs/mvp-batch-fix-report.md
      - docs/mvp-batch-fix-review.md
      - docs/mvp-batch-fix-review.yml
      - docs/mvp-batch-fix-evidence
      - docs/mvp-batch-navigation-reachability.yml
      - docs/batches/mvp-builder-fast/navigation
    prompt: |
      Leia docs/mvp-batch-review.md, docs/mvp-batch-review.yml,
      docs/platform-validation-report.yml quando existir e, quando esta etapa
      vier do aceite, considere também o feedback mais recente do stakeholder.
      Corrija SOMENTE os achados REJECTED mais recentes.
      Rode testes focais dos arquivos corrigidos; não repita a suíte completa,
      não reabra requisitos aprovados e preserve documentos canônicos. Se o
      finding exigir interface pública nova ou corrigida, atualize
      atomicamente docs/api_contract.md, provedor, consumidor e testes de
      paridade; não crie endpoint, schema ou transporte oculto/suplementar.
      Finding `mockup_watermark` exige corrigir a UI de produção e o mapa
      tela→mockup; não maquie o resultado editando apenas receipt, screenshot
      ou overlay do teste.
      Registre docs/mvp-batch-fix-report.md com
      finding→causa→path→fix→teste→resultado. Normalize cada finding corrente
      como FX-001, FX-002 etc., uma única vez; preserve na mesma linha o ID F-*
      de origem quando ele vier do review combinado e preserve o ID PV-F-* de
      origem quando vier da validação de plataforma.

      Emita também o recibo estruturado docs/mvp-batch-fix-review.yml e o
      parecer docs/mvp-batch-fix-review.md que o atestam, com
      `schema_version: 1`, `scope_sha256` dos bytes correntes de
      docs/mvp-batch-fix-report.md, `verdict`, `results` e `findings`. Cada
      `results[].ref` é exatamente um FX-* do fix report e exige evidência
      verificável repo-local do teste que comprova a correção. Para dado
      exibido em UI, confronte cada campo citado com a fonte real pela
      interface pública e a tela executável; prova mock-only é insuficiente.
      Nesses casos, preserve a captura ou dump físico sanitizado como arquivo
      separado em docs/mvp-batch-fix-evidence/ e referencie esse path na claim
      correspondente. Auto-referenciar o Markdown ou incorporar a imagem inline
      não satisfaz o contrato. Nunca grave certificado, chave privada, senha ou
      dado pessoal bruto nesse diretório. Markdown e YAML declaram o mesmo veredito. Se algum
      FX-* continuar reprovado, registre-o como FAIL com finding FFX-* e
      severity P0 em vez de declarar aprovação. Se o finding envolver
      descoberta/navegação, reexecute somente as jornadas afetadas na UI de
      produção e atualize docs/mvp-batch-navigation-reachability.yml.
      Encerre DONE.
    validators:
      - file_exists: docs/mvp-batch-fix-report.md
      - api_contract_complete:
          path: docs/api_contract.md
          min_endpoints: 3
      - command_succeeds: "git diff --check"
    next: ft.batch.06b.fix_review

  - id: ft.batch.06b.fix_review
    type: gate
    title: "Verificar o Fix do Batch (determinístico)"
    description: "Checkpoint Python do recibo de correção: schema, cobertura FX-*, evidências, navegação e árvore limpa. Substitui uma segunda review LLM cujo resultado já era reavaliado por validators."
    sprint: sprint-00-batch
    executor: python
    no_pre_seed: true
    validation_mode: fail_fast
    validators:
      - file_exists: docs/mvp-batch-fix-report.md
      - file_exists: docs/mvp-batch-fix-review.md
      - file_exists: docs/mvp-batch-fix-review.yml
      - review_outcome_valid:
          path: docs/mvp-batch-fix-review.yml
          markdown_path: docs/mvp-batch-fix-review.md
          scope_path: docs/mvp-batch-fix-report.md
          scope_pattern: "\\bFX-\\d+\\b"
          require_approved: true
      - navigation_reachability:
          contract_path: docs/mvp-batch-navigation-contract.yml
          report_path: docs/mvp-batch-navigation-reachability.yml
          evidence_root: docs/batches/mvp-builder-fast/navigation
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          min_targets: 0
          require_approved: true
      - command_succeeds: "git diff --check"
    on_fail:
      human_gate: "O recibo de correção do batch não comprova o fix."
      goto: ft.batch.06.fix
      automatic: true
    next: ft.batch.07.verify

  - id: ft.batch.07.verify
    type: gate
    title: "Verificação Completa Única do Batch"
    description: "Executar a regressão integral uma única vez depois do fan-in e do review focal."
    sprint: sprint-00-batch
    executor: python
    validation_mode: fail_fast
    validators:
      - command_succeeds: "make -C src verify"
      - review_chain_approved:
          review_path: docs/mvp-batch-review.yml
          review_markdown_path: docs/mvp-batch-review.md
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          fix_review_path: docs/mvp-batch-fix-review.yml
          fix_review_markdown_path: docs/mvp-batch-fix-review.md
          fix_scope_path: docs/mvp-batch-fix-report.md
          fix_scope_pattern: "\\bFX-\\d+\\b"
      - navigation_reachability:
          contract_path: docs/mvp-batch-navigation-contract.yml
          report_path: docs/mvp-batch-navigation-reachability.yml
          evidence_root: docs/batches/mvp-builder-fast/navigation
          scope_path: docs/mvp-batch-plan.yml
          scope_pattern: "\\bR-\\d+\\b"
          min_targets: 0
          require_approved: true
      - command_succeeds: "git diff --check"
    next: ft.batch.07a.platform_route

  - id: ft.batch.07a.platform_route
    type: decision
    title: "Resolver Perfis de Validação do Batch"
    description: "Instanciar somente Android, iOS, web e/ou desktop selecionados pelo contrato corrente."
    sprint: sprint-00-batch
    executor: python
    condition: validation_profiles_active
    branches:
      "true": ft.batch.07b.platform_validation
      "false": ft.batch.08.acceptance

  - id: ft.batch.07b.platform_validation
    type: review
    title: "Validar Plataformas Selecionadas do Batch"
    description: "Executar os targets da matriz resolvida, agregar evidências do candidato corrente e reprovar qualquer target obrigatório não comprovado."
    sprint: sprint-00-batch
    executor: codex
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    max_turns: 100
    env_setup:
      - ft validation-matrix .
    outputs:
      - docs/validation-matrix.yml
      - docs/platform-validation-report.yml
      - docs/evidence/platform-validation/
      - docs/test-identity.json
    write_scope:
      - docs/validation-matrix.yml
      - docs/platform-validation-report.yml
      - docs/evidence/platform-validation
      - docs/test-identity.json
    prompt: |
      Leia a matriz determinística em docs/validation-matrix.yml. Ela já
      instancia somente os perfis e targets selecionados em .ft/project.yml;
      não invente nem remova plataformas. Para cada target, execute o
      `make_target` informado pela matriz. Targets independentes podem rodar em
      paralelo; nunca concorram pelo mesmo dispositivo físico.

      Valide o candidato integrado corrente, não um build/cache anterior. Em
      Android/iOS instale o artefato corrente e compare SHA-256 local e
      observado. Em dispositivo físico use somente aparelho autorizado;
      indisponibilidade de target obrigatório é BLOCKED, não PASS nem defeito
      do produto. Em web use navegador real; em desktop execute o aplicativo no
      SO alvo. Um target opcional indisponível pode ser SKIP com motivo; falha
      reproduzida é sempre FAIL.

      Em Android físico, trate instaladores OEM interativos como gate humano e
      minimize-os por construção. Compile o candidato uma vez; mantenha um
      ledger sanitizado por package + SHA-256; instale app e APK instrumental
      somente quando ausentes ou quando o hash observado divergir. Se apenas um
      pacote divergir, instale somente ele; se app e instrumental divergirem
      juntos, use uma única sessão multipacote quando suportada para concentrar
      a confirmação OEM. Depois rode
      todos os focais contra os pacotes já instalados com `adb shell am instrument`
      (ou mecanismo equivalente comprovadamente sem reinstalação),
      agregando classes quando possível. Não repita tasks que reinstalam ou
      removem os pacotes entre subconjuntos. Um tap injetado não prova aceite:
      somente sucesso do instalador e hash observado comprovam instalação. Se o
      diálogo exigir pessoa, conclua antes todo trabalho independente, solicite
      uma única autorização no checkpoint físico final e aguarde; nunca use o
      aparelho físico interativo como loop de fix nem repita a solicitação.
      Nunca declare que a automação confirmou sem essa prova. Não use root,
      desbloqueio de bootloader
      nem enfraqueça a segurança do aparelho sem autorização explícita.
      O check `artifact_install_reuse` deve evidenciar hashes, quantidade de
      instalações reais e execuções reutilizadas, sem identificadores sensíveis.

      Execute exatamente todos os checks listados na matriz. Incorpore os
      aprendizados gerais de validação física: identidade técnica exclusiva e
      seed idempotente/resetável para jornadas autenticadas, estado vazio e
      massa controlada, fonte→persistência→UI para dados exibidos, instalação e
      launch reais, CTAs com efeito, navegação por menus/controles de produção,
      permissões refletidas na UI, retorno/back sensível ao contexto,
      persistência após rotação/reinício, insets/safe areas sem sobreposição e
      comparação visual com todas as referências declaradas. Opere sempre com
      o perfil padrão do aparelho e não altere configurações do sistema.
      Atalho técnico, rota direta, preview ou componente isolado pode apoiar
      diagnóstico, mas nunca encerrar um check.

      O check `mockup_watermark` é obrigatório em toda superfície de UI.
      Descubra todas as telas, páginas e janelas alcançáveis no target e prove,
      uma a uma, que o produto renderiza uma marca d'água discreta, legível e
      não interativa com o identificador EXATO do mockup correspondente.
      Overlay acrescentado pelo teste/captura não conta. Tela sem
      mockup atribuído, inventário incompleto ou screenshot ausente é FAIL.

      Se test_identity.policy=required, preserve docs/test-identity.json no
      contrato sanitizado da engine, sem PII/segredo. Grave evidências NOVAS sob
      docs/evidence/platform-validation/<run-id>/<perfil>/<target>/; evidência
      de um target não pode provar outro. Não apague evidências históricas.

      Gere docs/platform-validation-report.yml exatamente com:
        schema_version: 1
        matrix_sha256: <sha256 dos bytes correntes da matriz>
        verdict: APPROVED | REJECTED
        candidate_ref: <commit/build opaco corrente>
        profiles:
          - id: android | ios | web | desktop
            targets:
              - id: <target da matriz>
                required: true | false
                result: PASS | FAIL | SKIP
                reason: <obrigatório somente em SKIP>
                observed_candidate_ref: <igual a candidate_ref quando executado>
                environment:
                  kind: <igual à matriz>
                  execution_surface: <igual à matriz>
                  os_name: <nome sanitizado>
                  os_version: <versão>
                  device_ref: <opaco; obrigatório somente no físico>
                installation:
                  result: PASS
                  artifact_sha256: <64 hex>
                  observed_artifact_sha256: <mesmo hash>
                checks:
                  - id: <cada check, na ordem exata da matriz>
                    result: PASS | FAIL
                    evidence: [<path novo sob evidence_root>]
                    # campos obrigatórios somente em mockup_watermark:
                    inventory_complete: true | false
                    discovered_screen_count: <screens + unmapped_screens>
                    unmapped_screens: [<id de tela ainda sem mockup>]
                    screens:
                      - id: <tela/página/janela estável>
                        mockup_ref: <identificador estável e exato do mockup>
                        watermark_text: <idêntico a mockup_ref>
                        result: PASS | FAIL
                        evidence: [<screenshot real exclusivo desta tela>]
        findings:
          - id: PV-F-001
            profile: <perfil>
            target: <target>
            check: <check FAIL>
            summary: <defeito reproduzível>

      APPROVED exige todo target obrigatório PASS, nenhum FAIL e findings
      vazio. REJECTED exige um finding para cada check FAIL. Nunca registre
      serial/UDID, SSID/BSSID, IP, email, telefone, senha, token ou segredo.
    validators:
      - validation_matrix_valid:
          path: docs/validation-matrix.yml
      - platform_validation_report:
          matrix_path: docs/validation-matrix.yml
          report_path: docs/platform-validation-report.yml
          evidence_root: docs/evidence/platform-validation
          test_identity_path: docs/test-identity.json
          require_approved: true
      - command_succeeds: "git diff --check"
    on_fail:
      human_gate: "A validação de plataforma encontrou uma divergência focal."
      goto: ft.batch.06.fix
      automatic: true
    next: ft.batch.08.acceptance

  - id: ft.batch.08.acceptance
    type: human_gate
    title: "Aceitar o Produto Validado"
    description: "Exercite o produto no ambiente real de validação. Aprove somente se funcionalidade, estética e descoberta pelas entradas visíveis estiverem corretas e nenhum target estiver órfão; ao rejeitar, descreva defeitos reproduzíveis e o fluxo volta apenas à correção focal."
    sprint: sprint-00-batch
    executor: python
    outputs:
      - docs/stakeholder-feedback.md
    reject_next: ft.batch.06.fix
    next: ft.batch.09.reconcile

  - id: ft.batch.09.reconcile
    type: retro
    title: "Reconciliar Somente o Delta Aceito"
    description: "Atualizar os catálogos canônicos afetados pelo batch e registrar uma síntese curta, sem retro completa, reescrita de PRD ou evolução do processo."
    sprint: sprint-00-batch
    executor: codex
    no_pre_seed: true
    max_turns: 40
    outputs:
      - docs/mvp-validation-summary.md
      - docs/PROJECT_BACKLOG.md
      - docs/FEATURES.md
      - docs/task_list.md
      - .ft/project.yml
    write_scope:
      - docs/mvp-validation-summary.md
      - docs/PROJECT_BACKLOG.md
      - docs/FEATURES.md
      - docs/task_list.md
      - .ft/project.yml
    prompt: |
      O stakeholder aceitou o incremento. Reconcilie SOMENTE o delta descrito
      em docs/mvp-batch-plan.yml usando os relatórios de foundation, fan-in,
      review Markdown/YAML, fix review quando houver, regressão e aceite.
      Preserve IDs e histórico.

      Marque como done/accepted apenas os PBs do plano que possuem evidência
      real, incluindo alcançabilidade pela UI de produção quando houver target.
      Atualize FEATURES somente para capacidades efetivamente aceitas e task_list
      somente para tarefas deste delta. Preserve o objetivo e o DoD global em
      .ft/project.yml; o lifecycle permanece building até `ft project-close`.

      Escreva docs/mvp-validation-summary.md com requisitos, PBs, evidências,
      resultado da regressão e decisão do stakeholder. Não reescreva PRD,
      TECH_STACK, critérios de UI, handoff, plano de voo, análise crítica,
      retro geral ou o processo. Responda DONE.
    validators:
      - file_exists: docs/mvp-validation-summary.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - task_list_references_backlog:
          task_path: docs/task_list.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - project_contract_valid:
          path: .ft/project.yml
      - command_succeeds: "git diff --check"
    next: ft.operational.01.audit

  # ================================================================
  # Entrada — MDD agora é um template independente
  # ================================================================

  - id: ft.start.route
    type: gate
    title: "Validar entrada produzida pela MDD"
    description: "Exige hipótese e PRD antes do planejamento. Para produzi-los, execute e encerre um ciclo com o template mdd."
    sprint: sprint-01-mdd
    executor: python
    outputs:
      - docs/hipotese.md
      - docs/PRD.md
    validators:
      - file_exists: docs/hipotese.md
      - has_sections:
          path: docs/hipotese.md
          sections:
            - Hipótese Central
            - Problema Observado
            - Público-Alvo
            - Sinal de Validação
      - file_exists: docs/PRD.md
      - has_sections:
          path: docs/PRD.md
          sections:
            - Hipótese
            - User Stories
            - Stack Técnico
            - Critérios de Saída
    next: ft.hyper.00.ui_criteria_questions

  - id: ft.start.ui_criteria.route
    type: decision
    title: "HyperMode — Critérios de UI existentes?"
    description: "Depois do brief visual obrigatório, detecta se docs/ui_criteria.md precisa ser criado antes do planejamento."
    sprint: sprint-02-planning
    executor: python
    condition: "file_exists:docs/ui_criteria.md"
    branches:
      "true": ft.start.01.product_mockups
      "false": ft.hyper.01.ui_criteria

  - id: ft.hyper.00.ui_criteria_questions
    type: human_gate
    title: "Superfície e Direção da Experiência"
    description: "Brief obrigatório do stakeholder. Declare primeiro se o produto possui superfície visual. Para produto visual, informe plataforma/viewport, estética, referências, marca, telas, ações e estados P0. Requisitos especiais de uso só entram quando solicitados explicitamente. Para biblioteca/SDK headless, declare explicitamente que não há UI, browser, telas ou mockups e descreva a experiência programática esperada. Use ft approve \"brief...\"; aprovação sem mensagem é recusada."
    sprint: sprint-02-planning
    executor: python
    approval_message_required: true
    next: ft.hyper.00b.ui_brief

  - id: ft.hyper.00b.ui_brief
    type: document
    title: "Persistir Contrato de Experiência"
    description: "Converter a direção fornecida pelo stakeholder em contrato curto e durável e registrar canonicamente quando o produto não possui superfície visual."
    sprint: sprint-02-planning
    executor: codex
    max_turns: 20
    outputs:
      - docs/ui-brief.md
      - .ft/project.yml
    write_scope:
      - docs/ui-brief.md
      - .ft/project.yml
    prompt: |
      Use a mensagem CURRENT_FEEDBACK do gate anterior como fonte primária e
      leia somente o necessário de docs/PRD.md. Escreva docs/ui-brief.md com:
      presença ou ausência de superfície visual, plataforma/viewport quando
      aplicável, personalidade, referências, marca, ações P0,
      estados exigidos, padrões obrigatórios/proibidos e decisões abertas.
      Preserve literalmente nomes, cores e restrições fornecidos; não invente
      preferência ausente.

      Se, e somente se, o stakeholder declarar explicitamente biblioteca, SDK,
      serviço ou produto headless sem Android, iOS, web ou desktop visual,
      reconcilie `.ft/project.yml.validation` para `mode: disabled`,
      `platforms: {}`, `test_identity.policy: not_required` e `reason` objetivo.
      Preserve schema, paths, objetivo, lifecycle e DoD existentes. Nunca
      fabrique um target desktop opcional para representar compatibilidade de
      runtime. Se houver qualquer superfície visual, preserve mode automatic ou
      explicit e não desabilite a validação. Responda DONE.
    validators:
      - file_exists: docs/ui-brief.md
      - document_quality:
          path: docs/ui-brief.md
          min_lines_count: 12
          max_lines_count: 180
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.start.surface.route

  - id: ft.start.surface.route
    type: decision
    title: "Selecionar Planejamento Visual ou Headless"
    description: "Usa o modo canônico de validação do projeto; disabled significa ausência explícita de superfície visual."
    sprint: sprint-02-planning
    executor: python
    condition: project_validation_mode
    branches:
      disabled: ft.start.backlog.route
      _default: ft.start.ui_criteria.route

  - id: ft.hyper.01.ui_criteria
    type: discovery
    title: "Descobrir Critérios Visuais de UI"
    description: "docs/ui_criteria.md não existe. Leia o PRD e faça perguntas objetivas ao stakeholder sobre telas P0, navegação, componentes obrigatórios, estados e evidências visuais. Gere critérios com IDs estáveis C01, C02, C03..."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/ui_criteria.md
    prompt: |
      O projeto já possui docs/PRD.md, mas não possui docs/ui_criteria.md.

      Sua tarefa é criar docs/ui_criteria.md fazendo discovery de interface:
      1. Leia docs/PRD.md e identifique telas P0, fluxos P0, navegação, formulários,
         estados vazios/erro/carregamento e componentes visuais citados no PRD.
      2. Se algo estiver ambíguo, faça perguntas diretas ao stakeholder no próprio
         processo de discovery antes de fechar o documento. Pergunte apenas o que
         muda critérios de aceitação visual.
      3. Gere critérios objetivos, verificáveis e rastreáveis com IDs estáveis:
         C01, C02, C03...
      4. Inclua no topo uma nota de evidência:
         - relatório visual com linha por critério e PASS; ou
         - código com data-ui-criteria="C01" ou comentário ui-criteria: C01.
      5. Não invente componente específico que não esteja no PRD. Se um critério for
         condicional, escreva "quando aplicável" e explique a condição.

      Use este formato mínimo:

      # Critérios Visuais de UI

      ## Telas P0
      - [ ] C01: ...

      ## Estados e Fluxos
      - [ ] C02: ...

      ## Responsividade e Navegação
      - [ ] C03: ...

      ## Componentes e Acabamento
      - [ ] C04: ...

      ## Evidência Obrigatória
      - [ ] C05: ...
    validators:
      - file_exists: docs/ui_criteria.md
      - ui_criteria_ids:
          path: docs/ui_criteria.md
          min_count: 8
    next: ft.hyper.01b.ui_criteria_gate

  - id: ft.hyper.01b.ui_criteria_gate
    type: human_gate
    title: "Revisão dos Critérios Visuais"
    description: "Revise docs/ui_criteria.md. Confirme se os critérios cobrem as telas P0, fluxos interativos, componentes específicos do PRD e evidências esperadas. Rejeite com respostas/instruções objetivas se faltar algo."
    sprint: sprint-02-planning
    executor: python
    outputs:
      - docs/ui_criteria.md
    reject_next: ft.hyper.01.ui_criteria
    next: ft.start.01.product_mockups

  - id: ft.start.backlog.route
    type: decision
    title: "HyperMode — Backlog de Produto existente?"
    description: "Detecta se já existe docs/PROJECT_BACKLOG.md. Se não existir, cria backlog canônico derivado do PRD antes de planejar o ciclo."
    sprint: sprint-02-planning
    executor: python
    condition: "file_exists:docs/PROJECT_BACKLOG.md"
    branches:
      "true": ft.start.features.route
      "false": ft.plan.00.foundation_full

  - id: ft.start.features.route
    type: decision
    title: "HyperMode — Catálogo de Features existente?"
    description: "Detecta se docs/FEATURES.md já existe. Se não existir, cria o catálogo canônico somente com recursos implementados e validados do PROJECT_BACKLOG antes de planejar o ciclo."
    sprint: sprint-02-planning
    executor: python
    condition: "file_exists:docs/FEATURES.md"
    branches:
      "true": ft.plan.00.foundation_existing
      "false": ft.plan.00.foundation_features

  # ================================================================
  # Sprint 02 — Planning
  # ================================================================

  - id: ft.plan.00.foundation_full
    type: document
    title: "Fundação de Planejamento Completa"
    description: "Em um único turn, criar backlog e catálogo de features e então derivar task list e tech stack, preservando os contratos canônicos de cada documento."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/PROJECT_BACKLOG.md
      - docs/FEATURES.md
      - docs/task_list.md
      - docs/TECH_STACK.md
      - .ft/project.yml
    prompt: |
      Crie docs/PROJECT_BACKLOG.md como artefato canônico do produto.

      Escopo obrigatório: PROJECT_BACKLOG, task_list e DoD deste builder cobrem
      somente o produto e a engenharia de software. Inclua comportamento, UX,
      arquitetura, código, dados, APIs, integrações, segurança técnica, testes,
      desempenho, confiabilidade, empacotamento, instalação e manutenção.
      Assuntos de jurídico, marketing, site promocional, recrutamento, pesquisa
      de mercado, vendas, receita, renovação ou validação comercial ficam
      pendentes para a equipe posterior; não crie PB/task/gate de engenharia
      para eles, não os use como bloqueio e não os declare resolvidos.

      Fontes:
      - docs/PRD.md (fonte primária)
      - docs/ui_criteria.md quando existir
      - o ciclo mais recente em .ft/cycles/*/ (handoff, critical-analysis, retro e PRD.next), se existir

      Regras:
      1. Não crie task técnica aqui. Backlog é produto/processo em nível de US, bug ou dívida.
      2. Cada item deve ter ID estável PB-001, PB-002...
      3. Prioridade obrigatória: P0, P1 ou P2.
      4. Status obrigatório: planned, in_progress, done, deferred, blocked, rejected ou accepted.
      5. Itens P0/P1 que não forem feitos no ciclo precisam terminar com decisão explícita no campo Decisão/Notas.
      6. Preserve itens existentes se o arquivo já existir; atualize sem renumerar.

      Formato obrigatório:

      # PROJECT_BACKLOG

      ## Progresso
      - Total:
      - Done:
      - Open:
      - P0/P1 sem decisão:

      ## Itens do Backlog

      | ID | Tipo | Prioridade | Status | Origem | Título | Critérios de Aceite | Evidência | Decisão/Notas |
      |---|---|---|---|---|---|---|---|---|
      | PB-001 | US | P0 | planned | PRD §... | ... | ... | — | — |

      ## Regras de Consumo pelos Ciclos
      - docs/task_list.md deve referenciar IDs PB-* selecionados para o ciclo.
      - Handoff deve atualizar Status, Evidência e Decisão/Notas.

      Depois de criar o backlog, complete no mesmo turn:
      1. docs/FEATURES.md, somente com itens PB-* done/accepted, usando IDs FEAT-*.
      2. docs/task_list.md, com 20-120 linhas, referências PB-* e tasks das
         áreas reais do produto. Para `validation.mode: disabled`, decomponha
         biblioteca/core, adapters, empacotamento, documentação e testes sem
         inventar frontend, browser, mockup ou servidor HTTP.
      3. docs/TECH_STACK.md, com as seções Framework, Banco de Dados e
         Estrutura de Diretórios e justificativas das escolhas.
      4. .ft/project.yml como contrato global: preserve schema_version, project_id
         e lifecycle.owner_template; objective deve representar o resultado maior
         do PRD; mantenha phase=building e delivered_revision=null. O DoD deve
         selecionar exatamente o escopo do marco alvo, aceitar somente
         done/accepted, exigir evidência, checkout limpo e nenhum ciclo aberto.
         Para um alvo MVP cujo PRD exige somente P0, use priorities: [P0]; P1
         pós-MVP não pode bloquear esse marco. Inclua P1 somente quando o
         objetivo/DoD do PRD o exigir. Required_gates deve declarar cada
         aceite/release obrigatório que tenha evidência JSON/YAML verificável.
         Nunca marque maintenance; somente `ft project-close` faz a transição.
         Configure também `validation` schema 1. Como a stack já é conhecida,
         use mode=explicit e selecione os targets necessários entre Android
         (emulator/physical), iOS (simulator/physical), web
         (desktop_browser/mobile_browser) e desktop (windows/macos/linux), com
         `required` por target. iPhone/iPad são target physical de iOS. Exija
         test_identity quando os fluxos forem autenticados ou personalizados.
         Para biblioteca/SDK sem qualquer superfície visual, preserve ou use
         mode=disabled com reason explícito, platforms vazio e test_identity
         not_required; compatibilidade de runtime não é target desktop.
      Não encerre antes de produzir e verificar os cinco artefatos.
    validators:
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - file_exists: docs/FEATURES.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - file_exists: docs/task_list.md
      - task_list_references_backlog:
          task_path: docs/task_list.md
          backlog_path: docs/PROJECT_BACKLOG.md
          min_refs: 1
      - file_exists: docs/TECH_STACK.md
      - has_sections:
          path: docs/TECH_STACK.md
          sections:
            - Framework
            - Banco de Dados
            - Estrutura de Diretórios
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.plan.02b.tech_gate

  - id: ft.plan.00.foundation_features
    type: document
    title: "Completar Fundação de Planejamento"
    description: "Com backlog existente, criar o catálogo de features, a task list do ciclo e a tech stack no mesmo turn."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/FEATURES.md
      - docs/task_list.md
      - docs/TECH_STACK.md
      - .ft/project.yml
    prompt: |
      Crie ou reconcilie docs/FEATURES.md como catálogo canônico das capacidades
      efetivamente implementadas e validadas do produto.

      Escopo obrigatório: catalogue e planeje somente capacidades do produto e
      trabalho de engenharia de software. Jurídico, marketing, site
      promocional, recrutamento, pesquisa de mercado, vendas, receita,
      renovação e validação comercial permanecem pendentes para a equipe
      posterior e não viram feature, task ou bloqueio deste builder.

      Fontes:
      - docs/PROJECT_BACKLOG.md (fonte primária)
      - docs/FEATURES.md, se existir durante um retry
      - .ft/cycles/*/ (acceptance, E2E, handoff e retro), quando houver histórico

      Regras:
      1. Inclua somente itens PB-* com Status=done ou Status=accepted. Itens planned,
         ready, in_progress, deferred, blocked ou rejected nunca viram feature.
         Apenas tipos US, feature, recurso ou story criam uma capacidade nova.
      2. Use IDs estáveis FEAT-001, FEAT-002... Nunca renumere, reutilize ou apague
         um ID existente.
      3. Preserve a mesma FEAT-* quando um novo PB-* evoluir, corrigir, depreciar ou
         remover uma capacidade existente. Acrescente o PB-* à coluna Backlog.
      4. Bugs, dívidas e manutenções não criam uma feature nova. Quando afetarem uma
         capacidade existente, preserve a FEAT-* e acrescente o PB-* correspondente.
      5. Status permitido: active, deprecated ou removed. Linhas removed permanecem
         no catálogo para preservar histórico.
      6. Entregue em registra o primeiro ciclo da feature. Última evolução registra o
         ciclo da mudança mais recente ou — quando nunca houve evolução posterior.
      7. Evidência deve apontar para testes/relatórios reais. Para legado sem ciclo
         demonstrável, use `legacy` em Entregue em e explique a lacuna em Notas;
         nunca invente um ciclo.
      8. Se não houver nenhum PB-* done/accepted, gere o documento com a tabela vazia.

      Formato obrigatório, sem adicionar/remover/reordenar colunas:

      # FEATURES

      ## Catálogo de Features

      | ID | Status | Backlog | Título | Descrição | Entregue em | Evidência | Última evolução | Notas |
      |---|---|---|---|---|---|---|---|---|

      Depois do catálogo, complete no mesmo turn:
      1. docs/task_list.md com 20-120 linhas, referências PB-* e tasks das áreas
         reais do produto. Em produto headless, use biblioteca/core, adapters,
         empacotamento, documentação e testes; não invente frontend/browser.
      2. docs/TECH_STACK.md com as seções Framework, Banco de Dados e
         Estrutura de Diretórios.
      3. .ft/project.yml reconciliado com PRD/backlog. Preserve schema_version,
         project_id e lifecycle.owner_template; mantenha phase=building e
         delivered_revision=null. O DoD seleciona exatamente o escopo do marco
         alvo, aceita somente done/accepted, exige evidência, checkout limpo e
         nenhum ciclo aberto. Um MVP P0 não inclui P1 pós-MVP como bloqueador.
         Declare required_gates apenas para aceites/releases obrigatórios com
         evidência JSON/YAML verificável. Nunca marque maintenance.
         Reconcile também `validation` schema 1: mode=explicit somente para
         superfícies Android/iOS/web/desktop reais; mode=disabled com reason e
         platforms vazio para biblioteca/SDK headless. iPhone/iPad pertencem a
         ios.targets.physical. Marque target obrigatório com `required: true` e
         exija test_identity para jornadas autenticadas/personalizadas.
      Verifique os quatro artefatos antes de encerrar.
    validators:
      - file_exists: docs/FEATURES.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - file_exists: docs/task_list.md
      - task_list_references_backlog:
          task_path: docs/task_list.md
          backlog_path: docs/PROJECT_BACKLOG.md
          min_refs: 1
      - file_exists: docs/TECH_STACK.md
      - has_sections:
          path: docs/TECH_STACK.md
          sections:
            - Framework
            - Banco de Dados
            - Estrutura de Diretórios
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.plan.02b.tech_gate

  - id: ft.plan.00.foundation_existing
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: document
    title: "Planejar Ciclo sobre Catálogo Existente"
    description: "Com backlog e catálogo existentes, gerar a task list, a tech stack e reconciliar o contrato global do projeto em um único turn."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/task_list.md
      - docs/TECH_STACK.md
      - .ft/project.yml
    prompt: |
      Gere os dois documentos de planejamento no mesmo turn:

      Escopo obrigatório: selecione apenas trabalho de produto e engenharia de
      software. Não transforme jurídico, marketing, site promocional,
      recrutamento, pesquisa de mercado, vendas, receita, renovação ou
      validação comercial em task, gate ou bloqueio; preserve esses assuntos
      como pendentes para a equipe posterior, sem declará-los resolvidos.

      1. docs/task_list.md seleciona itens abertos de docs/PROJECT_BACKLOG.md para
         este ciclo. Use referências PB-*, 20-120 linhas e tasks técnicas
         ordenadas pelas áreas reais do produto, com critérios e evidências.
         Em produto headless, não invente frontend, browser, mockup ou servidor.
      2. docs/TECH_STACK.md documenta framework, banco de dados, bibliotecas,
         scripts e estrutura de diretórios, justificando as decisões.
      3. .ft/project.yml representa o objetivo/DoD maior. Preserve schema_version,
         project_id e lifecycle.owner_template; mantenha phase=building e
         delivered_revision=null. Selecione somente prioridades/IDs pertencentes
         ao marco alvo, aceite done/accepted e exija evidência, checkout limpo e
         nenhum ciclo aberto. Para MVP P0, P1 pós-MVP não é bloqueador.
         Required_gates deve registrar aceites/releases obrigatórios com evidência
         JSON/YAML verificável. Nunca marque maintenance.
         Preserve/reconcile `validation` schema 1 em mode=explicit somente com
         superfícies reais. Biblioteca/SDK sem UI usa mode=disabled, reason
         explícito, platforms vazio e test_identity not_required. Android, iOS,
         web e desktop são perfis; iPhone/iPad são target físico do iOS. Fluxo
         autenticado/personalizado exige test_identity.

      Preserve docs/PROJECT_BACKLOG.md e docs/FEATURES.md existentes. Não encerre
      antes de produzir e verificar os três outputs.
    validators:
      - file_exists: docs/task_list.md
      - document_quality:
          path: docs/task_list.md
          min_lines_count: 20
          max_lines_count: 120
          forbidden: ["<tool_call", "<arg_key", "<arg_value", "vou analisar", "vou criar", "preciso verificar", "devo decompor", "I'll help", "Let me first", "I need to", "I will"]
          required_terms: ["PB-", "task", "teste"]
          min_required_terms: 3
      - task_list_references_backlog:
          task_path: docs/task_list.md
          backlog_path: docs/PROJECT_BACKLOG.md
          min_refs: 1
      - file_exists: docs/TECH_STACK.md
      - has_sections:
          path: docs/TECH_STACK.md
          sections:
            - Framework
            - Banco de Dados
            - Estrutura de Diretórios
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.plan.02b.tech_gate

  - id: ft.plan.02.tech_stack
    type: document
    no_pre_seed: true
    title: "Definir Tech Stack"
    description: "Documentar a stack técnica completa e reconciliar o contrato global do projeto. Incluir decisões de arquitetura com justificativa; preservar o owner de .ft/project.yml e manter o projeto em building."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/TECH_STACK.md
      - .ft/project.yml
    prompt: |
      Documente docs/TECH_STACK.md com Framework, Banco de Dados, bibliotecas,
      scripts, Estrutura de Diretórios e justificativas.

      Revise .ft/project.yml contra PRD e PROJECT_BACKLOG. Preserve schema_version,
      project_id e lifecycle.owner_template; mantenha phase=building e
      delivered_revision=null. O DoD global deve selecionar exatamente o escopo
      do marco alvo e, para MVP P0, não incluir P1 pós-MVP como bloqueador.
      Aceite somente done/accepted, exija evidência, checkout limpo e nenhum
      ciclo aberto. Required_gates deve conter os aceites/releases obrigatórios com
      evidência JSON/YAML verificável. Nunca marque maintenance.
      Configure `validation` schema 1 em mode=explicit apenas para superfícies
      Android/iOS/web/desktop reais. Biblioteca/SDK sem UI usa mode=disabled,
      reason explícito, platforms vazio e test_identity not_required; não use
      target desktop para representar runtime. Exija test_identity para jornadas
      autenticadas ou personalizadas.
    validators:
      - file_exists: docs/TECH_STACK.md
      - has_sections:
          path: docs/TECH_STACK.md
          sections:
            - Framework
            - Banco de Dados
            - Estrutura de Diretórios
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.plan.02b.tech_gate

  - id: ft.plan.02b.tech_gate
    type: human_gate
    title: "Revisão da Arquitetura e DoD do Projeto"
    description: "Leia docs/TECH_STACK.md e .ft/project.yml. Confirme as escolhas técnicas e, sobretudo, se objetivo, marco alvo, P0/P1 e gates estruturados representam tudo que precisa estar verde para o projeto ser realmente entregue. Blocked/deferred não podem contar como entrega. Rejeite com justificativa se o DoD permitir falso positivo ou exigir algo indevido."
    sprint: sprint-02-planning
    executor: python
    outputs:
      - docs/TECH_STACK.md
      - .ft/project.yml
    reject_next: ft.plan.02.tech_stack
    next: ft.plan.surface.route

  - id: ft.plan.surface.route
    type: decision
    title: "Selecionar Entrega Visual ou Headless"
    description: "Produtos sem superfície visual seguem contratos, build, testes e aceite de biblioteca; produtos visuais preservam o lifecycle da plataforma nativa, web ou desktop selecionada."
    sprint: sprint-02-planning
    executor: python
    condition: project_validation_mode
    branches:
      disabled: ft.headless.plan.01.contract
      _default: ft.plan.03.api_contract

  # ================================================================
  # Rota Headless — bibliotecas, SDKs e componentes sem UI
  # ================================================================

  - id: ft.headless.plan.01.contract
    type: document
    no_pre_seed: true
    title: "Definir Contrato Público e Plano de Validação Headless"
    description: "Transformar PRD, backlog e stack em contrato programático acionável e cenários de aceite sem endpoints, frontend, browser ou mockups inventados."
    sprint: sprint-02-planning
    executor: claude
    max_turns: 60
    outputs:
      - docs/api_contract.md
      - docs/test_data.md
      - docs/headless-validation-plan.md
    write_scope:
      - docs/api_contract.md
      - docs/test_data.md
      - docs/headless-validation-plan.md
    prompt: |
      Este produto possui `validation.mode: disabled`: não há superfície visual.
      Leia PRD, PROJECT_BACKLOG, task_list, TECH_STACK e .ft/project.yml.

      Gere `docs/api_contract.md` como contrato da API PÚBLICA PROGRAMÁTICA da
      biblioteca/SDK, não como API HTTP. Use obrigatoriamente as seções:
      `## API Pública`, `## Operações`, `## Modelos`, `## Erros` e
      `## Compatibilidade`. Em Operações, inclua tabela exatamente com colunas:
      `Símbolo | Tipo | Assinatura | Descrição | Erros`. Registre imports,
      assinaturas async/sync, tipos, invariantes, efeitos, erros públicos,
      compatibilidade/SemVer e exemplos mínimos. Cubra todos os comportamentos P0
      selecionados sem criar Base URL, endpoint, servidor ou transporte público
      suplementar.

      Gere `docs/test_data.md` com cenários determinísticos do domínio, incluindo
      sucesso, vazio, entrada inválida, falha de dependência, concorrência e
      degradação quando aplicável. Datas/timestamps usam apenas HOJE, HOJE+N ou
      HOJE-N. Credenciais, rede paga e PII não fazem parte da massa versionada.

      Gere `docs/headless-validation-plan.md` como escopo fechado do ciclo. O
      documento contém uma tabela `PB | Capacidade | Prova | Comando` com
      exatamente os PB-* selecionados pelo DoD para este marco, uma vez cada.
      Não cite IDs excluídos/pós-marco nesse arquivo. Exija evidência por API
      pública real, testes unitários/contrato/integração/replay, build do pacote,
      import em ambiente limpo, quickstart e auditoria de segredos. Fake/replay
      pode substituir fornecedor externo em testes herméticos, mas não a própria
      implementação pública. Termine com o contrato Makefile: `test`, `lint`,
      `typecheck`, `build`, `smoke` e `verify`.
    validators:
      - file_exists: docs/api_contract.md
      - library_contract_complete:
          path: docs/api_contract.md
          min_symbols: 3
      - file_exists: docs/test_data.md
      - relative_dates_only:
          path: docs/test_data.md
      - file_exists: docs/headless-validation-plan.md
      - document_quality:
          path: docs/headless-validation-plan.md
          min_lines_count: 15
          max_lines_count: 180
          required_terms: ["PB-", "make", "verify", "build", "smoke"]
          min_required_terms: 5
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.headless.plan.gate

  - id: ft.headless.plan.gate
    type: gate
    title: "Gate de Planejamento Headless"
    description: "Verificação determinística dos contratos programáticos e do escopo de validação da biblioteca."
    sprint: sprint-02-planning
    executor: python
    validators:
      - library_contract_complete:
          path: docs/api_contract.md
          min_symbols: 3
      - relative_dates_only:
          path: docs/test_data.md
      - file_exists: docs/headless-validation-plan.md
      - project_contract_valid:
          path: .ft/project.yml
      - command_succeeds: "git diff --check"
    next: ft.headless.01.build

  - id: ft.headless.01.build
    type: build
    no_pre_seed: true
    title: "Construir Biblioteca P0"
    description: "Implementar o escopo headless no layout canônico da stack, com pacote instalável, documentação e suíte hermética."
    sprint: sprint-03-headless-build
    executor: claude
    max_turns: 160
    outputs:
      - src/
      - tests/
      - examples/
      - migrations/
      - pyproject.toml
      - poetry.lock
      - poetry.toml
      - Makefile
      - README.md
      - CHANGELOG.md
      - .github/workflows/
      - .gitlab-ci.yml
      - .circleci/
      - azure-pipelines.yml
      - Jenkinsfile
      - docs/headless-build-report.md
    write_scope:
      - src
      - tests
      - examples
      - migrations
      - pyproject.toml
      - poetry.lock
      - poetry.toml
      - Makefile
      - README.md
      - CHANGELOG.md
      - .github/workflows
      - .gitlab-ci.yml
      - .circleci
      - azure-pipelines.yml
      - Jenkinsfile
      - docs/headless-build-report.md
    prompt: |
      Implemente o escopo P0 de `docs/headless-validation-plan.md` seguindo
      estritamente `docs/api_contract.md`, `docs/TECH_STACK.md` e o PRD.

      Preserve o layout canônico de biblioteca declarado na stack; não crie
      `src/frontend`, aplicação web, servidor HTTP, dashboard, browser,
      mockup, screenshot ou watermark. Para Python use sempre Poetry e a venv do
      projeto, nunca pip global. O pacote público, modelos, protocolos, adapters,
      políticas, persistência e testes devem permanecer desacoplados conforme a
      arquitetura aprovada. Implemente apenas P0 deste marco; P1/P2 ficam fora.
      Preserve a versão de pacote encontrada no baseline; projeto novo permanece
      em `0.0.1`. Não faça bump de versão sem direção explícita do stakeholder ou
      um ciclo de release autorizado.

      Crie/atualize um Makefile não interativo com os targets `test`, `lint`,
      `typecheck`, `build`, `smoke` e `verify`. `verify` executa os checks
      herméticos completos sem rede paga ou credenciais reais. `smoke` instala ou
      importa o artefato construído em ambiente isolado e executa o quickstart
      público. Testes reais de providers permanecem opt-in e nunca produzem PASS
      falso quando indisponíveis.

      Se algum PB selecionado exigir CI, preserve o provedor já versionado ou o
      indicado pelo remote e faça o workflow executar o gate headless (`make ci`
      ou `make verify`). Se não houver workflow nem remote/host configurado, use
      `.github/workflows/quality.yml` como fallback local determinístico, registre
      a suposição no relatório e limite-o a checks — sem deploy ou publicação.
      Não crie um segundo provedor de CI nem introduza build de frontend,
      browser ou screenshots.

      Execute os targets até ficarem verdes. Gere
      `docs/headless-build-report.md` mapeando cada PB selecionado para paths,
      testes, comandos, resultados e limitações honestas. Responda DONE somente
      após build e smoke reais.
    validators:
      - file_exists: Makefile
      - file_exists: docs/headless-build-report.md
      - command_succeeds: "make verify"
      - command_succeeds: "make build"
      - command_succeeds: "make smoke"
      - command_succeeds: "git diff --check"
    next: ft.headless.02.review

  - id: ft.headless.02.review
    type: review
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    title: "Revisar Biblioteca contra o Contrato Público"
    description: "Auditoria independente e somente leitura do pacote, API pública, escopo P0, testes e evidências headless."
    sprint: sprint-04-headless-review
    executor: claude
    max_turns: 80
    outputs:
      - docs/headless-review.md
      - docs/headless-review.yml
    write_scope:
      - docs/headless-review.md
      - docs/headless-review.yml
    prompt: |
      Faça revisão independente; não altere código. Leia o contrato público, o
      plano headless, build report e diff do candidato. Execute `make verify`,
      `make build` e `make smoke`. Audite imports/assinaturas, tipos, erros,
      concorrência, persistência, políticas, compatibilidade, empacotamento,
      quickstart e ausência de segredo. Confirme também que não foi criada UI,
      servidor ou evidência visual para satisfazer o processo.
      Compare também a versão do pacote com o baseline do ciclo; bump não
      autorizado é finding, não evidência de entrega.

      Escreva `docs/headless-review.md` com uma linha
      `VERDICT: APPROVED` ou `VERDICT: REJECTED` e matriz PB→evidência.
      Escreva `docs/headless-review.yml`:
        schema_version: 1
        scope_sha256: <sha256 dos bytes de docs/headless-validation-plan.md>
        verdict: APPROVED | REJECTED
        results:
          - ref: PB-001
            result: PASS | FAIL
            evidence: [<path/comando/resultado sanitizado>]
        findings:
          - id: F-001
            refs: [PB-001]
            summary: <defeito reproduzível>
            evidence: [<prova>]
      Cubra exatamente os PB-* do plano uma vez. APPROVED exige todos PASS,
      findings vazio e os três targets Make verdes. REJECTED exige findings que
      cubram exatamente os PB reprovados. Não aprove mock/placeholder como
      implementação da API pública.

      No bloco `focal_evidence` exigido pelo engine, cada item de
      `claims[].evidence` deve ser somente um path relativo existente no
      repositório. Coloque comandos, exit codes, hashes e resultados textuais em
      `observed`, nunca como itens de `evidence`; não invente arquivo de prova.
    validators:
      - file_exists: docs/headless-review.md
      - file_exists: docs/headless-review.yml
      - review_outcome_valid:
          path: docs/headless-review.yml
          markdown_path: docs/headless-review.md
          scope_path: docs/headless-validation-plan.md
          scope_pattern: "\\bPB-\\d+\\b"
          require_approved: false
      - command_succeeds: "git diff --check"
    on_fail:
      human_gate: "A revisão headless encontrou defeitos focais."
      goto: ft.headless.03.fix
      automatic: true
    next: ft.headless.04.verify

  - id: ft.headless.03.fix
    type: build
    no_pre_seed: true
    title: "Corrigir Achados Headless"
    description: "Corrigir somente findings reproduzidos pela revisão/aceite e retornar à auditoria independente."
    sprint: sprint-04-headless-review
    executor: claude
    max_turns: 100
    outputs:
      - src/
      - tests/
      - examples/
      - migrations/
      - pyproject.toml
      - poetry.lock
      - Makefile
      - README.md
      - .github/workflows/
      - .gitlab-ci.yml
      - .circleci/
      - azure-pipelines.yml
      - Jenkinsfile
      - docs/headless-fix-report.md
    write_scope:
      - src
      - tests
      - examples
      - migrations
      - pyproject.toml
      - poetry.lock
      - Makefile
      - README.md
      - .github/workflows
      - .gitlab-ci.yml
      - .circleci
      - azure-pipelines.yml
      - Jenkinsfile
      - docs/headless-fix-report.md
    prompt: |
      Corrija somente os findings correntes de `docs/headless-review.yml` ou o
      feedback focal mais recente do stakeholder. Preserve contrato, escopo e
      evidências aprovadas; não adicione UI, HTTP, browser ou item P1/P2.
      Preserve a versão do baseline, exceto quando o próprio finding exigir
      restaurar um bump não autorizado ou houver direção explícita de release.
      Quando um finding exigir CI, preserve o provedor já versionado ou indicado
      pelo remote e faça-o executar o gate headless existente. Se nenhum host ou
      workflow estiver configurado, crie `.github/workflows/quality.yml` como
      fallback local determinístico e registre a suposição. O fallback executa
      checks e serviços de teste necessários, sem deploy, publicação ou pipeline
      visual; nunca adicione um segundo provedor de CI.
      Execute testes focais e depois `make verify`. Registre finding→causa→paths
      →correção→teste→resultado em `docs/headless-fix-report.md`.
    validators:
      - file_exists: docs/headless-fix-report.md
      - command_succeeds: "make verify"
      - command_succeeds: "git diff --check"
    fix_review: ft.headless.02.review
    next: ft.headless.02.review

  - id: ft.headless.04.verify
    type: gate
    title: "Gate Integrado da Biblioteca"
    description: "Exige revisão aprovada, suíte completa, pacote construído e quickstart público exercitado sem rede/segredo."
    sprint: sprint-05-headless-verify
    executor: python
    validation_mode: fail_fast
    validators:
      - review_outcome_valid:
          path: docs/headless-review.yml
          markdown_path: docs/headless-review.md
          scope_path: docs/headless-validation-plan.md
          scope_pattern: "\\bPB-\\d+\\b"
          require_approved: true
      - command_succeeds: "make verify"
      - command_succeeds: "make build"
      - command_succeeds: "make smoke"
      - command_succeeds: "git diff --check"
    next: ft.headless.05.acceptance

  - id: ft.headless.05.acceptance
    type: review
    no_pre_seed: true
    title: "Aceite da API Pública Headless"
    description: "Executar cenários P0 pela superfície programática real e produzir resultado estruturado, sem navegador ou servidor suplementar."
    sprint: sprint-06-headless-acceptance
    executor: claude
    max_turns: 80
    outputs:
      - docs/acceptance-report.md
      - docs/acceptance-result.json
    write_scope:
      - docs/acceptance-report.md
      - docs/acceptance-result.json
    prompt: |
      Execute todos os cenários P0 de `docs/test_data.md` através da API pública
      real descrita em `docs/api_contract.md`. Use o pacote construído e o
      quickstart, não imports internos. Fake/replay pode representar dependência
      externa, mas a implementação, roteamento, políticas, persistência e erros
      da biblioteca devem ser reais. Não use HTTP, browser, screenshots ou
      placeholders. Rode também `make verify`, `make build` e `make smoke`.
      Confirme que a versão do pacote continua igual ao baseline do ciclo;
      alteração sem autorização entra em `p0_blockers` e não pode ser aceita.

      Gere `docs/acceptance-report.md` com cenário, PB, comando, resultado e
      evidência. Gere `docs/acceptance-result.json` exatamente com
      `pass`, `fail`, `skip` e `p0_blockers`. Cenário P0 não executado ou prova
      principal substituída entra em p0_blockers; skip só pode ser não-P0.

      No bloco `focal_evidence` exigido pelo engine, cada item de
      `claims[].evidence` deve ser somente um path relativo existente no
      repositório. Registre comandos, exit codes, hashes e resultados textuais em
      `observed`, não em `evidence`, e nunca invente um arquivo de prova.
    validators:
      - file_exists: docs/acceptance-report.md
      - file_exists: docs/acceptance-result.json
      - command_succeeds: "python3 -c \"import json; d=json.load(open('docs/acceptance-result.json')); assert isinstance(d.get('pass'),int) and d['pass']>0 and d.get('fail')==0 and isinstance(d.get('skip'),int) and d['skip']>=0 and d.get('p0_blockers')==[], d\""
      - command_succeeds: "make verify"
      - command_succeeds: "make build"
      - command_succeeds: "make smoke"
      - command_succeeds: "git diff --check"
    on_fail:
      human_gate: "O aceite headless encontrou falha ou bloqueador P0."
      goto: ft.headless.03.fix
      automatic: true
    next: ft.headless.06.stakeholder

  - id: ft.headless.06.stakeholder
    type: human_gate
    title: "Validação da Biblioteca pelo Stakeholder"
    description: "Revise o contrato público, execute o quickstart e confirme API, empacotamento, comportamento e evidências P0. Não há interface visual. Rejeite com um defeito reproduzível se necessário."
    sprint: sprint-06-headless-acceptance
    executor: python
    outputs:
      - docs/api_contract.md
      - docs/acceptance-report.md
      - docs/acceptance-result.json
    reject_next: ft.headless.03.fix
    next: ft.handoff.01.retro

  - id: ft.plan.03.api_contract
    type: document
    parallel_group: plan-docs   # com ft run --parallel: roda junto de plan.04 e plan.05
    no_pre_seed: true
    title: "Definir Contrato de API"
    description: "Documentar todos os endpoints da API em formato acionavel. Estrutura obrigatoria: ## Base URL e ## Endpoints. Em ## Endpoints, use tabela Markdown com colunas Método | Path | Descrição | Request | Response | Erros. Cada Path deve ser concreto e derivado de docs/PROJECT_BACKLOG.md e docs/task_list.md; é proibido usar / como endpoint de produto. Incluir GET /health sem prefixo /api. Endpoints de produto devem usar paths como /api/<recurso>. Se o produto tiver criação/cadastro, incluir POST /api/<recurso> para cada entidade criável. Servir como contrato entre frontend e backend — evita mismatch de rotas."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/api_contract.md
    validators:
      - file_exists: docs/api_contract.md
      - has_sections:
          - Base URL
          - Endpoints
      - document_quality:
          path: docs/api_contract.md
          min_lines_count: 25
          max_lines_count: 180
          forbidden: ["<tool_call", "<arg_key", "<arg_value", "OpenSearch", "autenticacao requer", "auth/login", "vou analisar", "I notice", "I'll help"]
      - api_contract_complete:
          path: docs/api_contract.md
          min_endpoints: 3
    next: ft.plan.04.ui_criteria

  - id: ft.plan.04.ui_criteria
    type: document
    parallel_group: plan-docs
    title: "Consolidar Contrato de Navegação"
    description: "Classificar cada item do backlog entre capacidade visível, com entrada pela UI de produção, ou requisito não visual justificado, preservando o contrato visual de mockups já aprovado."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/navigation-contract.yml
    write_scope:
      - docs/navigation-contract.yml
    prompt: |
      Os mockups raster, docs/ui_criteria.md e docs/ui-brief.md já foram
      revisados e aprovados como contrato visual antes deste planejamento.
      Não os altere, não renumere CIDs/SNNs e não acrescente tela, estado ou
      requisito visual sem um novo ciclo explícito de mockups. Preserve também
      docs/mockups/ integralmente. Uma capacidade não está entregue se só puder
      ser aberta por rota/URL interna direta, deep link de debug, catálogo
      técnico, montagem isolada de componente ou hook test-only.

      Gere SOMENTE docs/navigation-contract.yml a partir dos bytes correntes de
      docs/PROJECT_BACKLOG.md, sem assumir stack, domínio ou plataforma:
        schema_version: 1
        scope_sha256: <sha256 dos bytes de docs/PROJECT_BACKLOG.md>
        scope_refs:
          - ref: PB-001
            disposition: ui | non_ui
            targets: [NAV-001]
            reason: <obrigatório apenas para non_ui>
        targets:
          - id: NAV-001
            label: <capacidade ou superfície reconhecível pelo usuário>
            entry_policy: public | entitled | contextual | first_launch

      Classifique exatamente todos os PB-* presentes no backlog. Todo PB que
      cria ou altera uma capacidade visível usa disposition ui e aponta a um
      target. Papéis, flags e coortes usam entry_policy entitled; fluxos que só
      existem após uma ação usam contextual. Não use path técnico como label.
    validators:
      - file_exists: docs/ui_criteria.md
      - ui_criteria_ids:
          path: docs/ui_criteria.md
          min_count: 8
      - file_exists: docs/navigation-contract.yml
      - navigation_contract_valid:
          path: docs/navigation-contract.yml
          scope_path: docs/PROJECT_BACKLOG.md
          scope_pattern: "\\bPB-\\d+\\b"
          min_targets: 1
    next: ft.plan.05.test_data

  - id: ft.plan.05.test_data
    type: document
    parallel_group: plan-docs
    title: "Gerar Massa de Dados para Aceitação"
    description: "Criar massa de dados realista para os testes de aceitação. OBRIGATÓRIO: todas as datas devem ser relativas à execução (HOJE, HOJE+N, HOJE-N) — nunca inclua anos ou datas absolutas hardcodadas. Ao menos um registro com data de hoje para validar agendamentos/eventos do dia."
    sprint: sprint-02-planning
    executor: claude
    outputs:
      - docs/test_data.md
    validators:
      - file_exists: docs/test_data.md
      - document_quality:
          path: docs/test_data.md
          min_lines_count: 12
          max_lines_count: 120
      - relative_dates_only:
          path: docs/test_data.md
      - project_contract_valid:
          path: .ft/project.yml
    next: ft.plan.gate

  - id: ft.start.01.product_mockups
    type: build
    title: "Gerar Protótipos Raster do Produto"
    description: "Logo após PRD, brief e critérios visuais, gerar imagens raster reais e revisáveis para todas as telas e estados P0, antes de backlog, stack, API, navegação, massa de testes ou código. HTML, CSS, JavaScript, SVG, canvas e screenshots de navegador são entregas proibidas neste step."
    sprint: sprint-02-planning
    executor: codex
    expert: prototype_png_designer
    llm_engine: codex
    llm_model: gpt-5.6-sol
    llm_effort: max
    codex_auth: chatgpt
    max_turns: 100
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    env_setup:
      - >-
          python3 -c "import subprocess;
          status=subprocess.check_output(['codex','login','status'],text=True,stderr=subprocess.STDOUT);
          assert 'Logged in using ChatGPT' in status, 'Codex sem login ChatGPT direto';
          out=subprocess.check_output(['codex','features','list'],text=True);
          rows=[line.split() for line in out.splitlines()];
          assert any(row and row[0]=='image_generation' and row[-1]=='true' for row in rows),
          'Codex image_generation indisponível ou desabilitado'"
    outputs:
      - docs/mockups/screen-map.yml
      - docs/mockups/image-generation-receipt.yml
      - docs/mockups/README.md
      - docs/mockups/images/
    write_scope:
      - docs/mockups
    prompt: |
      Gere o pacote obrigatório de PROTÓTIPOS RASTER DO PRODUTO imediatamente
      após PRD, brief e critérios visuais, antes de qualquer planejamento técnico
      ou código de produto. Este node está fixado em gpt-5.6-sol com reasoning
      effort max; não troque modelo nem reduza o esforço. O Sol/Max é a
      autoridade de direção visual, composição dos prompts, seleção, inspeção e
      iteração dos assets. A skill de imagem escolhe internamente seu modelo de
      geração; não tente passá-lo pelo campo llm_model nem alterar o executor
      textual do node.

      Leia integralmente e use como únicas fontes de produto docs/PRD.md,
      docs/ui_criteria.md e docs/ui-brief.md. O brief do stakeholder é
      autoritativo para estética; PRD e critérios são autoritativos para escopo
      e estados. Não leia, espere, exija ou invente docs/TECH_STACK.md,
      docs/api_contract.md, docs/navigation-contract.yml ou docs/test_data.md:
      esses artefatos são produzidos somente depois deste aceite e devem
      respeitar o contrato visual aprovado aqui.

      Invoque explicitamente `$imagegen` e siga integralmente a skill. Use
      obrigatoriamente sua ferramenta built-in `image_gen`, no caso de uso
      `ui-mockup`, uma chamada por tela/estado distinto. Não use fallback
      CLI/API. Se a skill ou a ferramenta built-in não estiver disponível,
      responda BLOCKED: não improvise outro renderer. Depois de cada geração,
      copie ou mova o PNG escolhido de
      `$CODEX_HOME/generated_images/` para docs/mockups/images/, abra-o com
      `view_image`, inspecione composição, hierarquia, legibilidade, texto e
      aderência ao brief e itere com uma mudança focal quando necessário.

      É PROIBIDO criar HTML, CSS, JavaScript, TypeScript, JSX, SVG, canvas,
      frontend, página navegável, app de protótipo ou qualquer código usado para
      desenhar a interface. Também é proibido usar Chromium, Playwright,
      Puppeteer, browser/headless, screenshot de página/app, Pillow, ImageMagick
      ou rasterização programática como origem do mockup. Os PNGs finais devem
      sair da geração de imagem do modelo; operações locais servem apenas para
      copiar, nomear, calcular hash e inspecionar os arquivos.

      Trabalhe somente em docs/mockups/ e use dados sintéticos e sanitizados.
      Cada superfície P0 recebe ID estável SNN. Se possuir exatamente uma view,
      seu mockup usa o próprio SNN; se possuir duas ou mais views/estados, cada
      uma recebe obrigatoriamente um ID composto sequencial SNN.1, SNN.2, ...
      SNN.N, uma chamada image_gen própria e um PNG próprio. Renderize o ID exato
      de cada view na imagem, de forma discreta e fora de conteúdo imprimível.
      Nunca reúna múltiplas views em um único bitmap nem reutilize o badge
      genérico SNN entre estados. Cubra todas as variantes exigidas nos critérios:
      inicial, vazio, loading, sucesso, erro, bloqueio, confirmação e demais
      estados aplicáveis. Para desktop, componha em 16:10
      com referência visual 1440x900, preservando a resolução nativa entregue
      pelo gerador; para outros targets, respeite o viewport do brief. Não faça
      upscale, crop ou recomposição programática.

      Produza docs/mockups/screen-map.yml com schema_version: 1 e `screens`.
      Cada screen contém `id`, `title`, `criteria`, `acceptance_criteria` e
      `states`; cada state contém `id`, `label`, `target`, `image`, `width`,
      `height` e `prompt_ref`. Todo `image` aponta para PNG existente sob
      docs/mockups/images/ e width/height registram as dimensões nativas reais.

      Produza docs/mockups/image-generation-receipt.yml com schema_version: 1,
      `executor: {engine: codex, model: gpt-5.6-sol, effort: max}`,
      `generation: {skill: imagegen, tool: image_gen, mode: builtin, use_case: ui-mockup}`,
      `code_native_sources: false`, `browser_capture: false` e `assets`. Cada
      asset contém `id`, `screen`, `state`, `image`, `prompt`, `inspected: true`
      e `revisions: {count: <inteiro não negativo>, notes: [<ajustes>]}`. Produza
      README.md com inventário, decisões visuais,
      instruções para abrir os PNGs e checklist de revisão; deixe explícito que
      não existe protótipo executável neste pacote.

      Em reentrada após rejeição, leia CURRENT_FEEDBACK, preserve os assets não
      afetados e use o fluxo de edição da skill imagegen somente nas imagens
      citadas. Antes de DONE, valide YAML, hashes distintos, unicidade dos IDs,
      cobertura de todos os CIDs e estados P0, dimensões reais, recibo completo,
      ausência de fontes code-native e `git diff --check`. Placeholder, imagem
      vazia ou cópia do mesmo bitmap para estados diferentes é falha.
    validators:
      - file_exists: docs/mockups/screen-map.yml
      - file_exists: docs/mockups/image-generation-receipt.yml
      - file_exists: docs/mockups/README.md
      - command_succeeds: >-
          python3 -c "import hashlib,re,yaml; from pathlib import Path;
          d=yaml.safe_load(Path('docs/mockups/screen-map.yml').read_text(encoding='utf-8'));
          s=d.get('screens') if isinstance(d,dict) else None;
          assert d.get('schema_version')==1 and isinstance(s,list) and s;
          ids=[x.get('id') for x in s]; assert len(ids)==len(set(ids)) and all(re.fullmatch(r'S[0-9]{2,}',str(x)) for x in ids);
          criteria=set(re.findall(r'\bC[0-9]{2,}\b',Path('docs/ui_criteria.md').read_text(encoding='utf-8')));
          mapped={str(c) for x in s for c in (x.get('criteria') or [])}; assert criteria<=mapped, 'critérios visuais sem imagem';
          states=[st for x in s for st in (x.get('states') or [])];
          assert states and all(st.get('id') and st.get('label') and st.get('target') and st.get('image') and st.get('prompt_ref') for st in states);
          state_ids=[str(st['id']) for st in states]; assert len(state_ids)==len(set(state_ids));
          assert all([str(st['id']) for st in (x.get('states') or [])]==([str(x['id'])] if len(x.get('states') or [])==1 else [f\"{x['id']}.{i}\" for i in range(1,len(x['states'])+1)]) for x in s), 'IDs de views devem seguir SNN ou SNN.1..N';
          refs=[Path(st['image']) for st in states]; assert len(refs)==len(set(refs));
          assert all(p.parts[:1]==('images',) and p.name.startswith(str(st['id'])+'-') for p,st in zip(refs,states)), 'imagem relativa e nome do PNG devem usar o ID exato da view';
          imgs=[Path('docs/mockups')/p for p in refs];
          assert all(p.parts[:3]==('docs','mockups','images') and p.is_file() and p.suffix.lower()=='.png' and p.stat().st_size>51200 for p in imgs);
          raw=[p.read_bytes() for p in imgs]; assert all(b[:8]==b'\\x89PNG\\r\\n\\x1a\\n' for b in raw);
          actual=[(int.from_bytes(b[16:20],'big'),int.from_bytes(b[20:24],'big')) for b in raw];
          declared=[(int(st.get('width',0)),int(st.get('height',0))) for st in states];
          assert actual==declared and all(w>=768 and h>=768 for w,h in actual);
          assert len({hashlib.sha256(b).hexdigest() for b in raw})==len(raw), 'bitmaps duplicados entre estados'"
      - command_succeeds: >-
          python3 -c "import yaml; from pathlib import Path;
          r=yaml.safe_load(Path('docs/mockups/image-generation-receipt.yml').read_text(encoding='utf-8'));
          assert r.get('schema_version')==1;
          assert r.get('executor')=={'engine':'codex','model':'gpt-5.6-sol','effort':'max'};
          assert r.get('generation')=={'skill':'imagegen','tool':'image_gen','mode':'builtin','use_case':'ui-mockup'};
          assert r.get('code_native_sources') is False and r.get('browser_capture') is False;
          assets=r.get('assets'); assert isinstance(assets,list) and assets;
          mapped=yaml.safe_load(Path('docs/mockups/screen-map.yml').read_text(encoding='utf-8'))['screens'];
          expected={st['image'] for screen in mapped for st in screen['states']};
          observed={a.get('image') for a in assets}; assert observed==expected;
          assert all(a.get('id') and a.get('screen') and a.get('state') and a.get('prompt') and a.get('inspected') is True and isinstance(a.get('revisions'),dict) and isinstance(a['revisions'].get('count'),int) and a['revisions']['count']>=0 and isinstance(a['revisions'].get('notes'),list) for a in assets)"
      - command_succeeds: >-
          python3 -c "from pathlib import Path;
          root=Path('docs/mockups'); files=[p for p in root.rglob('*') if p.is_file()];
          forbidden={'.html','.htm','.css','.js','.mjs','.cjs','.ts','.tsx','.jsx','.svg','.vue','.svelte'};
          bad=[str(p) for p in files if p.suffix.lower() in forbidden];
          assert not bad, 'fontes code-native proibidas: '+', '.join(bad);
          assert all(p.suffix.lower() in {'.png','.md','.yml','.yaml'} for p in files), 'tipo de artefato não permitido'"
      - command_succeeds: "git diff --check"
    next: ft.start.01a.product_mockup_review

  - id: ft.start.01a.product_mockup_review
    type: review
    title: "Analisar Protótipos Raster contra o PRD"
    description: "Revisar de forma independente cada state do screen-map contra PRD, brief e critérios visuais, sem alterar imagens ou fontes canônicas."
    sprint: sprint-02-planning
    executor: codex
    llm_engine: codex
    llm_model: gpt-5.6-sol
    llm_effort: max
    max_turns: 100
    no_pre_seed: true
    outputs:
      - docs/mockups/prd-coherence-review.md
      - docs/mockups/prd-coherence-review.yml
    write_scope:
      - docs/mockups/prd-coherence-review.md
      - docs/mockups/prd-coherence-review.yml
    prompt: |
      Faça uma revisão independente, exaustiva e somente de leitura dos
      protótipos raster. Leia integralmente docs/PRD.md, docs/ui_criteria.md,
      docs/ui-brief.md, docs/mockups/screen-map.yml e
      docs/mockups/image-generation-receipt.yml. Para cada state, na ordem exata
      do screen-map, abra o PNG declarado com `view_image` em resolução original
      e compare individualmente conteúdo, estado, hierarquia, navegação, dados,
      critérios e requisitos. Leia `acceptance_criteria` do screen pai como
      prosa livre; não o converta em CSV e não trate vírgulas ou ponto e vírgula
      como separadores estruturais.

      Não altere PNGs, screen-map, receipt, PRD, critérios ou brief. Escreva
      SOMENTE os dois relatórios declarados em outputs. Não corrija
      automaticamente os mockups e não crie outra rota de orquestração.

      Escreva docs/mockups/prd-coherence-review.yml com este contrato:
        schema_version: 1
        prd_sha256: <sha256 dos bytes correntes de docs/PRD.md>
        ui_criteria_sha256: <sha256 dos bytes correntes de docs/ui_criteria.md>
        screen_map_sha256: <sha256 dos bytes correntes do screen-map>
        verdict: APPROVED | REJECTED
        summary:
          total_views: <inteiro>
          coherent: <inteiro>
          coherent_with_reservation: <inteiro>
          incoherent: <inteiro>
        views:
          - state_id: <screens[].states[].id exato>
            screen_id: <screens[].id exato>
            prd_screen_id: <screens[].prd_screen_id TNN exato, ou N/A se ausente>
            requirements: [<referências que existem literalmente no PRD>]
            criteria: [<CIDs exatos do screen pai, na mesma ordem>]
            result: COHERENT | COHERENT_WITH_RESERVATION | INCOHERENT
            blocking: <true somente para INCOHERENT; false nos demais casos>
            observation: <conclusão específica e verificável>
            image: <screens[].states[].image exata>
        findings:
          - id: F-001
            state_id: <state incoerente>
            expected: <comportamento ou conteúdo exigido>
            observed: <divergência observada>
            evidence: [<image PNG exata do state>]
            blocking: true

      Preserve exatamente a cobertura e a ordem de screens/states do inventário.
      Nunca infira TNN a partir de SNN: copie `prd_screen_id` quando presente e
      use o literal `N/A` para superfície auxiliar sem esse campo. Cada
      requirement deve ser uma referência real presente no PRD e cada CID deve
      ser copiado do screen pai e existir em ui_criteria. Use somente paths PNG
      relativos e seguros sob docs/mockups/images/.

      APPROVED exige zero INCOHERENT e `findings: []`; reservas são permitidas,
      mas COHERENT_WITH_RESERVATION sempre usa `blocking: false`. REJECTED exige
      ao menos um INCOHERENT e um ou mais findings acionáveis que cubram todos e
      somente os states incoerentes, cada qual com expected, observed e evidence
      contendo o PNG exato. Um relatório REJECTED também segue ao human gate.

      Escreva docs/mockups/prd-coherence-review.md com exatamente uma linha
      `VERDICT: APPROVED` ou `VERDICT: REJECTED`, seguida das seções `## Resumo`,
      `## Achados Transversais` e `## Revisão por State`. Em Resumo use uma linha
      para cada contador no formato `- TOTAL_VIEWS: N`, `- COHERENT: N`,
      `- COHERENT_WITH_RESERVATION: N` e `- INCOHERENT: N`. Em Revisão por State
      escreva exatamente uma linha por view, na ordem do YAML:
      `- STATE: <id> | SCREEN: <id> | PRD_SCREEN: <id ou N/A> | RESULT: <enum> | IMAGE: <path>`.
      Em Achados Transversais, use `- Nenhum finding transversal.` quando vazio;
      caso contrário, uma linha por finding:
      `- FINDING: <id> | STATE: <id> | EVIDENCE: <PNG exato>`.
      Markdown e YAML devem ter veredito, contagens, ordem, resultados, imagens e
      findings idênticos.

      Antes de DONE, execute
      `python3 .ft/process/mvp-builder-fast/scripts/validate_mockup_prd_review.py`.
      Corrija somente os dois relatórios se a validação falhar.
    validators:
      - file_exists: docs/mockups/prd-coherence-review.md
      - file_exists: docs/mockups/prd-coherence-review.yml
      - command_succeeds: "python3 .ft/process/mvp-builder-fast/scripts/validate_mockup_prd_review.py"
    next: ft.start.01b.product_mockup_gate

  - id: ft.start.01b.product_mockup_gate
    type: human_gate
    title: "Revisão dos Protótipos Raster do Produto"
    description: "Revise os relatórios de coerência e abra os PNGs em resolução original. Confirme estética, hierarquia, cobertura e aderência ao PRD e ao brief. Backlog, planejamento técnico e frontend não começam sem aprovação explícita e textual; rejeite descrevendo tela, state e ajuste visual."
    sprint: sprint-02-planning
    executor: python
    approval_message_required: true
    decision_context:
      decision: >-
        Decidir se o pacote de mockups P0 está coerente com o PRD e os contratos
        visuais e pode se tornar o contrato visual da implementação.
      why_now: >-
        Cada state acabou de ser regenerado ou confirmado e recebeu uma revisão
        independente com hashes das fontes correntes antes desta decisão humana.
      review_paths:
        - docs/mockups/prd-coherence-review.md
        - docs/mockups/prd-coherence-review.yml
        - docs/mockups/screen-map.yml
        - docs/mockups/README.md
        - docs/mockups/images/
        - docs/PRD.md
        - docs/ui_criteria.md
      checklist:
        - Confirme que os hashes e as contagens do relatório estruturado são correntes e que Markdown e YAML apresentam o mesmo veredito.
        - Percorra cada linha de state na ordem do screen-map e abra o PNG correspondente em resolução original.
        - Compare requisitos, CIDs, navegação, dados, estados e observações com PRD, critérios visuais e brief, sem inferir mapeamentos TNN→SNN.
        - Rejeite qualquer INCOHERENT, finding sem evidência acionável, state ausente, imagem inacessível ou desvio visual relevante, mesmo que o relatório diga APPROVED.
      limitations:
        - A aprovação cobre somente os mockups e states inventariados para este P0; não amplia PRD, critérios ou escopo de implementação.
        - O relatório independente apoia a decisão, mas não substitui a inspeção humana dos PNGs em resolução original.
      approve_effect: >-
        Registra os mockups como contrato visual aprovado e avança à fundação do
        backlog e do planejamento técnico.
      reject_effect: >-
        Retorna à geração focal dos mockups; toda regeneração passa novamente
        pela revisão independente antes de reapresentar este gate.
    outputs:
      - docs/mockups/
      - docs/mockups/prd-coherence-review.md
      - docs/mockups/prd-coherence-review.yml
    reject_next: ft.start.01.product_mockups
    next: ft.start.backlog.route

  - id: ft.plan.gate
    type: gate
    title: "Gate Planning"
    description: "Verificação determinística: todos os documentos de planejamento existem antes de iniciar implementação."
    sprint: sprint-02-planning
    executor: python
    validators:
      - file_exists: docs/task_list.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - file_exists: docs/FEATURES.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - document_quality:
          path: docs/task_list.md
          min_lines_count: 20
          max_lines_count: 120
          forbidden: ["<tool_call", "<arg_key", "<arg_value", "vou analisar", "vou criar", "preciso verificar", "devo decompor", "I'll help", "Let me first", "I need to", "I will"]
          required_terms: ["PB-", "task", "frontend", "backend", "teste"]
          min_required_terms: 5
      - task_list_references_backlog:
          task_path: docs/task_list.md
          backlog_path: docs/PROJECT_BACKLOG.md
          min_refs: 1
      - file_exists: docs/TECH_STACK.md
      - file_exists: docs/api_contract.md
      - api_contract_complete:
          path: docs/api_contract.md
          min_endpoints: 3
      - file_exists: docs/ui_criteria.md
      - ui_criteria_ids:
          path: docs/ui_criteria.md
          min_count: 8
      - file_exists: docs/navigation-contract.yml
      - navigation_contract_valid:
          path: docs/navigation-contract.yml
          scope_path: docs/PROJECT_BACKLOG.md
          scope_pattern: "\\bPB-\\d+\\b"
          min_targets: 1
      - file_exists: docs/test_data.md
      - relative_dates_only:
          path: docs/test_data.md
    next: ft.frontend.01.build

  # ================================================================
  # Sprint 03 — Frontend
  # ================================================================

  - id: ft.frontend.01.build
    type: build
    title: "Construir Superfície P0"
    description: "Em um único turn, criar e implementar a superfície visual nativa ou web selecionada pelo contrato do projeto dentro de src/frontend/, seguindo PRD, critérios visuais e contrato de integração."
    sprint: sprint-03-frontend
    executor: claude
    outputs:
      - src/frontend/
      - src/Makefile
      - .build_ok
    write_scope:
      - src/frontend
      - src/Makefile
      - .build_ok
    no_pre_seed: true
    prompt: |
      Construa a superfície visual completa desta sprint em um único turn:
      1. Leia `.ft/project.yml.validation` e docs/TECH_STACK.md e implemente em
         src/frontend/ a plataforma realmente selecionada: Android nativo,
         iOS nativo, web ou desktop. Não substitua aplicação nativa por página web.
      2. Configure o mecanismo nativo da stack para layout, navegação e integração
         com o backend/API quando o contrato exigir. Proxy/rewrites existem apenas
         para stacks web; Compose, SwiftUI e toolkits desktop usam seus mecanismos.
      3. Implemente todas as telas e funcionalidades P0 do PRD.
      4. Use os mockups aprovados em docs/mockups/ como contrato visual e cubra
         docs/ui_criteria.md, inclusive estados vazio, loading e erro.
      5. Se o contrato possuir criação/cadastro, entregue o fluxo por controles
         de produção acessíveis na UI e conectado à operação correspondente;
         não presuma HTML, `<form>` ou um framework JavaScript.
      6. Em cada tela, página ou janela renderize no próprio produto a marca
         d'água com o identificador exato do mockup definido nos critérios.
      7. Crie src/Makefile com o target `surface-build`, instale dependências pelo
         gerenciador da stack e execute `make -C src surface-build` antes de encerrar.
      Todo código de produto deve permanecer abaixo de src/.
    validators:
      - file_exists: src/frontend/
      - file_exists: src/Makefile
      - command_succeeds: "make -C src surface-build"
    next: ft.frontend.03.prd_review

  - id: ft.frontend.02.implement
    type: build
    title: "Corrigir Superfície Visual"
    description: "Corrigir em lote somente os findings da revisão visual na plataforma selecionada, seguindo mockups, docs/ui_criteria.md e docs/TECH_STACK.md sem presumir browser, HTML, npm ou framework JavaScript."
    fix_review: ft.frontend.03.prd_review
    sprint: sprint-03-frontend
    executor: claude
    outputs:
      - src/frontend/
      - src/Makefile
    write_scope:
      - src
      - src/Makefile
    no_pre_seed: true
    validators:
      - file_exists: src/frontend/
      - file_exists: src/Makefile
      - command_succeeds: "make -C src surface-build"
    next: ft.frontend.03.prd_review

  - id: ft.frontend.03.prd_review
    type: review
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    title: "Revisão Visual Independente da Superfície"
    description: "Em uma lane separada da sessão de construção, auditar build, navegação visual, mockups, clareza operacional e watermarks antes do backend. Este checkpoint não exige nem aceita fixtures como prova de integração real."
    sprint: sprint-03-frontend
    executor: claude
    max_turns: 60
    outputs:
      - docs/screenshots/surface-visual/
      - docs/surface-visual-review.md
      - docs/surface-visual-review.yml
    write_scope:
      - docs/screenshots/surface-visual
      - docs/surface-visual-review.md
      - docs/surface-visual-review.yml
    prompt: |
      Faça a revisão visual independente da superfície entregue nesta sprint:
      1. Audite o build, as rotas e a navegação visual disponível contra os
         mockups e os requisitos de interface do PRD.
      2. Execute a aplicação com o runner apropriado à plataforma selecionada
         (instrumentação Android, XCUITest, browser ou automação desktop) e
         capture evidências reais de cada state inventariado.
      3. Verifique adaptação à tela, estados renderizáveis, clareza operacional
         e a marca d'água exata de cada mockup. Use o aparelho em seu perfil
         padrão e não altere configurações do sistema. Use instrumentação do
         app, input por coordenadas e screenshots da plataforma.
         Se a execução corrente já possuir todas as capturas inventariadas, não
         interaja novamente com o aparelho: consolide por análise offline.
         Capturas físicas anteriores continuam válidas como evidência dos pixels
         renderizados. Após fix, recolete apenas refs afetados,
         ausentes ou com tema divergente usando o método permitido. Antes de
         rejeitar por falta de evidência corrente, tente essa coleta focal.
         Em aparelho compartilhado, notificação pode e deve usar recorte
         sanitizado da superfície do produto com receipt próprio; nunca preserve
         a cortina completa quando ela contiver notificações pessoais.
      4. Compare cada tela/estado com a imagem de mockup aprovada correspondente em
         docs/mockups/screen-map.yml e registre divergências verificáveis.
      5. Grave cada execução em um subdiretório novo e imutável sob
         docs/screenshots/surface-visual/; preserve todas as evidências anteriores.
      6. Escreva docs/surface-visual-review.md com exatamente uma linha global
         `VERDICT: APPROVED` ou `VERDICT: REJECTED`, identificando explicitamente
         a evidência como VISUAL_ONLY e sem declarar cobertura integrada.
      7. Escreva docs/surface-visual-review.yml com o contrato:
           schema_version: 1
           scope_sha256: <sha256 dos bytes correntes de docs/mockups/screen-map.yml>
           verdict: APPROVED | REJECTED
           evidence_grade: VISUAL_ONLY
           results:
             - ref: <cada state SNN.N do screen-map exatamente uma vez>
               result: PASS | FAIL
               evidence: [<screenshot físico repo-local desta execução>]
           findings:
             - id: FV-001
               refs: [<states reprovados>]
               severity: P0 | P1 | P2
               summary: <divergência visual ou operacional>
               evidence: [<paths repo-local verificáveis>]
         Markdown e YAML devem ter o mesmo veredito. Findings devem cobrir
         exatamente os states FAIL.
         SEVERIDADE (obrigatória em cada finding): `severity: P0|P1|P2`.
           P0 — bloqueante: quebra funcional, rota/ação P0 inacessível, dado
                corrompido ou perdido, falha de segurança/autorização.
           P1 — defeito real sem bloqueio: degrada a experiência mas o produto
                cumpre a obrigação.
           P2 — cosmético ou melhoria pontual.
         Escolha o veredito pela severidade, não pela existência de achados:
           APPROVED — nenhum FAIL e findings vazio.
           APPROVED_WITH_FINDINGS — há FAIL, mas nenhum finding P0. O ciclo
             SEGUE em frente e os findings viram dívida no backlog.
           REJECTED — existe ao menos um finding P0. Só então o ciclo volta
             para correção.
         Não use REJECTED para achado P1/P2: cada volta desnecessária custa
         uma rodada inteira de correção e re-review.
      8. Não exija backend, API ou persistência reais neste checkpoint. Dados
         locais determinísticos podem viabilizar a inspeção visual, mas nunca
         contam como prova de integração ou fidelidade de dados.
      9. Audite todo o inventário em uma única execução e agregue todos os
         findings bloqueantes; não pare no primeiro defeito.
    validators:
      - command_succeeds: "make -C src surface-build"
      - file_exists: docs/screenshots/surface-visual/
      - file_exists: docs/surface-visual-review.md
      - file_exists: docs/surface-visual-review.yml
      - review_outcome_valid:
          path: docs/surface-visual-review.yml
          markdown_path: docs/surface-visual-review.md
          scope_path: docs/mockups/screen-map.yml
          scope_pattern: "(?<=\\{id: )S\\d+\\.\\d+\\b"
          require_approved: false
    on_fail:
      human_gate: "Revisão PRD encontrou não-conformidades no frontend. Corrija antes de continuar."
      goto: ft.frontend.02.implement
    next: gate.frontend

  - id: gate.frontend
    type: gate
    title: "Gate Visual da Superfície"
    description: "Verificação determinística pré-backend: o build da plataforma passa e a revisão visual existe, sem exigir cobertura de integração."
    sprint: sprint-03-frontend
    executor: python
    validators:
      - file_exists: docs/screenshots/surface-visual/
      - file_exists: docs/surface-visual-review.md
      - file_exists: docs/surface-visual-review.yml
      - command_succeeds: "make -C src surface-build"
      - review_outcome_valid:
          path: docs/surface-visual-review.yml
          markdown_path: docs/surface-visual-review.md
          scope_path: docs/mockups/screen-map.yml
          scope_pattern: "(?<=\\{id: )S\\d+\\.\\d+\\b"
          require_approved: true
          # Fix forward: findings P1/P2 aprovam e viram dívida no backlog;
          # P0 continua reprovando e devolvendo o ciclo à correção.
          allow_findings: true
    next: ft.tdd.01.red

  # ================================================================
  # Sprint 04 — TDD (Backend)
  # ================================================================

  - id: ft.tdd.01.red
    type: test_red
    title: "Red — Escrever Testes"
    description: "Escrever testes de unidade e integração para as obrigações P0 selecionadas em docs/task_list.md e para o comportamento observável de docs/api_contract.md. Cobrir fluxo feliz, erros, status, media type, schema e semânticas de estado relevantes. Os testes devem falhar por assertions do comportamento ausente (red), sem erro de coleta, import ou sintaxe. Usar datas relativas nos fixtures."
    sprint: sprint-04-tdd
    executor: claude
    outputs:
      - src/tests/
    validators:
      - file_exists: src/tests/
      - command_succeeds: "cd src && python -c \"from pathlib import Path; import py_compile; files=list(Path('tests').rglob('test_*.py')); assert files, 'nenhum test_*.py encontrado'; [py_compile.compile(str(p), doraise=True) for p in files]\""
      - command_succeeds: |
          python3 - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "pytest", "tests", "-q"],
              cwd="src",
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          assert result.returncode == 1, (
              "RED invalido: esperado pytest exit 1 por falha de assertion; "
              f"recebido {result.returncode}\n{result.stdout[-4000:]}"
          )
          PY
      - pytest_red_quality:
          tests_dir: src/tests
          min_test_files: 1
          min_tests: 3
          min_assertions: 3
    next: ft.tdd.02.green

  - id: ft.tdd.02.green
    type: test_green
    title: "Green — Implementar Backend"
    description: "Implementar o backend (API + banco) para fazer os testes passarem. Seguir estritamente o contrato de docs/api_contract.md. Entry point em src/backend/main.py. /health sem prefixo /api. Todo código vai em src/ — nunca na raiz."
    sprint: sprint-04-tdd
    executor: claude
    max_turns: 80
    outputs:
      - src/backend/
    validators:
      - command_succeeds: "cd src && python -m pytest tests/ -x -q"
      - pytest_red_quality:
          tests_dir: src/tests
          min_test_files: 1
          min_tests: 3
          min_assertions: 3
    next: ft.tdd.03.refactor

  - id: ft.tdd.03.refactor
    type: refactor
    title: "Refactor"
    description: "Refatorar o código para clareza, remover duplicações e garantir que os testes continuam passando. Não adicionar funcionalidades — apenas melhorar qualidade do código existente."
    sprint: sprint-04-tdd
    executor: claude
    write_scope:
      - src/backend
      - src/tests
    validators:
      - command_succeeds: "cd src && python -m pytest tests/ -x -q"
      - pytest_red_quality:
          tests_dir: src/tests
          min_test_files: 1
          min_tests: 3
          min_assertions: 3
    next: gate.tdd

  - id: gate.tdd
    type: gate
    title: "Gate TDD"
    description: "Verificação determinística: todos os testes passam."
    sprint: sprint-04-tdd
    executor: python
    validators:
      - command_succeeds: "cd src && python -m pytest tests/ -q"
      - pytest_red_quality:
          tests_dir: src/tests
          min_test_files: 1
          min_tests: 3
          min_assertions: 3
    next: ft.frontend.04.integrated_review

  - id: ft.frontend.04.integrated_review
    type: review
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    title: "Revisão Integrada da Superfície"
    description: "Após o TDD do backend, auditar de ponta a ponta a superfície contra PRD e critérios de UI usando API, persistência e dados reais do produto."
    sprint: sprint-04-tdd
    executor: claude
    max_turns: 60
    outputs:
      - docs/screenshots/surface-integrated/
      - docs/screenshot-review.md
      - docs/surface-integrated-review.yml
    write_scope:
      - docs/screenshots/surface-integrated
      - docs/screenshot-review.md
      - docs/surface-integrated-review.yml
    prompt: |
      Faça a revisão integrada independente do produto após o backend estar GREEN:
      Em reentrada após fix, preserve todo PASS já comprovado, audite primeiro
      somente os refs FAIL correntes e, quando eles passarem, retome os refs
      PENDING/NOT_RUN. Não repita jornadas já aprovadas.
      1. Inicie backend e superfície pelos entrypoints da stack e audite rotas,
         navegação, ações e fluxos P0 contra docs/PRD.md.
         Em Android, se a porta host contratual `8000` estiver ocupada por
         processo alheio, não encerre nem reinicie esse listener: inicie o
         backend numa porta host livre e use
         `adb -s <serial> reverse tcp:8000 tcp:<porta-livre>`. O app continua
         usando `127.0.0.1:8000`; registre e remova somente esse reverse criado
         pela própria delegação ao final.
      2. Percorra a interface pública até a API e a persistência reais e de volta
         à tela. Para todo dado visível, compare os campos ponta a ponta e registre
         a origem; mocks, fixtures, previews e servidores isolados não aprovam a
         fidelidade da integração.
      3. Execute a aplicação com o runner apropriado à plataforma selecionada
         (instrumentação Android, XCUITest, browser ou automação desktop) e
         capture evidências reais de cada tela e estado exigido.
      4. Verifique cada ID de docs/ui_criteria.md que pertence à integração,
         incluindo adaptação à tela, vazio/loading/erro, ações P0 e watermarks.
         Critérios cuja própria redação exige matriz, target físico, simulador,
         emulador ou validação multiplataforma pertencem exclusivamente a
         ft.platform.01.validate e não entram neste receipt. Use o aparelho em
         seu perfil padrão e não altere configurações do sistema.
      5. Compare cada tela/estado com o mockup aprovado correspondente em
         docs/mockups/screen-map.yml e registre divergências verificáveis.
      6. Grave cada execução em um subdiretório novo e imutável sob
         docs/screenshots/surface-integrated/; preserve todas as evidências anteriores.
      7. Escreva docs/screenshot-review.md com exatamente uma linha global
         `VERDICT: APPROVED` ou `VERDICT: REJECTED`, cobertura integrada
         rastreável e veredito final. Não reutilize o relatório VISUAL_ONLY.
      8. Escreva docs/surface-integrated-review.yml com o contrato:
           schema_version: 1
           scope_sha256: <sha256 dos bytes correntes de docs/ui_criteria.md>
           verdict: APPROVED | REJECTED
           evidence_grade: INTEGRATED_REAL_DATA
           results:
             - ref: <cada C-ID pertencente à integração exatamente uma vez>
               result: PASS | FAIL | PENDING | NOT_RUN
               evidence: [<prova repo-local da jornada integrada>]
           findings:
             - id: FI-001
               refs: [<critérios reprovados>]
               severity: P0 | P1 | P2
               summary: <defeito reproduzível>
               evidence: [<paths repo-local verificáveis>]
         Markdown e YAML devem ter o mesmo veredito. Findings devem cobrir
         exatamente os critérios FAIL observados. Após early-stop, critérios
         ainda não executados ficam PENDING/NOT_RUN e não originam finding
         (e impedem APPROVED_WITH_FINDINGS: conclua a auditoria antes).
         SEVERIDADE (obrigatória em cada finding): `severity: P0|P1|P2`.
           P0 — bloqueante: quebra funcional, rota/ação P0 inacessível, dado
                corrompido ou perdido, falha de segurança/autorização.
           P1 — defeito real sem bloqueio: degrada a experiência mas o produto
                cumpre a obrigação.
           P2 — cosmético ou melhoria pontual.
         Escolha o veredito pela severidade, não pela existência de achados:
           APPROVED — nenhum FAIL e findings vazio.
           APPROVED_WITH_FINDINGS — há FAIL, mas nenhum finding P0. O ciclo
             SEGUE em frente e os findings viram dívida no backlog.
           REJECTED — existe ao menos um finding P0. Só então o ciclo volta
             para correção.
         Não use REJECTED para achado P1/P2: cada volta desnecessária custa
         uma rodada inteira de correção e re-review.
      9. Audite primeiro o finding corrente e depois os critérios PENDING, um
         por vez. Interrompa a auditoria apenas ao observar um FAIL de
         severidade P0: escreva imediatamente os outputs canônicos, marque
         PENDING/NOT_RUN o que não executou e gere finding somente para o FAIL
         observado. FAIL P1/P2 não interrompe — registre e siga auditando até
         esgotar os critérios, para que o ciclo possa aprovar com findings.
      10. Depois de escrever o receipt, valide somente sua integridade YAML com
          `python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('docs/surface-integrated-review.yml').read_text())"`.
          Esse parse é obrigatório mesmo com FAIL; build e testes do produto
          permanecem exclusivamente no gate alcançado com 0 FAIL.
    validators:
      - file_exists: docs/screenshots/surface-integrated/
      - file_exists: docs/screenshot-review.md
      - file_exists: docs/surface-integrated-review.yml
      - review_outcome_valid:
          path: docs/surface-integrated-review.yml
          markdown_path: docs/screenshot-review.md
          scope_path: docs/ui_criteria.md
          scope_pattern: "\\bC\\d+\\b"
          scope_exclude_pattern: "matriz (?:aplicável|de validação)|target físico|simulador|emulador|receipt de plataforma|validação multiplataforma"
          require_approved: false
    on_fail:
      human_gate: "Revisão integrada encontrou não-conformidades. Corrija somente os findings antes de continuar."
      goto: ft.frontend.05.integrated_fix
    next: gate.frontend_integrated

  - id: ft.frontend.05.integrated_fix
    type: build
    no_pre_seed: true
    title: "Corrigir Findings da Integração"
    description: "Corrigir em lote somente os findings da revisão integrada, incluindo superfície, API e persistência, sem reabrir critérios já aprovados."
    fix_review: ft.frontend.04.integrated_review
    sprint: sprint-04-tdd
    executor: claude
    max_turns: 80
    outputs:
      - src/
      - src/Makefile
    write_scope:
      - src
      - src/Makefile
    prompt: |
      Leia docs/screenshot-review.md e docs/surface-integrated-review.yml.
      Corrija em lote somente os findings FI-* correntes e os testes diretamente
      relacionados. Preserve critérios e evidências já aprovados. Rode
      testes focais de frontend com `npx vitest run <arquivo>`; nunca use
      `npm test -- --run`, pois o script agregado dispara toda a bateria visual.
      Enquanto existir FAIL, não rode build nem suíte completa: encerre após o
      teste focal e retorne à revisão integrada. A regressão integral pertence
      exclusivamente ao gate alcançado com 0 FAIL.
    validators:
      - file_exists: src/frontend/
      - file_exists: src/backend/
      - file_exists: src/Makefile
    next: ft.frontend.04.integrated_review

  - id: gate.frontend_integrated
    type: gate
    title: "Gate Integrado da Superfície"
    description: "Verificação determinística pós-backend: build, testes e cobertura integral do screenshot review passam com evidência da integração real."
    sprint: sprint-04-tdd
    executor: python
    validators:
      - file_exists: docs/screenshots/surface-integrated/
      - file_exists: docs/screenshot-review.md
      - file_exists: docs/surface-integrated-review.yml
      - command_succeeds: "make -C src surface-build"
      - command_succeeds: "cd src && python -m pytest tests/ -q"
      - review_outcome_valid:
          path: docs/surface-integrated-review.yml
          markdown_path: docs/screenshot-review.md
          scope_path: docs/ui_criteria.md
          scope_pattern: "\\bC\\d+\\b"
          scope_exclude_pattern: "matriz (?:aplicável|de validação)|target físico|simulador|emulador|receipt de plataforma|validação multiplataforma"
          require_approved: true
          # Fix forward: findings P1/P2 aprovam e viram dívida no backlog;
          # P0 continua reprovando e devolvendo o ciclo à correção.
          allow_findings: true
      - ui_criteria_coverage:
          criteria_path: docs/ui_criteria.md
          report_path: docs/screenshot-review.md
          source_dir: src/frontend
          evidence: any
          exclude_pattern: "matriz (?:aplicável|de validação)|target físico|simulador|emulador|receipt de plataforma|validação multiplataforma"
    next: ft.delivery.01.entrypoint

  # ================================================================
  # Sprint 05 — Delivery
  # ================================================================

  - id: ft.delivery.01.entrypoint
    type: build
    title: "Preparar Delivery Completo"
    description: "Em um único turn, finalizar os entrypoints das plataformas selecionadas, self-review e comandos operacionais do produto."
    sprint: sprint-05-delivery
    executor: claude
    outputs:
      - src/backend/main.py
      - src/Makefile
      - .ft/process/scripts/serve.sh
    write_scope:
      - src
      - .ft/process/scripts/serve.sh
    prompt: |
      Prepare o produto para execução e entrega no mesmo turn:
      1. Garanta os entrypoints compatíveis com docs/TECH_STACK.md e com a
         matriz em `.ft/project.yml.validation`. Para web/API, use porta
         configurável, health check, CORS, inicialização do banco e
         X-Process-Time-Ms. Para desktop, gere o pacote instalável/portável
         exigido pelo target, sem substituir a aplicação nativa por uma URL.
      2. Faça self-review de segurança, performance, imports e código morto e
         aplique as correções encontradas.
      3. Complete src/Makefile com `surface-build`, `smoke`, `acceptance`, `e2e`,
         `run`, `dev`, `test` e `build`. O target `url` é obrigatório somente
         quando houver superfície web selecionada. Leia
         `.ft/project.yml.validation`: para cada target selecionado, implemente
         também o `make_target` anunciado por `ft validation-profiles`
         (`validate-android-emulator`, `validate-ios-physical`,
         `validate-web-desktop-browser`, `validate-desktop-linux` etc.). Cada
         target executa a superfície real e produz evidência; não transforme
         indisponibilidade externa em PASS.
      4. Crie .ft/process/scripts/serve.sh como apresentador da plataforma
         selecionada e mantenha somente processos iniciados por ele. Para web,
         abra/suba o produto e grave `.serve_url`. Para desktop Linux, exija
         exatamente um AppImage executável corrente em `src/dist`, abra o
         próprio AppImage e grave seu path relativo em `.presented_artifact`;
         remova `.serve_url` e nunca use o servidor web como fallback. Outros
         targets devem apresentar a aplicação instalada e uma evidência de
         entrada correspondente, sem inventar uma URL.
      5. Rode testes, build, bash -n e dry-runs do Makefile.
    validators:
      - file_exists: src/backend/main.py
      - file_exists: src/Makefile
      - file_exists: .ft/process/scripts/serve.sh
      - command_succeeds: "bash -n .ft/process/scripts/serve.sh"
      - command_succeeds: "cd src && make --dry-run dev >/dev/null"
      - command_succeeds: "cd src && make --dry-run surface-build smoke acceptance e2e run >/dev/null"
      - validation_profile_hooks:
          path: src/Makefile
    next: gate.delivery

  - id: gate.delivery
    type: gate
    title: "Gate Delivery"
    description: "Verificação determinística: Makefile existe e targets funcionam, entry point existe, testes passam."
    sprint: sprint-05-delivery
    executor: python
    validators:
      - file_exists: src/Makefile
      - file_exists: src/backend/main.py
      - file_exists: .ft/process/scripts/serve.sh
      - validation_profile_hooks:
          path: src/Makefile
      - command_succeeds: "bash -n .ft/process/scripts/serve.sh"
      - command_succeeds: "cd src && python -m pytest tests/ -q"
    next: ft.smoke.01.run

  # ================================================================
  # Sprint 06 — Smoke
  # ================================================================

  - id: ft.smoke.01.run
    no_pre_seed: true
    type: review
    title: "Smoke da Superfície Selecionada"
    description: "Executar o smoke real da plataforma selecionada pelo target comum `make -C src smoke`, sem substituir aplicação nativa por servidor web."
    sprint: sprint-06-smoke
    executor: claude
    outputs:
      - docs/smoke-report.md
    prompt: |
      Execute `make -C src smoke` contra a superfície real selecionada em
      `.ft/project.yml.validation` e documente em docs/smoke-report.md o runner,
      ambiente, entrypoint, verificações e resultado. Android usa build/launch e
      instrumentação apropriada; iOS usa build/launch e XCUITest; web pode usar
      porta isolada, health check e browser; desktop abre o executável nativo.
      Não use URL, HTML ou curl como substituto para uma plataforma nativa e não
      registre placeholder ou teste não executado como PASS. O relatório deve
      conter exatamente uma linha global `VERDICT: APPROVED` ou
      `VERDICT: REJECTED`; rejeição descreve um finding reproduzível.
    validators:
      - command_succeeds: "make -C src smoke"
      - file_exists: docs/smoke-report.md
      - command_succeeds: "python -c \"text=open('docs/smoke-report.md', encoding='utf-8').read().lower(); assert 'pass' in text and 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
    on_fail:
      human_gate: "O smoke real encontrou uma falha focal no entrypoint ou na superfície de execução."
      goto: ft.smoke.02.fix
    next: gate.smoke

  - id: ft.smoke.02.fix
    type: build
    no_pre_seed: true
    title: "Corrigir Somente o Finding do Smoke"
    description: "Corrigir a causa reproduzível do smoke sem reabrir delivery, build integral ou requisitos já aprovados."
    fix_review: ft.smoke.01.run
    sprint: sprint-06-smoke
    executor: claude
    outputs:
      - src/
    write_scope:
      - src
    prompt: |
      Leia docs/smoke-report.md e corrija somente a causa reproduzível mais
      recente no entrypoint ou na superfície selecionada. Preserve artefatos,
      testes e jornadas já aprovados. Execute apenas o teste focal necessário;
      a nova execução física e o relatório pertencem a ft.smoke.01.run.
      Não edite o relatório do smoke nem transforme indisponibilidade externa
      em PASS.
    validators:
      - file_exists: src/
    next: ft.smoke.01.run

  - id: gate.smoke
    type: gate
    title: "Gate Smoke"
    description: "Verificação determinística: o smoke da superfície selecionada passa e o relatório não mascara execução ausente."
    sprint: sprint-06-smoke
    executor: python
    validators:
      - file_exists: docs/smoke-report.md
      - command_succeeds: "make -C src smoke"
      - command_succeeds: "python -c \"text=open('docs/smoke-report.md', encoding='utf-8').read().lower(); assert 'pass' in text and 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
    next: ft.acceptance.01.cli

  # ================================================================
  # Sprint 07 — Acceptance
  # ================================================================

  - id: ft.acceptance.01.cli
    type: build
    title: "Acceptance Test do Produto"
    description: |
      Executar a massa de dados de docs/test_data.md pela interface pública real
      apropriada à stack: UI/instrumentação nativa, API/CLI ou browser. Cobrir
      cada cenário P0 do PRD e do backlog sem presumir CRUD, curl ou HTTP.
      Produzir DOIS artefatos:
        1. docs/acceptance-report.md — relatório legível para o stakeholder (Markdown com tabelas PASS/FAIL)
        2. docs/acceptance-result.json — resultado estruturado para o validator:
           {"pass": N, "fail": M, "skip": K, "p0_blockers": []}
      Cada incompatibilidade, cenário P0 não executado ou evidência principal
      mocked/fallback deve entrar em p0_blockers. A lista só pode ficar vazia
      quando o aceite P0 for executado de forma real e completa.
      Cenários fora do P0 podem ser registrados honestamente como SKIP, com
      motivo no Markdown; eles não autorizam omitir nenhum cenário P0.
      O validator lê o JSON. O relatório é para leitura humana.
    sprint: sprint-07-acceptance
    executor: claude
    max_turns: 60
    outputs:
      - docs/acceptance-report.md
      - docs/acceptance-result.json
    validators:
      - file_exists: docs/acceptance-result.json
      - command_succeeds: "make -C src acceptance"
      - command_succeeds: "python -c \"import json; d=json.load(open('docs/acceptance-result.json')); blockers=d.get('p0_blockers'); assert d.get('fail')==0 and isinstance(d.get('skip'),int) and d.get('skip')>=0 and d.get('pass',0)>0 and isinstance(blockers,list) and not blockers, d\""
      - command_succeeds: "python -c \"text=open('docs/acceptance-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
    next: gate.acceptance

  - id: gate.acceptance
    type: gate
    title: "Gate Acceptance"
    description: "Verificação determinística: relatório de aceitação existe, há cenários executados e não existem FAIL ou p0_blockers. SKIP é permitido somente fora do P0 e deve permanecer documentado; cenário P0 não executado entra em p0_blockers. Contagem agregada isolada não representa cobertura."
    sprint: sprint-07-acceptance
    executor: python
    validators:
      - file_exists: docs/acceptance-report.md
      - file_exists: docs/acceptance-result.json
      - command_succeeds: "make -C src acceptance"
      - command_succeeds: "python -c \"import json; d=json.load(open('docs/acceptance-result.json')); blockers=d.get('p0_blockers'); assert d.get('fail')==0 and isinstance(d.get('skip'),int) and d.get('skip')>=0 and d.get('pass',0)>0 and isinstance(blockers,list) and not blockers, d\""
      - command_succeeds: "python -c \"text=open('docs/acceptance-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
    next: ft.e2e.01.browser

  # ================================================================
  # Sprint 08 — E2E
  # ================================================================

  - id: ft.e2e.01.browser
    type: build
    title: "E2E da Superfície — Configurar, Executar e Evidenciar"
    description: "Em um único turn, configurar o runner da plataforma selecionada, executar fluxos P0 reais, capturar screenshots e produzir recibos rastreáveis. O id histórico do node é preservado apenas por compatibilidade."
    sprint: sprint-08-e2e
    executor: claude
    outputs:
      - src/tests/e2e/
      - docs/screenshots/e2e/
      - docs/e2e-report.md
      - docs/e2e-result.json
      - docs/test-identity.json
      - docs/navigation-reachability.yml
      - docs/evidence/navigation/
    max_turns: 60
    prompt: |
      Entregue toda a etapa E2E no mesmo turn:
      1. Leia `.ft/project.yml.validation` e docs/TECH_STACK.md. Configure o runner
         real da plataforma selecionada: instrumentação do app no Android,
         XCUITest no iOS, Playwright no web ou automação nativa no desktop. Não
         instale nem use Playwright quando a superfície não for web.
         No Android, use somente instrumentação do app, input por coordenadas
         e screenshots/OCR da plataforma.
      2. Provisione um usuário exclusivo do agente por seed idempotente,
         isolado e resetável. Leia credenciais de armazenamento protegido e
         gere docs/test-identity.json sanitizado, sem PII ou segredo.
      3. Implemente todos os fluxos P0 reais descritos no PRD, backlog e contrato
         de navegação, sem presumir CRUD ou controles HTML.
      4. Execute a suíte e corrija falhas de produto ou teste dentro do escopo.
      5. Capture screenshots reais suficientes para provar cada tela/estado
         exercitado em docs/screenshots/e2e/; não complete uma cota artificial.
      6. Gere docs/e2e-report.md com resultado por cenário e paths das evidências,
         e docs/e2e-result.json com `platform`, `runner`, `pass`, `fail`, `skip`,
         `p0_blockers` e `evidence`. APPROVED exige pass > 0, fail = 0,
         p0_blockers vazio e ao menos uma evidência repo-local existente.
      7. Para cada target de docs/navigation-contract.yml, parta da primeira
         abertura ou de uma superfície principal e use somente controles
         visíveis da UI de produção. Rota/URL interna direta, deep link/debug,
         catálogo técnico, montagem isolada de componente e hook test-only não
         contam. Para target entitled, prove a entrada com identidade elegível e
         a ausência/bloqueio com identidade comum.
      8. Gere docs/navigation-reachability.yml com `schema_version: 1`, hash do
         contrato corrente, `verdict`, `candidate_ref`,
         `observed_candidate_ref`, `environment`, `findings` e `journeys`. Cada
         jornada registra id, entry_type, start_surface, entry_point,
         `navigation_mode: production_ui`, passos visíveis, targets, PASS/FAIL,
         arquivo de evidência novo sob docs/evidence/navigation/, `shortcuts: []`
         e access_context. Entitled exige setup sanitizado e resultados positivo
         e negativo; contextual exige context_setup e entry_result.
      9. Exponha a execução repetível no target `make -C src e2e`.
      Não use placeholders nem declare cenário não executado como PASS.
    validators:
      - file_exists: src/tests/e2e/
      - file_exists: docs/e2e-report.md
      - file_exists: docs/e2e-result.json
      - file_exists: docs/navigation-reachability.yml
      - test_identity_ready:
          path: docs/test-identity.json
      - command_succeeds: "make -C src e2e"
      - command_succeeds: "python -c \"import json; from pathlib import Path; d=json.load(open('docs/e2e-result.json')); blockers=d.get('p0_blockers'); evidence=d.get('evidence'); assert isinstance(d.get('platform'),str) and d['platform'].strip() and isinstance(d.get('runner'),str) and d['runner'].strip() and d.get('pass',0)>0 and d.get('fail')==0 and isinstance(d.get('skip'),int) and d['skip']>=0 and isinstance(blockers,list) and not blockers and isinstance(evidence,list) and evidence and all((Path(p).is_file() and Path(p).stat().st_size>0) for p in evidence), d\""
      - command_succeeds: "python -c \"from pathlib import Path; shots=list(Path('docs/screenshots/e2e').rglob('*.png')); assert shots and all(p.stat().st_size > 1000 for p in shots)\""
      - command_succeeds: "python -c \"text=open('docs/e2e-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
      - navigation_reachability:
          contract_path: docs/navigation-contract.yml
          report_path: docs/navigation-reachability.yml
          evidence_root: docs/evidence/navigation
          scope_path: docs/PROJECT_BACKLOG.md
          scope_pattern: "\\bPB-\\d+\\b"
          min_targets: 1
          require_approved: true
    next: gate.e2e

  - id: gate.e2e
    type: gate
    title: "Gate E2E"
    description: "Verificação determinística: relatório E2E e evidências existem, a suíte passa e nenhum target do contrato fica órfão ou depende de atalho técnico."
    sprint: sprint-08-e2e
    executor: python
    validators:
      - file_exists: docs/e2e-report.md
      - file_exists: docs/e2e-result.json
      - file_exists: docs/navigation-reachability.yml
      - test_identity_ready:
          path: docs/test-identity.json
      - file_exists: docs/screenshots/e2e/
      - command_succeeds: "make -C src e2e"
      - command_succeeds: "python -c \"import json; from pathlib import Path; d=json.load(open('docs/e2e-result.json')); blockers=d.get('p0_blockers'); evidence=d.get('evidence'); assert isinstance(d.get('platform'),str) and d['platform'].strip() and isinstance(d.get('runner'),str) and d['runner'].strip() and d.get('pass',0)>0 and d.get('fail')==0 and isinstance(d.get('skip'),int) and d['skip']>=0 and isinstance(blockers,list) and not blockers and isinstance(evidence,list) and evidence and all((Path(p).is_file() and Path(p).stat().st_size>0) for p in evidence), d\""
      - command_succeeds: "python -c \"from pathlib import Path; shots=list(Path('docs/screenshots/e2e').rglob('*.png')); assert shots and all(p.stat().st_size > 1000 for p in shots)\""
      - command_succeeds: "python -c \"text=open('docs/e2e-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
      - navigation_reachability:
          contract_path: docs/navigation-contract.yml
          report_path: docs/navigation-reachability.yml
          evidence_root: docs/evidence/navigation
          scope_path: docs/PROJECT_BACKLOG.md
          scope_pattern: "\\bPB-\\d+\\b"
          min_targets: 1
          require_approved: true
    next: ft.platform.00.route

  - id: ft.platform.00.route
    type: decision
    title: "Resolver Perfis de Validação do Produto"
    description: "Ativar somente os perfis Android, iOS, web e desktop selecionados no contrato do projeto."
    sprint: sprint-08-platform-validation
    executor: python
    condition: validation_profiles_active
    branches:
      "true": ft.platform.01.validate
      "false": ft.final.01.visual_check

  - id: ft.platform.01.validate
    type: review
    title: "Executar Matriz Multiplataforma"
    description: "Validar cada target selecionado no ambiente real correspondente e agregar um receipt determinístico do candidato corrente."
    sprint: sprint-08-platform-validation
    executor: codex
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    max_turns: 120
    env_setup:
      - ft validation-matrix .
    outputs:
      - docs/validation-matrix.yml
      - docs/platform-validation-report.yml
      - docs/evidence/platform-validation/
      - docs/test-identity.json
    write_scope:
      - docs/validation-matrix.yml
      - docs/platform-validation-report.yml
      - docs/evidence/platform-validation
      - docs/test-identity.json
    prompt: |
      Execute exatamente os perfis, targets, make_target e checks materializados
      em docs/validation-matrix.yml. Não invente plataforma, não trate iPhone
      como perfil separado de iOS e não substitua dispositivo físico por
      simulador/emulador. Targets disjuntos podem ser executados em paralelo;
      serialize qualquer uso do mesmo dispositivo.

      Vincule todas as provas ao candidato integrado corrente. Para targets com
      instalação, compare SHA-256 do artefato local e observado. Ausência de
      ambiente obrigatório produz BLOCKED sem relatório falso. Target opcional
      indisponível pode ser SKIP com motivo; comportamento executado e incorreto
      é FAIL. Execute o make_target anunciado pela matrix e registre seus logs.

      Em Android físico, trate instaladores OEM interativos como gate humano e
      minimize-os por construção. Compile o candidato uma vez; mantenha um
      ledger sanitizado por package + SHA-256; instale app e APK instrumental
      somente quando ausentes ou quando o hash observado divergir. Se apenas um
      pacote divergir, instale somente ele; se app e instrumental divergirem
      juntos, use uma única sessão multipacote quando suportada para concentrar
      a confirmação OEM. Depois rode
      todos os focais contra os pacotes já instalados com `adb shell am instrument`
      (ou mecanismo equivalente comprovadamente sem reinstalação),
      agregando classes quando possível. Não repita tasks que reinstalam ou
      removem os pacotes entre subconjuntos. Um tap injetado não prova aceite:
      somente sucesso do instalador e hash observado comprovam instalação. Se o
      diálogo exigir pessoa, conclua antes todo trabalho independente, solicite
      uma única autorização no checkpoint físico final e aguarde; nunca use o
      aparelho físico interativo como loop de fix nem repita a solicitação.
      Nunca declare que a automação confirmou sem essa prova. Não use root,
      desbloqueio de bootloader
      nem enfraqueça a segurança do aparelho sem autorização explícita.
      O check `artifact_install_reuse` deve evidenciar hashes, quantidade de
      instalações reais e execuções reutilizadas, sem identificadores sensíveis.

      Aplique estes critérios comuns, derivados de incidentes reais de
      validação: use identidade técnica exclusiva e seed idempotente/resetável
      quando exigido; prove dados pela jornada fonte→persistência→UI; verifique
      estados vazios e ausência de seed residual; abra pela entrada normal e
      navegue por menus/controles visíveis; comprove CTAs, permissões refletidas
      na UI, back/retorno contextual, rotação/redimensionamento sem perder
      estado, insets/safe areas sem sobreposição e estética contra todas as
      referências declaradas. Use o aparelho em seu perfil padrão e não altere
      configurações do sistema. No Android, use somente instrumentação do app,
      input por coordenadas e screenshots/OCR da plataforma.
      Checks que exigem mudar orientação, fonte, densidade, display ou outro
      setting rodam somente em emulador/simulador; no target físico, use o
      estado corrente ou encaminhe um gate humano sem injetar a mudança.
      No target físico não execute `settings put/delete`, `wm size/density`,
      `pm clear`, desinstalação ou limpeza de dados; preserve o estado dedicado
      já provisionado. Em Android, derive coordenadas de `wm size`, use proporções,
      feche o IME com `KEYCODE_BACK`, espere diálogos visualmente e limite cada
      assert OCR à região/estado pertinente. Calibre o runner antes da jornada
      completa e retome do último checkpoint aprovado.
      Preview, rota direta, deep link
      de debug, montagem isolada ou mock não encerram um check de produto.

      No check `mockup_watermark`, inventarie todas as telas, páginas e janelas
      alcançáveis no target. Cada uma deve exibir, no próprio produto, marca
      d'água discreta, legível e não interativa com o identificador EXATO do
      mockup correspondente. Overlay da ferramenta de captura
      não conta. Tela sem mockup, inventário incompleto ou screenshot real
      exclusivo é FAIL e deve originar finding focal.

      Escreva evidências novas sob
      docs/evidence/platform-validation/<run-id>/<perfil>/<target>/, sem apagar
      histórico nem reutilizar uma prova entre targets. Se a matriz exigir
      test_identity, gere o recibo sanitizado esperado pela engine.

      Gere docs/platform-validation-report.yml no schema_version 1. Inclua
      matrix_sha256 dos bytes correntes, verdict APPROVED|REJECTED,
      candidate_ref, uma entrada para cada profile/target e findings. Cada
      target repete id/required da matriz; em execução contém result,
      observed_candidate_ref igual ao candidato, environment.kind,
      environment.execution_surface, os_name/os_version e device_ref opaco no
      físico. Quando installation_required, inclua installation.result=PASS,
      artifact_sha256 e observed_artifact_sha256 idênticos. Liste cada check na
      ordem exata da matriz com PASS|FAIL e ao menos uma evidência. SKIP só para
      target opcional, com reason e checks vazio. Cada check FAIL possui
      exatamente um finding `PV-F-NNN` com profile, target, check e summary.
      Para `mockup_watermark`, acrescente ao check `inventory_complete`,
      `discovered_screen_count`, `unmapped_screens` e `screens`; cada item de
      `screens` contém id, mockup_ref, watermark_text idêntico, result e
      screenshot real exclusivo. A evidence do check é exatamente a união
      desses screenshots.
      APPROVED exige todos os obrigatórios PASS, nenhum FAIL e findings vazio.
      Não registre serial/UDID, rede, IP, PII, credencial, token ou segredo.
    validators:
      - validation_matrix_valid:
          path: docs/validation-matrix.yml
      - platform_validation_report:
          matrix_path: docs/validation-matrix.yml
          report_path: docs/platform-validation-report.yml
          evidence_root: docs/evidence/platform-validation
          test_identity_path: docs/test-identity.json
          require_approved: true
      - command_succeeds: "git diff --check"
    on_fail:
      human_gate: "A matriz multiplataforma encontrou uma divergência focal."
      goto: ft.platform.02.fix
      automatic: true
    next: ft.final.01.visual_check

  - id: ft.platform.02.fix
    type: build
    title: "Corrigir Achados da Matriz Multiplataforma"
    description: "Corrigir somente os PV-F-* reproduzidos e retornar obrigatoriamente à mesma validação de plataforma."
    sprint: sprint-08-platform-validation
    executor: codex
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    max_turns: 80
    fix_review: ft.platform.01.validate
    outputs:
      - src/
      - docs/platform-fix-report.md
    write_scope:
      - src
      - docs/platform-fix-report.md
    prompt: |
      Leia somente os findings PV-F-* correntes de
      docs/platform-validation-report.yml. Corrija o menor delta de produto e
      testes diretamente relacionado; preserve targets já aprovados, contratos,
      mockups e evidências históricas. Rode apenas testes focais nesta etapa.
      Finding de `mockup_watermark` exige corrigir a UI de produção e seu mapa
      tela→mockup; editar somente receipt, screenshot ou overlay de teste não é
      correção.
      Registre docs/platform-fix-report.md com
      PV-F→causa→paths→fix→teste→resultado. Não altere a matriz nem rebaixe
      target obrigatório. A etapa seguinte repetirá a auditoria de plataforma
      no candidato corrigido antes de qualquer entrega ao stakeholder.
    validators:
      - file_exists: docs/platform-fix-report.md
      - command_succeeds: "git diff --check"
    next: ft.platform.01.validate

  # ================================================================
  # Sprint 09 — Final
  # ================================================================

  - id: ft.final.01.visual_check
    type: build
    title: "Verificação Visual Final"
    description: "Comparar screenshots E2E com os mockups aprovados e docs/ui_criteria.md, confrontar navegação e considerar o receipt multiplataforma corrente. Uma capacidade visualmente correta mas órfã na UI de produção reprova o P0_ACCEPTANCE."
    sprint: sprint-09-final
    executor: claude
    max_turns: 40
    outputs:
      - docs/visual-check-report.md
    prompt: |
      Compare as screenshots E2E reais da plataforma selecionada com todos os
      mockups aprovados e critérios de docs/ui_criteria.md. Verifique cada fluxo
      P0 e a navegação pela UI de produção, cite os paths exatos das evidências e
      produza exatamente um veredito `P0_ACCEPTANCE: PASS|FAIL`. Considere o
      receipt multiplataforma corrente quando existir. Não presuma browser,
      HTML, formulário ou operação CRUD; não aceite placeholder, preview,
      captura sintética ou cenário não executado como prova.
    validators:
      - file_exists: docs/visual-check-report.md
      - command_succeeds: "python -c \"from pathlib import Path; shots=list(Path('docs/screenshots/e2e').rglob('*.png')); assert shots and all(p.stat().st_size > 1000 for p in shots)\""
      - command_succeeds: "python -c \"text=open('docs/visual-check-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
      - visual_p0_acceptance:
          path: docs/visual-check-report.md
      - ui_criteria_coverage:
          criteria_path: docs/ui_criteria.md
          report_path: docs/visual-check-report.md
          source_dir: src/frontend
          evidence: any
      - platform_validation_ready:
          matrix_path: docs/validation-matrix.yml
          report_path: docs/platform-validation-report.yml
          evidence_root: docs/evidence/platform-validation
          test_identity_path: docs/test-identity.json
    next: gate.visual_check

  - id: gate.visual_check
    type: gate
    title: "Gate Visual Check"
    description: "Verificação determinística: relatório visual usa evidência E2E, contém um único P0_ACCEPTANCE: PASS e não registra critério reprovado. Conclusão da auditoria não equivale ao aceite."
    sprint: sprint-09-final
    executor: python
    validators:
      - file_exists: docs/visual-check-report.md
      - command_succeeds: "python -c \"from pathlib import Path; shots=list(Path('docs/screenshots/e2e').rglob('*.png')); assert shots and all(p.stat().st_size > 1000 for p in shots)\""
      - command_succeeds: "python -c \"text=open('docs/visual-check-report.md', encoding='utf-8').read().lower(); assert 'placeholder' not in text and 'não executad' not in text and 'nao executad' not in text\""
      - visual_p0_acceptance:
          path: docs/visual-check-report.md
      - ui_criteria_coverage:
          criteria_path: docs/ui_criteria.md
          report_path: docs/visual-check-report.md
          source_dir: src/frontend
          evidence: any
      - platform_validation_ready:
          matrix_path: docs/validation-matrix.yml
          report_path: docs/platform-validation-report.yml
          evidence_root: docs/evidence/platform-validation
          test_identity_path: docs/test-identity.json
    next: ft.final.02.stakeholder

  - id: ft.final.02.stakeholder
    type: human_gate
    title: "Validação do Stakeholder"
    description: "Abra o produto pela entrada normal na plataforma selecionada, navegue por menus e controles visíveis até todas as capacidades P0 e verifique PRD e receipt multiplataforma. Não use rotas internas diretas como prova. Rejeite capacidade órfã, target obrigatório ausente, bug ou desvio funcional/visual."
    sprint: sprint-09-final
    executor: python
    decision_context:
      decision: >-
        Decidir se o candidato P0 validado pode avançar para consolidação e
        handoff, sem ampliar o escopo desta entrega.
      why_now: >-
        Implementação, regressão integrada, auditoria visual e validação dos
        targets obrigatórios terminaram. A decisão humana confirma a experiência
        observável antes de os catálogos e o handoff serem consolidados.
      review_paths:
        - docs/PRD.md
        - docs/ui_criteria.md
        - docs/acceptance-report.md
        - docs/visual-check-report.md
        - docs/platform-validation-report.yml
      checklist:
        - Abra o produto pela entrada apresentada para cada target selecionado — URL somente para web, AppImage/aplicativo nativo para desktop ou app instalado no dispositivo — e complete o fluxo P0 usando apenas menus e controles visíveis.
        - Compare o comportamento e a aparência observados com PRD, critérios visuais, mockups e relatório de aceite.
        - Confirme que cada target obrigatório está em PASS, sem finding aberto, e que nenhuma capacidade P0 está órfã.
        - Rejeite qualquer bug reproduzível, desvio funcional/visual, evidência inacessível ou limitação relevante não declarada.
      limitations:
        - A aprovação cobre somente o candidato, o escopo P0 e os targets apresentados neste gate.
        - A aprovação não autoriza expansão comercial, novos targets ou capacidades fora do PRD.
      approve_effect: >-
        Registra o aceite do candidato e avança para a consolidação da retro,
        backlog, catálogo de features e handoff.
      reject_effect: >-
        Registra o defeito reproduzível, retorna somente à correção stakeholder
        e exige nova apresentação deste gate após a correção.
    env_setup:
      - bash .ft/process/scripts/serve.sh
    outputs:
      - docs/stakeholder-feedback.md
    reject_next: ft.final.03.stakeholder_fix
    next: ft.handoff.01.retro

  - id: ft.final.03.stakeholder_fix
    no_pre_seed: true
    type: build
    title: "Correção Stakeholder"
    description: "Aplicar as correções solicitadas pelo stakeholder na validação. Focar nos problemas reportados sem expandir escopo."
    sprint: sprint-09-final
    executor: claude
    max_turns: 60
    outputs:
      - src/
      - docs/stakeholder-fix-report.md
    write_scope:
      - src
      - docs/stakeholder-fix-report.md
    prompt: |
      Aplique somente as correções pedidas em docs/stakeholder-feedback.md.
      Não expanda escopo, não refatore o que não foi apontado e não reabra
      requisitos já aceitos.

      Registre docs/stakeholder-fix-report.md com uma linha por pedido:
      pedido→causa→paths alterados→teste que comprova→resultado. Liste
      explicitamente todos os paths que você tocou; a rota de revalidação do
      ciclo depende dessa lista ser fiel.

      Rode os testes focais dos arquivos alterados antes de encerrar. Encerre
      DONE.
    validators:
      - file_exists: docs/stakeholder-fix-report.md
      - command_succeeds: "git diff --check"
    fix_review: gate.stakeholder_fix
    next: gate.stakeholder_fix

  - id: gate.stakeholder_fix
    no_pre_seed: true
    type: gate
    title: "Reprovar o Fix do Stakeholder (focal)"
    description: "Reexecuta as provas determinísticas afetadas por uma correção de aceite — build, suíte e smoke — em vez de rebobinar a cadeia inteira de validação."
    sprint: sprint-09-final
    executor: python
    validation_mode: fail_fast
    validators:
      - file_exists: docs/stakeholder-fix-report.md
      - command_succeeds: "make -C src surface-build"
      - command_succeeds: "cd src && python -m pytest tests/ -q"
      - command_succeeds: "make -C src smoke"
    on_fail:
      human_gate: "A correção do stakeholder quebrou build, suíte ou smoke."
      goto: ft.final.03.stakeholder_fix
      automatic: true
    next: ft.final.03b.revalidation_route

  - id: ft.final.03b.revalidation_route
    type: decision
    title: "Escolher o Alcance da Revalidação"
    description: "Uma correção de aceite invalida o receipt multiplataforma somente quando há perfis de plataforma ativos; sem eles, a revalidação focal basta e a matriz cara não é reexecutada."
    sprint: sprint-09-final
    executor: python
    condition: validation_profiles_active
    branches:
      "true": ft.platform.01.validate
      "false": ft.final.01.visual_check

  # ================================================================
  # Sprint 10 — Handoff
  # ================================================================

  - id: ft.handoff.01.retro
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: retro
    title: "Consolidar Retro e Catálogos"
    description: "Em um único turn, registrar a retro e reconciliar PROJECT_BACKLOG e FEATURES com as evidências do ciclo."
    sprint: sprint-10-handoff
    executor: claude
    outputs:
      - docs/retro.md
      - docs/PROJECT_BACKLOG.md
      - docs/backlog-progress.md
      - docs/FEATURES.md
    prompt: |
      Consolide os artefatos centrais de handoff no mesmo turn:
      1. Gere docs/retro.md a partir do log, distinguindo ROUTED, PASS, BLOCKED,
         REJECTED e BYPASSED.
      2. Atualize docs/PROJECT_BACKLOG.md sem renumerar PB-*. Itens entregues
         recebem done e evidência; P0/P1 não entregues recebem deferred/blocked
         e decisão explícita.
      3. Gere docs/backlog-progress.md com progresso, entregas, pendências P0/P1
         e próximo ciclo.
      4. Reconcilie docs/FEATURES.md: somente PB-* done/accepted criam ou
         evoluem FEAT-*; preserve IDs e histórico deprecatado/removido.
      5. Bypass de human gate não conta como aprovação ou evidência.
      6. Dívida do fix forward: para cada review com
         `verdict: APPROVED_WITH_FINDINGS` (docs/surface-visual-review.yml e
         docs/surface-integrated-review.yml), abra um PB-* novo por finding
         aceito, citando o id do finding (ex.: FI-003) no título ou nas notas,
         com prioridade derivada da severidade (P1 → P1, P2 → P2) e status
         deferred. Foi assim que o ciclo pôde seguir sem corrigir: o débito é
         registrado, não esquecido.
      Verifique a consistência entre os documentos antes de encerrar.
    validators:
      - file_exists: docs/retro.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - backlog_pending_decisions:
          path: docs/PROJECT_BACKLOG.md
      - file_exists: docs/backlog-progress.md
      - file_exists: docs/FEATURES.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
    next: ft.handoff.02.backlog_update

  - id: ft.handoff.02.backlog_update
    no_pre_seed: true   # artefato por ciclo — nunca herdar progresso antigo
    type: gate
    title: "Validar Atualização do Project Backlog"
    description: "Checkpoint Python da atualização consolidada de backlog e progresso."
    sprint: sprint-10-handoff
    executor: python
    outputs:
      - docs/PROJECT_BACKLOG.md
      - docs/backlog-progress.md
    prompt: |
      Atualize o backlog canônico do produto.

      Fontes obrigatórias:
      - docs/PROJECT_BACKLOG.md
      - docs/task_list.md
      - docs/acceptance-report.md
      - docs/retro.md
      - docs/headless-review.md quando existir
      - docs/headless-build-report.md quando existir
      - docs/e2e-report.md quando houver superfície visual
      - docs/visual-check-report.md quando houver superfície visual
      - docs/critical-analysis.md se existir

      Regras:
      1. Preserve IDs PB-* existentes. Nunca renumere.
      2. Itens executados neste ciclo devem receber Status=done e Evidência apontando para relatório/teste/screenshot.
      3. Itens P0/P1 não entregues não podem ficar planned/ready/in_progress no fim do ciclo. Use deferred ou blocked com Decisão/Notas explícita.
      4. Pendências novas descobertas no ciclo devem virar novos PB-* com origem handoff/retro/critical-analysis.
      5. BYPASSED em human gate não é aprovação nem evidência suficiente para Status=done.
      6. Gere docs/backlog-progress.md com:
         - ## Progresso do Backlog
         - ## Entregue neste ciclo
         - ## Pendências P0/P1
         - ## Pendências P2
         - ## Próximo Ciclo
    validators:
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - backlog_pending_decisions:
          path: docs/PROJECT_BACKLOG.md
      # Contrapartida do fix forward: todo finding aceito como dívida
      # (APPROVED_WITH_FINDINGS) precisa existir no backlog do produto.
      - review_findings_tracked:
          review_paths:
            - docs/surface-visual-review.yml
            - docs/surface-integrated-review.yml
          backlog_path: docs/PROJECT_BACKLOG.md
      - file_exists: docs/backlog-progress.md
      - has_sections:
          path: docs/backlog-progress.md
          sections:
            - Progresso do Backlog
            - Entregue neste ciclo
            - Pendências P0/P1
            - Próximo Ciclo
    next: ft.handoff.02b.features_update

  - id: ft.handoff.02b.features_update
    no_pre_seed: true   # sempre reconciliar evoluções/bugs; FEATURES é canônico e não é apagado
    type: gate
    title: "Validar Catálogo de Features"
    description: "Checkpoint Python da reconciliação consolidada do catálogo."
    sprint: sprint-10-handoff
    executor: python
    outputs:
      - docs/FEATURES.md
    prompt: |
      Atualize docs/FEATURES.md com o resultado validado deste ciclo.

      Fontes obrigatórias:
      - docs/FEATURES.md, quando existir
      - docs/PROJECT_BACKLOG.md já atualizado
      - docs/task_list.md
      - docs/acceptance-report.md
      - docs/headless-review.md quando existir
      - docs/e2e-report.md quando houver superfície visual
      - docs/visual-check-report.md quando houver superfície visual
      - docs/stakeholder-feedback.md, quando existir
      - docs/retro.md

      Regras:
      1. Somente PB-* com Status=done ou Status=accepted pode aparecer no catálogo.
         Nunca promova planned, ready, in_progress, deferred, blocked ou rejected.
         Apenas tipos US, feature, recurso ou story criam uma capacidade nova.
      2. Para uma capacidade nova entregue, crie o próximo ID FEAT-NNN e registre
         título, descrição, primeiro ciclo e evidência verificável.
      3. Se um PB-* evolui uma capacidade existente, preserve a FEAT-*, acrescente o
         PB-* à coluna Backlog, atualize Evidência e registre o ciclo em Última evolução.
      4. Bugs, dívidas e manutenções não criam outra FEAT-*. Quando afetarem uma
         feature existente, anexe seu PB-* e a evidência à mesma capacidade.
      5. Status permitido: active, deprecated ou removed. Só marque deprecated ou
         removed quando um PB-* concluído e sua decisão/evidência sustentarem a mudança.
      6. Nunca apague ou renumere linhas. Features removed permanecem como histórico.
      7. BYPASSED em human gate não é evidência suficiente por si só.
      8. Se nenhum item foi entregue, preserve o catálogo sem inventar features.

      Formato obrigatório, sem adicionar/remover/reordenar colunas:

      # FEATURES

      ## Catálogo de Features

      | ID | Status | Backlog | Título | Descrição | Entregue em | Evidência | Última evolução | Notas |
      |---|---|---|---|---|---|---|---|---|
    validators:
      - file_exists: docs/FEATURES.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
    next: ft.handoff.02.prd_rewrite

  - id: ft.handoff.02.prd_rewrite
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: document
    parallel_group: handoff-analysis   # com ft run --parallel: roda junto de handoff.03
    title: "Propor Ajustes ao PRD"
    description: "Gerar docs/PRD.next.md somente com propostas funcionais e técnicas para o software, a partir do backlog, decisões e aprendizados do ciclo. Não usar este documento como backlog paralelo nem propor execução de jurídico, marketing, vendas, pesquisa de mercado ou operação comercial."
    sprint: sprint-10-handoff
    executor: claude
    outputs:
      - docs/PRD.next.md
    prompt: |
      Proponha somente evolução do produto e da engenharia de software:
      comportamento, UX, requisitos funcionais e não funcionais, arquitetura,
      código, dados, APIs, integrações, segurança técnica, testes, desempenho,
      confiabilidade, empacotamento, instalação e manutenção.

      Não crie requisitos, gates ou bloqueios de jurídico, marketing, site
      promocional, recrutamento, pesquisa de mercado, vendas, receita,
      renovação ou validação comercial. Esses assuntos permanecem pendentes
      para uma equipe posterior e não fazem parte deste ciclo de build.
    validators:
      - file_exists: docs/PRD.next.md
    next: ft.handoff.03.critical_analysis

  - id: ft.handoff.03.critical_analysis
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: document
    parallel_group: handoff-analysis
    title: "Análise Crítica — Sugestões do LLM"
    description: "Produzir uma análise crítica estritamente de produto e engenharia: funcionalidades, UX, arquitetura, implementação, segurança técnica, testes, desempenho, confiabilidade, distribuição e manutenção. Não criar tarefas ou bloqueios de jurídico, marketing, vendas, pesquisa de mercado, recrutamento ou operação comercial."
    sprint: sprint-10-handoff
    executor: claude
    prompt: |
      Analise somente o software e a experiência do produto entregue.
      Inclua funcionalidades completas ou parciais, defeitos, riscos técnicos,
      arquitetura, segurança implementável em código/infraestrutura, testes,
      desempenho, confiabilidade, empacotamento, distribuição técnica e
      manutenção.

      Não inclua parecer jurídico, contratos, licenças como decisão legal,
      marketing, site promocional, landing page, recrutamento, pesquisa de
      mercado, vendas, metas de conversão, receita, renovação ou validação da
      tese de negócio. Essas responsabilidades pertencem a outra equipe depois
      da entrega do software. Uma integração de cobrança pode aparecer apenas
      pelo seu estado de implementação técnica, nunca como meta comercial.
    outputs:
      - docs/critical-analysis.md
    validators:
      - file_exists: docs/critical-analysis.md
    next: ft.handoff.04.plano_voo

  - id: ft.handoff.04.plano_voo
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: document
    title: "Gerar Plano de Voo — Próximo Ciclo"
    description: "Produzir um handoff humano que um stakeholder não técnico consiga decidir em poucos minutos e um plano de voo operacional para o próximo ciclo. Explicar em linguagem comum o que está pronto, o que não está, as opções e as consequências de fazer, adiar ou não fazer. Detalhes técnicos ficam somente em anexo."
    sprint: sprint-10-handoff
    executor: claude
    prompt: |
      Gere docs/handoff.md e docs/plano_de_voo.md para dois leitores distintos,
      preservando os fatos de PROJECT_BACKLOG, FEATURES e das evidências.

      docs/handoff.md é o documento PRINCIPAL DE DECISÃO para uma pessoa que não
      conhece os códigos, o processo nem a arquitetura do projeto. Ele deve:
      1. abrir com "Decisão solicitada" e dizer em uma frase o que a pessoa está
         decidindo agora;
      2. trazer um "Resumo em linguagem simples" que possa ser entendido sem
         abrir outro arquivo;
      3. separar claramente o que está pronto do que ainda não está pronto;
      4. incluir "Opções e consequências" com, para cada opção real, o que
         acontece, benefício, risco/custo, consequência de fazer e consequência
         de não fazer ou adiar;
      5. explicar separadamente "O que a aprovação autoriza" e "O que a
         aprovação não autoriza";
      6. apresentar o próximo ciclo como resultados funcionais e redução de
         risco, não como lista de tecnologias;
      7. distinguir fatos comprovados, recomendação e pontos ainda desconhecidos;
      8. manter "Mudanças em Features", traduzindo IDs e status para nomes e
         consequências compreensíveis;
      9. mover hashes, commits, paths, nomes internos de gates, siglas de
         prioridade e stack para um "Anexo técnico" no fim. No corpo executivo,
         não usar PB-*, FEAT-*, P0/P1/P2, D0, SC-*, H-* ou nomes de receipts sem
         explicar imediatamente em português comum;
      10. não pressupor que a aprovação do handoff transforma capacidade parcial
          em pronta, autoriza expor uma superfície sem suporte técnico, aceita
          outro binário ou muda o escopo. Diga expressamente o alcance da decisão
          corrente somente em termos de produto e engenharia.

      ESCOPO OBRIGATÓRIO DESTE HANDOFF: produto e engenharia de software.
      Para cada capacidade, diga se está pronta, parcial ou não implementada,
      qual lacuna técnica permanece e qual é o impacto concreto para a pessoa
      usuária ou para quem consome a API. Pode tratar de UX, código, arquitetura,
      persistência, APIs, integrações, segurança técnica, testes, desempenho,
      confiabilidade, empacotamento, instalação e manutenção.

      Não transforme em tarefa, risco, bloqueio, alternativa ou próximo passo da
      engenharia nenhum assunto de jurídico, contratos, aprovação de licença,
      marketing, site promocional, landing page, recrutamento, pesquisa de
      mercado, coorte, vendas, metas de conversão, receita, renovação ou
      validação comercial. Preserve esses assuntos como pendentes para a equipe
      posterior; não os apague, não os declare resolvidos e não os use para
      impedir a conclusão da engenharia. No handoff, demarque essa fronteira com
      uma única frase em "Fora do escopo desta equipe", sem reproduzir planos ou
      listas de pendências externas.

      Diferencie funcionalidade de cobrança de resultado comercial: estado da
      integração, sandbox, webhooks e tratamento de falhas são engenharia;
      quantidade de compradores, receita e renovação são negócio e não entram.
      Da mesma forma, armazenamento, busca, isolamento, backup e exclusão são
      software; consentimento jurídico, recrutamento e pesquisa não entram.

      As opções do handoff devem ser decisões de produto/engenharia, por exemplo:
      aceitar o escopo de software entregue, continuar implementando capacidades
      parciais ou remover/desabilitar superfícies ainda não suportadas. Para cada
      opção, explique consequência funcional, técnica e de manutenção.

      docs/plano_de_voo.md é o documento de execução do próximo time. Também deve
      começar com "Objetivo em linguagem simples" e conter "Decisões e
      consequências" antes dos detalhes operacionais. Pode usar IDs rastreáveis,
      mas sempre acompanhados do nome e do efeito prático.

      Evite linguagem burocrática, frases passivas e tabelas que obriguem o
      leitor a decodificar siglas. Não invente prazo, orçamento, autorização ou
      conclusão sem evidência. Se houver incerteza, escreva "ainda não sabemos"
      e explique como ela muda a decisão.
    outputs:
      - docs/plano_de_voo.md
      - docs/handoff.md
    validators:
      - file_exists: docs/plano_de_voo.md
      - file_exists: docs/handoff.md
      - file_exists: docs/backlog-progress.md
      - has_sections:
          path: docs/plano_de_voo.md
          sections:
            - Objetivo em linguagem simples
            - Decisões e consequências
            - O que foi entregue
            - Mudanças em Features
            - O que ficou pendente
            - Dívidas Técnicas
            - Próximo Ciclo
      - has_sections:
          path: docs/handoff.md
          sections:
            - Decisão solicitada
            - Resumo em linguagem simples
            - Escopo deste handoff de engenharia
            - O que foi entregue
            - Mudanças em Features
            - O que ficou pendente
            - Funcionalidades incompletas e impacto
            - Opções e consequências
            - O que a aprovação autoriza
            - O que a aprovação não autoriza
            - Fora do escopo desta equipe
            - Próximo Ciclo
            - Anexo técnico
      - backlog_pending_decisions:
          path: docs/PROJECT_BACKLOG.md
      - features_catalog_valid:
          path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
      - implemented_backlog_covered_by_features:
          features_path: docs/FEATURES.md
          backlog_path: docs/PROJECT_BACKLOG.md
    next: ft.operational.01.audit

  - id: ft.operational.01.audit
    type: review
    no_pre_seed: true
    preserve_outputs_on_reentry: true
    title: "Auditoria Operacional Final"
    description: "Provar em ambiente de produção local limpo que todo P0/P1 funciona pela superfície pública, com persistência real, sem seed demonstrativo, dados sintéticos, mocks, fixtures, previews ou estados visuais materializados no runtime."
    sprint: sprint-10-handoff
    executor: claude
    max_turns: 60
    outputs:
      - docs/operational-readiness.md
      - docs/operational-readiness.yml
      - docs/evidence/operational/
      - .ft/project.yml
    write_scope:
      - docs/operational-readiness.md
      - docs/operational-readiness.yml
      - docs/evidence/operational
      - .ft/project.yml
    prompt: |
      Faça uma auditoria nova e independente do candidato que seria apresentado
      para fechamento do projeto. Esta etapa não corrige produto e não aceita
      evidência herdada como prova suficiente.

      1. Inicie pelo entrypoint de produção definido em docs/TECH_STACK.md, com
         armazenamento limpo e sem modo demo/test/preview. Não use servidor de
         componente, rota debug, deep link, fixture, mock provider, fallback ou
         banco pré-preenchido como superfície operacional.
      2. Confirme que a primeira abertura contém somente estado operacional
         legítimo. Seed é permitido apenas para identidade técnica isolada; ele
         nunca pode pré-criar Projects, Processes, Cycles ou dados de negócio
         usados para aprovar requisito.
      3. Para cada PB P0/P1, crie um canário único pela interface pública normal,
         confirme a gravação no backend persistente, reinicie de fato o produto,
         leia novamente pela interface pública e observe o mesmo valor na
         superfície final. Compare created_value, persisted_value e
         observed_value literalmente.
      4. Em produto com UI, navegue somente por controles visíveis, em zoom 100%,
         e meça o menor texto funcional. Menos de 12 px reprova legibilidade.
         Confirme também que Project/tenant/workspace da rota, seletor e dados
         relacionados são o mesmo em todas as telas.
      5. Audite os paths de produção declarados no relatório. Código de produção
         não pode carregar default seed sintético, materializador de visual-state
         nem mock/fake/demo data. Test fixtures devem permanecer fora desses paths.
      6. Grave evidência nova sob docs/evidence/operational/. Screenshot isolado,
         teste unitário ou relatório anterior não substitui a jornada completa.
      7. Atualize .ft/project.yml de forma idempotente para que
         definition_of_done.required_gates contenha exatamente uma entrada:
           id: operational-real-data
           path: docs/operational-readiness.yml
           field: verdict
           equals: APPROVED
      8. Gere docs/operational-readiness.md legível e o YAML abaixo. APPROVED
         exige todos os resultados e jornadas PASS, findings vazio e nenhuma
         dependência proibida encontrada. Caso contrário use REJECTED e registre
         findings acionáveis; nunca maquie o receipt para passar o validator.

      schema_version: 1
      verdict: APPROVED | REJECTED
      evidence_grade: OPERATIONAL_REAL_DATA
      candidate_ref: <hash/revisão imutável>
      production_entrypoint: <comando/artefato real>
      scope_path: docs/PROJECT_BACKLOG.md
      runtime:
        mode: production
        clean_start: true | false
        restart_verified: true | false
        demo_seed_enabled: false | true
        synthetic_runtime_records: false | true
        mock_providers_enabled: false | true
        persistence: durable | ephemeral
      ui:
        applicable: true | false
        minimum_observed_font_px: <número; ao menos 12 quando aplicável>
        zoom_percent: 100
        evidence: [<paths repo-local>]
      scan:
        production_paths: [<paths de código realmente empacotado>]
        prohibited_hits: []
      results:
        - ref: PB-001
          result: PASS | FAIL | NOT_RUN
          journeys: [OP-001]
          evidence: [<paths repo-local>]
      journeys:
        - id: OP-001
          refs: [PB-001]
          result: PASS | FAIL
          navigation_mode: production_ui | public_api | public_cli | native_ui
          data_origin: created_via_public_interface
          canary:
            created_value: <valor único>
            persisted_value: <mesmo valor>
            observed_value: <mesmo valor>
          persistence_restart_verified: true | false
          evidence: [<paths repo-local>]
      findings:
        - id: OPF-001
          refs: [PB-001]
          summary: <falha reproduzível>
          evidence: [<paths repo-local>]
    validators:
      - file_exists: docs/operational-readiness.md
      - file_exists: docs/operational-readiness.yml
      - file_exists: docs/evidence/operational/
      - command_succeeds: "python3 .ft/process/mvp-builder-fast/scripts/validate_operational_readiness.py docs/operational-readiness.yml .ft/project.yml"
    on_fail:
      human_gate: "O candidato não está operacional. Use fix focal somente nos findings OPF-*; mocks, seeds demonstrativos e dados sintéticos não podem ser aceitos ou adiados para depois do project-close."
      goto: ft.operational.02.fix
    next: gate.operational_readiness

  - id: ft.operational.02.fix
    type: build
    no_pre_seed: true
    title: "Correção Focal da Prontidão Operacional"
    description: "Corrigir somente os findings OPF-* da auditoria operacional, preservando capacidades já comprovadas."
    fix_review: ft.operational.01.audit
    sprint: sprint-10-handoff
    executor: claude
    max_turns: 80
    outputs:
      - src/
    write_scope:
      - src
    prompt: |
      Leia docs/operational-readiness.md e docs/operational-readiness.yml.
      Corrija somente os findings OPF-* correntes no produto de produção.
      Remova seeds demonstrativos, visual states, mocks, fixtures e fallback de
      dados do runtime; preserve fixtures exclusivamente em testes. Corrija
      mistura de Project/tenant/workspace e texto funcional abaixo de 12 px
      quando encontrados. Rode apenas testes focais do fix. Não edite o receipt
      da auditoria nem declare PASS; a nova prova pertence ao review focal.
    validators:
      - file_exists: src/
    next: ft.operational.01.audit

  - id: gate.operational_readiness
    type: gate
    title: "Gate de Prontidão Operacional"
    description: "Bloqueia handoff e project-close enquanto qualquer P0/P1 depender de seed demonstrativo, dado sintético, mock, fixture, preview, visual-state, persistência efêmera, atalho técnico ou texto funcional ilegível."
    sprint: sprint-10-handoff
    executor: python
    validators:
      - file_exists: docs/operational-readiness.md
      - file_exists: docs/operational-readiness.yml
      - file_exists: docs/evidence/operational/
      - command_succeeds: "python3 .ft/process/mvp-builder-fast/scripts/validate_operational_readiness.py docs/operational-readiness.yml .ft/project.yml"
    next: ft.operational.03.route

  - id: ft.operational.03.route
    type: decision
    title: "Retornar à rota solicitada"
    description: "Após a mesma prova operacional, a rota validation encerra sua continuação terminal; a rota construtora completa apresenta o handoff."
    sprint: sprint-10-handoff
    executor: python
    condition: run_route
    branches:
      validation: ft.end
      _default: ft.handoff.gate

  - id: ft.handoff.gate
    type: human_gate
    title: "Revisão do Handoff"
    description: "Leia primeiro docs/handoff.md como documento humano de engenharia. Aprove somente se ele tratar de software e produto, mostrar o que está pronto, parcial ou ausente e explicar impactos e alternativas técnicas sem atribuir ao time responsabilidades de jurídico, marketing, pesquisa, vendas ou operação comercial."
    sprint: sprint-10-handoff
    executor: python
    decision_context:
      decision: >-
        Decidir se o handoff representa fielmente o software entregue e oferece
        contexto suficiente para aceitar a entrega técnica ou pedir ajustes.
      why_now: >-
        O candidato já passou pelas validações técnicas e pelo aceite funcional;
        este gate confirma que uma pessoa consegue entender alcance, lacunas,
        alternativas e consequências antes do encerramento do ciclo.
      review_paths:
        - docs/handoff.md
        - docs/plano_de_voo.md
        - docs/FEATURES.md
        - docs/operational-readiness.md
        - docs/operational-readiness.yml
      checklist:
        - Leia apenas o corpo principal de docs/handoff.md e confirme que a decisão solicitada pode ser explicada em uma frase, sem conhecer códigos internos do projeto.
        - Confirme que o documento se limita a produto e engenharia de software; jurídico, marketing, site promocional, recrutamento, pesquisa de mercado, vendas e métricas comerciais não podem aparecer como tarefas ou bloqueios desta equipe.
        - Confirme que cada capacidade relevante está classificada como pronta, parcial ou não implementada, com a lacuna técnica e o impacto concreto para o usuário ou consumidor da API.
        - Confirme que cada alternativa informa benefício, risco ou custo e as consequências de fazer, não fazer ou adiar.
        - Confirme que fatos comprovados, recomendações e pontos ainda desconhecidos estão separados e não são apresentados como equivalentes.
        - Confirme que o documento diz claramente o que esta aprovação autoriza e o que ela não autoriza.
        - Confirme que a prontidão operacional está APPROVED com dados criados pela superfície pública, persistência após restart, zero mock/fixture/seed demonstrativo no runtime e texto funcional legível.
        - Consulte docs/plano_de_voo.md e docs/FEATURES.md somente para verificar se o resumo humano não omitiu ou distorceu entregas e pendências.
      limitations:
        - A aprovação cobre somente a clareza e a fidelidade do handoff técnico deste candidato.
        - A aprovação não declara prontas capacidades parciais, não amplia escopo e não transfere responsabilidades da equipe posterior para a engenharia.
      approve_effect: >-
        Registra que o handoff técnico está compreensível e fiel e avança para a
        meta-melhoria do processo.
      reject_effect: >-
        Retorna à redação do plano de voo e do handoff para corrigir contexto,
        escopo, alternativas ou consequências; exige nova apresentação do gate.
    outputs:
      - docs/handoff.md
      - docs/plano_de_voo.md
      - docs/FEATURES.md
    reject_next: ft.handoff.04.plano_voo
    next: ft.handoff.05.process_evolve

  # ================================================================
  # Exploração Livre (opcional)
  # ================================================================

  - id: ft.handoff.05.process_evolve
    no_pre_seed: true   # artefato por ciclo — nunca herdar do ciclo anterior
    type: document
    title: "Meta-Melhoria do Processo"
    description: "Analisar o ciclo pelo lado do PROCESSO, não do produto. Aplicar correções cirúrgicas somente ao fork local e classificar cada achado como local, global_candidate ou rejected. Um candidato global precisa ser independente de domínio, não conter identificadores do produto, ser configurável, ter sido verificado no ciclo e ser retrocompatível. O ciclo nunca edita o engine ou o template global diretamente."
    sprint: sprint-10-handoff
    executor: claude
    outputs:
      - docs/process-improvements.md
      - docs/process-improvements.yml
      - .ft/process/process.yml
    write_scope:
      - docs/process-improvements.md
      - docs/process-improvements.yml
      - .ft/process/process.yml
    prompt: |
      Analise o ciclo pelo lado do PROCESSO, nao do produto.

      Fontes obrigatorias:
      - o log do ciclo (<cycle>_log.md na raiz do ciclo);
      - docs/retro.md;
      - docs/critical-analysis.md;
      - motivos de retry/BLOCK e resultados BYPASSED registrados.

      Procure validators frageis ou especificos demais, descricoes ambiguas,
      gates com falso PASS, env_setup/env_teardown inseguros e hardcodes de
      porta, path, tecnologia, requisito ou identificador do produto.

      Para cada achado, use um ID PI-NNN e aplique esta regua:

      1. global_candidate somente quando TODOS forem verdadeiros:
         - domain_independent: serve para projetos de dominios diferentes;
         - no_product_identifiers: nao cita nomes, rotas, IDs, telas ou regras do produto;
         - configurable: diferencas entre projetos podem ser obtidas dos artefatos ou configuradas;
         - verified_in_cycle: ha evidencia concreta do ciclo ou simulacao retrospectiva reproduzivel;
         - backward_compatible: nao quebra projetos validos criados pelo template vigente.
      2. local quando a melhoria pertence ao fork deste projeto e ao menos um
         criterio global e falso. Aplique-a cirurgicamente em .ft/process/process.yml.
      3. rejected quando a proposta nao deve ser aplicada. Registre o motivo e
         nao altere o processo por causa dela.

      Uma regra util nao e automaticamente global. Se todos os cinco criterios
      forem verdadeiros, classifica-la como local e invalido. Nunca edite o repo
      do engine nem templates/; a promocao global pertence ao mantenedor.

      Gere docs/process-improvements.md com uma secao por PI-NNN contendo:
      classificacao, evidencia, antes/depois, paths alterados e justificativa.

      Gere docs/process-improvements.yml neste schema exato:

      schema_version: 1
      no_findings_reason: ""
      improvements:
        - id: PI-001
          title: "Titulo objetivo"
          classification: local  # local | global_candidate | rejected
          rationale: "Por que recebeu esta classificacao"
          evidence:
            - source: "cycle_log|retro|critical_analysis|retry|blocked|validator"
              detail: "Evidencia concreta e reproduzivel"
          criteria:
            domain_independent: false
            no_product_identifiers: false
            configurable: true
            verified_in_cycle: true
            backward_compatible: true
          change:
            applied_locally: true
            summary: "Mudanca aplicada ou motivo para nao aplicar"
            paths:
              - .ft/process/process.yml

      Para classification: global_candidate, acrescente:

          global:
            target: process_template  # process_template | engine | documentation
            summary: "Mudanca generica proposta"
            test_plan:
              - "Teste deterministico que deve passar antes da promocao"
            resolution:
              status: pending
              reason: ""
              reference: ""

      Para classification: rejected, use change.applied_locally: false e paths: [].
      Se nao houver nenhum achado, use improvements: [] e preencha
      no_findings_reason com a evidencia da analise. Nao invente achados para
      satisfazer quantidade minima.

      Mantenha o YAML do processo valido, os IDs e transicoes existentes e a
      estrutura de sprints. Nao crie/remova/reordene sprints ou nodes.
    validators:
      - file_exists: docs/process-improvements.md
      - file_exists: docs/process-improvements.yml
      - file_exists: .ft/process/process.yml
      - process_improvements_classified:
          path: docs/process-improvements.yml
          report_path: docs/process-improvements.md
      - command_succeeds: |
          python3 - <<'PY'
          import yaml

          data = yaml.safe_load(open(".ft/process/process.yml", encoding="utf-8"))
          nodes = data.get("nodes") if isinstance(data, dict) else None
          assert isinstance(nodes, list) and nodes, ".ft/process/process.yml deve ter lista top-level nodes"
          assert sum(1 for node in nodes if node.get("type") == "end") == 1, "processo deve ter exatamente um node type=end"
          assert all(node.get("id") and node.get("type") for node in nodes), "todos os nodes precisam de id e type"
          ids = [node["id"] for node in nodes]
          assert len(ids) == len(set(ids)), "ids de node precisam ser unicos"
          known = set(ids)
          references = []
          for node in nodes:
              for key in ("next", "reject_next"):
                  if node.get(key):
                      references.append((node["id"], key, node[key]))
              for target in (node.get("branches") or {}).values():
                  references.append((node["id"], "branches", target))
              on_fail = node.get("on_fail") or {}
              if on_fail.get("goto"):
                  references.append((node["id"], "on_fail.goto", on_fail["goto"]))
          dangling = [item for item in references if item[2] not in known]
          assert not dangling, f"referencias para nodes inexistentes: {dangling}"
          PY
    next: ft.explore

  - id: ft.explore
    type: exploration
    title: "Exploração Livre"
    description: "Espaço para pedidos livres ao LLM: experimentos, análises extras, ajustes pontuais ou qualquer coisa que não cabia no fluxo principal. Tudo fica registrado. Node opcional — use ft explore --skip para pular."
    optional: true
    next: ft.end

  # ================================================================
  # Fim
  # ================================================================

  # ================================================================
  # Rota direct — entrega focal com gates determinísticos
  #
  # Para demandas que não justificam a pipeline completa: uma construção,
  # gates determinísticos e UMA review com triagem de severidade. Mantém o
  # que dá garantia (build, suíte, smoke, recibo de review, dívida
  # registrada) e remove as camadas de auditoria sobrepostas.
  # ================================================================

  - id: ft.direct.01.build
    no_pre_seed: true
    type: build
    title: "Construir a Demanda com Testes"
    description: "Uma única passagem de construção: declarar as obrigações da demanda, implementá-las e cobri-las com testes."
    sprint: sprint-direct-01-build
    executor: claude
    max_turns: 120
    outputs:
      - src/
      - Makefile
      - docs/direct-plan.md
      - docs/PROJECT_BACKLOG.md
    write_scope:
      - src
      - tests
      - Makefile
      - docs/direct-plan.md
      - docs/PROJECT_BACKLOG.md
    prompt: |
      Entregue a demanda registrada em docs/demanda.md (ou, se ausente, em
      docs/feature-request.md) em uma única passagem de construção.

      1. Escreva docs/direct-plan.md declarando as obrigações verificáveis da
         demanda, uma por linha, numeradas D-001, D-002, ... Cada obrigação
         precisa ser observável de fora: comportamento, contrato ou saída.
         Este arquivo é o escopo do review final — obrigação não declarada
         não será auditada, e obrigação declarada e não entregue reprova.
      2. Implemente as obrigações em src/, com testes que as cubram. Os testes
         são a prova: cada D-* deve ter ao menos um teste que falharia sem a
         implementação.
      3. Crie ou atualize um Makefile não interativo na raiz do projeto com os
         targets `build`, `verify` e `smoke`. `verify` roda os checks
         herméticos completos (suíte, lint, typecheck) sem rede paga nem
         credencial real; `smoke` exercita o artefato construído pelo caminho
         público do produto. Os gates deste ciclo chamam exatamente esses
         targets — eles são o contrato entre a sua entrega e a verificação, e
         funcionam qualquer que seja o layout do projeto. Preserve o
         gerenciador de dependências já adotado (Poetry, uv, npm) e a versão
         de pacote do baseline.
      4. Execute `make build`, `make verify` e `make smoke` até ficarem verdes
         antes de encerrar.
      5. Registre em docs/PROJECT_BACKLOG.md os PB-* correspondentes à demanda,
         preservando IDs existentes e marcando como done apenas o que tem
         evidência real neste ciclo.

      Não abra escopo além da demanda. Encerre DONE.
    validators:
      - file_exists: docs/direct-plan.md
      - min_lines:
          path: docs/direct-plan.md
          n: 5
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - command_succeeds: "git diff --check"
    next: gate.direct.build

  - id: gate.direct.build
    no_pre_seed: true
    type: gate
    title: "Verificar Build e Suíte (determinístico)"
    description: "Checkpoint Python da construção: build do produto e suíte completa verde antes de gastar qualquer turno de review."
    sprint: sprint-direct-01-build
    executor: python
    validation_mode: fail_fast
    validators:
      - file_exists: docs/direct-plan.md
      - file_exists: Makefile
      - command_succeeds: "make build"
      - command_succeeds: "make verify"
    on_fail:
      human_gate: "Build ou suíte falharam na entrega direta."
      goto: ft.direct.02.fix
      automatic: true
    next: ft.direct.03.review

  - id: ft.direct.02.fix
    no_pre_seed: true
    type: build
    title: "Corrigir Apenas o Apontado"
    description: "Loop focal da rota direct: corrigir somente os achados correntes, sem reabrir a demanda."
    sprint: sprint-direct-01-build
    executor: claude
    max_turns: 60
    outputs:
      - src/
      - docs/direct-fix-report.md
    write_scope:
      - src
      - tests
      - Makefile
      - docs/direct-fix-report.md
    prompt: |
      Corrija SOMENTE os achados correntes — falha de build/suíte ou findings
      P0 do review. Não reabra obrigações já aprovadas nem amplie o escopo da
      demanda.

      Registre docs/direct-fix-report.md com achado→causa→path→teste→resultado
      e rode os testes focais dos arquivos alterados. Se a correção mudar o
      contrato de build, atualize o Makefile da raiz junto — `make build`,
      `make verify` e `make smoke` precisam continuar verdes. Encerre DONE.
    validators:
      - file_exists: docs/direct-fix-report.md
      - command_succeeds: "git diff --check"
    next: gate.direct.build

  - id: ft.direct.03.review
    no_pre_seed: true
    type: review
    title: "Review Único da Entrega"
    description: "A única auditoria LLM da rota: confronta cada obrigação declarada com o produto executável e classifica os achados por severidade."
    sprint: sprint-direct-02-review
    executor: codex
    max_turns: 60
    outputs:
      - docs/direct-review.md
      - docs/direct-review.yml
    write_scope:
      - docs/direct-review.md
      - docs/direct-review.yml
    prompt: |
      Audite a entrega contra docs/direct-plan.md. Para cada obrigação D-*,
      confronte o comportamento real do produto (executando-o ou seus testes)
      com o que foi declarado, e registre evidência verificável repo-local.

      Escreva docs/direct-review.md (parecer legível) e docs/direct-review.yml
      com `schema_version: 1`, `scope_sha256` dos bytes correntes de
      docs/direct-plan.md, `verdict`, `results` e `findings`:

          schema_version: 1
          scope_sha256: <sha256 de docs/direct-plan.md>
          verdict: APPROVED | APPROVED_WITH_FINDINGS | REJECTED
          results:
            - ref: D-001
              result: PASS | FAIL
              evidence: [<prova repo-local>]
          findings:
            - id: DR-001
              refs: [<obrigações reprovadas>]
              severity: P0 | P1 | P2
              summary: <defeito reproduzível>
              evidence: [<paths repo-local verificáveis>]

      Cubra exatamente os D-* do plano — nem a mais, nem a menos. Findings
      devem cobrir exatamente os results FAIL.

      SEVERIDADE (obrigatória em cada finding): `severity: P0|P1|P2`.
        P0 — bloqueante: obrigação não entregue, quebra funcional, dado
             corrompido ou falha de segurança/autorização.
        P1 — defeito real sem bloqueio.
        P2 — cosmético ou melhoria pontual.
      Escolha o veredito pela severidade, não pela existência de achados:
        APPROVED — nenhum FAIL e findings vazio.
        APPROVED_WITH_FINDINGS — há FAIL, mas nenhum finding P0: o ciclo segue
          e os achados viram dívida no backlog.
        REJECTED — existe ao menos um finding P0.
      Markdown e YAML devem declarar o mesmo veredito. Não altere código.
    validators:
      - file_exists: docs/direct-review.md
      - file_exists: docs/direct-review.yml
      - review_outcome_valid:
          path: docs/direct-review.yml
          markdown_path: docs/direct-review.md
          scope_path: docs/direct-plan.md
          scope_pattern: "\\bD-\\d+\\b"
    on_fail:
      human_gate: "O review da entrega direta encontrou defeito bloqueante."
      goto: ft.direct.02.fix
      automatic: true
    next: gate.direct.review

  - id: gate.direct.review
    no_pre_seed: true
    type: gate
    title: "Verificar a Entrega (determinístico)"
    description: "Checkpoint Python final da rota: recibo do review aprovado (com ou sem dívida), suíte verde e smoke real."
    sprint: sprint-direct-02-review
    executor: python
    validation_mode: fail_fast
    validators:
      - file_exists: docs/direct-review.yml
      - review_outcome_valid:
          path: docs/direct-review.yml
          markdown_path: docs/direct-review.md
          scope_path: docs/direct-plan.md
          scope_pattern: "\\bD-\\d+\\b"
          require_approved: true
          # Fix forward: P1/P2 seguem como dívida; P0 volta para correção.
          allow_findings: true
      - command_succeeds: "make verify"
      - command_succeeds: "make smoke"
    on_fail:
      human_gate: "A entrega direta não passou no checkpoint final."
      goto: ft.direct.02.fix
      automatic: true
    next: ft.direct.04.stakeholder

  - id: ft.direct.04.stakeholder
    no_pre_seed: true
    type: human_gate
    title: "Validação do Stakeholder"
    description: "Apresentar a entrega executável ao stakeholder e capturar o aceite ou os ajustes pedidos."
    sprint: sprint-direct-03-handoff
    executor: python
    outputs:
      - docs/stakeholder-feedback.md
    approval_message_required: true
    reject_next: ft.direct.02.fix
    next: ft.direct.05.handoff

  - id: ft.direct.05.handoff
    no_pre_seed: true
    type: retro
    title: "Consolidar Retro e Backlog"
    description: "Handoff compacto da rota direct: retro do ciclo e reconciliação do backlog, incluindo a dívida aceita pelo review."
    sprint: sprint-direct-03-handoff
    executor: claude
    max_turns: 40
    outputs:
      - docs/retro.md
      - docs/PROJECT_BACKLOG.md
    write_scope:
      - docs/retro.md
      - docs/PROJECT_BACKLOG.md
    prompt: |
      Consolide o encerramento da rota direct em um único turn:
      1. Gere docs/retro.md a partir do log do ciclo, distinguindo PASS,
         BLOCKED, REJECTED e BYPASSED.
      2. Atualize docs/PROJECT_BACKLOG.md sem renumerar PB-*: entregas com
         evidência recebem done; o que não entrou recebe deferred/blocked com
         decisão explícita.
      3. Dívida do fix forward: se docs/direct-review.yml tiver
         `verdict: APPROVED_WITH_FINDINGS`, abra um PB-* por finding aceito
         citando o id do finding (ex.: DR-002) no título ou nas notas, com
         prioridade derivada da severidade (P1 → P1, P2 → P2) e status
         deferred. Foi assim que o ciclo pôde seguir sem corrigir.
      Encerre DONE.
    validators:
      - file_exists: docs/retro.md
      - file_exists: docs/PROJECT_BACKLOG.md
      - project_backlog_valid:
          path: docs/PROJECT_BACKLOG.md
          min_items: 1
      - review_findings_tracked:
          review_paths:
            - docs/direct-review.yml
          backlog_path: docs/PROJECT_BACKLOG.md
    next: ft.end

  - id: ft.end
    type: end
    title: "Ciclo de Construção Concluído"
    description: >-
      O ciclo terminou, mas isso não declara o projeto entregue. Execute
      `ft close`, faça a validação pós-close no checkout promovido e consulte
      `ft project-status`. Somente `ft project-close` com DoD global READY
      altera o projeto para maintenance. O DoD deve incluir o gate
      operational-real-data APPROVED; dado sintético, mock, fixture, preview,
      visual-state ou seed demonstrativo nunca autoriza project-close.
